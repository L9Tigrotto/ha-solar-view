// Check: the forecast shape, from the sensor or built by the page, at fixed times in Rome
// (2026-10-25 is the 25 hour day: clocks go back at 03:00).
{
  const { forecastOf, scenarioHours, findForecast } = await import("../dist/forecast.js");
  const clock = clockOf("Europe/Rome");
  const at = Date.parse;
  // A sensor with every hour from midnight of `first` to the end of `last`: sun 1 kWh mid from 10 to 15.
  const sensorOf = (written, first, last, left, days) => {
    const hours = [];
    for (let t = at(`${first}T00:00:00+02:00`); clock(t).key <= last; t += 36e5) {
      const m = clock(t).hour >= 10 && clock(t).hour <= 15 ? 1 : 0;
      hours.push({ t: new Date(t).toISOString(), sun: [m / 2, m, m * 1.5], use: [0.3, 0.4, 0.6], cloud: 40, rain: 0, buy: 0.3, sell: null });
    }
    return { state: new Date(at(written)).toISOString(), attributes: { hours, left, days } };
  };
  // Sum of one field over a day's rows from now, the present hour by its part still ahead.
  const total = (rows, key, field, now) => rows.filter((r) => clock(r.t).key === key)
    .reduce((s, r) => s + r[field] * Math.min(1, (r.t + 36e5 - now) / 36e5), 0);
  const usual = { loadW: Array(24).fill(400), solarW: Array.from({ length: 24 }, (_, h) => (h >= 10 && h <= 15 ? 800 : 0)) };
  const price = { buy: 0.3, sell: 0.1 };
  const days = [{ d: "2026-10-24", sun: [3, 6, 9], use: [8, 9.6, 12] }, { d: "2026-10-25", sun: [4, 6, 8], use: [8, 9, 11] }];

  // Fresh, written at 10:40 (the 10:00 hour; under 3 h old), read at 13:30: hours from 13:00 copied,
  // left rebased (2.5 of the 6 sun hours left).
  const now = at("2026-10-24T13:30:00+02:00");
  const fresh = sensorOf("2026-10-24T10:40:00+02:00", "2026-10-24", "2026-10-25", { sun: [3, 6, 9], use: [4, 4.6, 5.5] }, days);
  const a = forecastOf({ sensor: fresh, now, clock, solarWh: {}, usual, price });
  console.assert(a?.from === "sensor" && a.cloud === true, "forecast: fresh sensor not used", a);
  console.assert(a.hours[0].t === at("2026-10-24T13:00:00+02:00") && a.hours.length === 11 + 25, "forecast: sensor hours not from the present hour", a.hours);
  console.assert(same(a.hours[1], { t: at("2026-10-24T14:00:00+02:00"), sun: [0.5, 1, 1.5], use: [0.3, 0.4, 0.6], cloud: 40, rain: 0, buy: 0.3, sell: null }), "forecast: sensor hour not copied", a.hours[1]);
  console.assert(same(a.left.sun.map(r3), [1.25, 2.5, 3.75]), "forecast: left.sun not rebased to now", a.left);
  // Use 0.4 an hour: 4.2 of the 5.6 from 10:00 to midnight is left.
  console.assert(same(a.left.use.map(r3), [3, 3.45, 4.125]), "forecast: left.use not rebased to now", a.left);
  console.assert(same(a.days, days) && a.months === null, "forecast: days or months not copied", a);

  // Stale (4 h old) or missing: built by the page from solarWh, the usual day where solarWh has no key, and the prices.
  const solarWh = { [at("2026-10-24T14:00:00+02:00")]: 2000, [at("2026-10-24T15:00:00+02:00")]: 0 };
  const stale = sensorOf("2026-10-24T09:30:00+02:00", "2026-10-24", "2026-10-25", { sun: [3, 6, 9], use: [4, 4.6, 5.5] }, days);
  const p = forecastOf({ sensor: stale, now, clock, solarWh, usual, price });
  console.assert(p?.from === "page" && p.cloud === false && p.months === null, "forecast: stale sensor used", p);
  console.assert(same(p, forecastOf({ sensor: undefined, now, clock, solarWh, usual, price })), "forecast: missing and stale sensor differ");
  console.assert(same(p.hours.slice(0, 3).map((h) => h.sun), [[0.8, 0.8, 0.8], [2, 2, 2], [0, 0, 0]]), "forecast: page sun not from solarWh, then the usual day", p.hours);
  console.assert(same(p.hours[0], { t: at("2026-10-24T13:00:00+02:00"), sun: [0.8, 0.8, 0.8], use: [0.4, 0.4, 0.4], cloud: null, rain: null, buy: 0.3, sell: 0.1 }), "forecast: page hour wrong", p.hours[0]);
  console.assert(p.hours.length === 11 + 25 && p.hours.at(-1).t === at("2026-10-25T23:00:00+01:00"), "forecast: page hours not to the end of tomorrow", p.hours);
  console.assert(same(p.left.sun.map(r3), [2.4, 2.4, 2.4]) && same(p.left.use.map(r3), [4.2, 4.2, 4.2]), "forecast: page left wrong", p.left);
  console.assert(same(p.days.map((d) => [d.d, ...d.sun.map(r3), ...d.use.map(r3)]), [["2026-10-24", 5.2, 5.2, 5.2, 9.6, 9.6, 9.6], ["2026-10-25", 4.8, 4.8, 4.8, 10, 10, 10]]), "forecast: page days wrong", p.days);
  console.assert(forecastOf({ sensor: stale, now, clock, solarWh, usual: null, price }) === null && forecastOf({ sensor: undefined, now, clock, solarWh, usual: null, price }) === null, "forecast: built without a usual day");
  console.assert(forecastOf({ sensor: fresh, now, clock, solarWh, usual: null, price })?.from === "sensor", "forecast: fresh sensor needs no usual day");

  // Written yesterday at 23:30, read at 00:40: today from days by d and from hours, never the old left.
  const late = at("2026-10-24T00:40:00+02:00");
  const night = sensorOf("2026-10-23T23:30:00+02:00", "2026-10-23", "2026-10-24", { sun: [0, 0, 0], use: [0.1, 0.2, 0.3] }, [{ d: "2026-10-23", sun: [1, 2, 3], use: [5, 6, 7] }, ...days]);
  const n = forecastOf({ sensor: night, now: late, clock, solarWh: {}, usual, price });
  console.assert(n?.from === "sensor" && n.days[0].d === "2026-10-24" && same(n.days.find((d) => d.d === "2026-10-24"), days[0]), "forecast: today not taken from days by date", n?.days);
  // Today's entry rebased from the start of today: all 6 sun hours ahead; use 9.333 of 9.6 (00:40 on).
  console.assert(same(n.left.sun.map(r3), [3, 6, 9]) && same(n.left.use.map(r3), [7.778, 9.333, 11.667]), "forecast: left after midnight not rebased from today's entry", n.left);
  // Without today's entry the hours are summed: 23 hours and a third of use 0.3 / 0.4 / 0.6.
  const bare = structuredClone(night);
  bare.attributes.days = bare.attributes.days.filter((d) => d.d !== "2026-10-24");
  const nb = forecastOf({ sensor: bare, now: late, clock, solarWh: {}, usual, price });
  console.assert(same(nb.left.sun.map(r3), [3, 6, 9]) && same(nb.left.use.map(r3), [7, 9.333, 14]), "forecast: left after midnight without today's entry not summed from hours", nb.left);

  // A switched-off prediction (null fields), a bad t or a duplicated hour must not throw or count twice.
  const broken = (edit) => { const s = structuredClone(fresh); edit(s.attributes); return forecastOf({ sensor: s, now, clock, solarWh, usual, price }); };
  try {
    console.assert(broken((x) => { x.left.sun = null; })?.from === "page", "forecast: null left.sun used");
    console.assert(broken((x) => { x.hours[15].sun = null; })?.from === "page", "forecast: null hour sun used");
    // Mode Weather (house use switched off): still the sensor's sun, cloud and rain, with no use left.
    for (const edit of [(x) => { x.left.use = null; }, (x) => { x.hours[15].use = null; }, (x) => { x.hours.forEach((h) => { h.use = null; }); x.left.use = null; x.days.forEach((d) => { d.use = null; }); }]) {
      const w = broken(edit);
      console.assert(w?.from === "sensor" && w.left.use === null && same(w.left.sun.map(r3), [1.25, 2.5, 3.75]) && w.hours[0].cloud === 40, "forecast: a sensor without house use not kept for its sun and sky", w);
    }
    const noTomorrow = broken((x) => { x.days[1].sun = null; });
    console.assert(noTomorrow?.from === "sensor" && scenarioHours(noTomorrow, "bad", now, clock).length === 36, "forecast: null tomorrow sun broke the scenario");
    const badT = broken((x) => { x.hours.push({ ...x.hours[0], t: "nope" }); });
    console.assert(badT?.from === "sensor" && badT.hours.length === 36, "forecast: bad t not skipped", badT);
    const twice = broken((x) => { x.hours.push({ ...x.hours[11] }); });
    console.assert(twice.hours.length === 36 && r3(twice.left.sun[1]) === 2.5, "forecast: a duplicated hour counted twice", twice);
  } catch (e) { console.assert(false, "forecast: broken sensor threw", e); }

  // 25 hour day: 49 hours, no hour twice by t, the last at 23:00 tomorrow; the page walk lands there too.
  const dst = at("2026-10-25T01:00:00+02:00");
  const long = sensorOf("2026-10-25T01:00:00+02:00", "2026-10-25", "2026-10-26", { sun: [3, 6, 9], use: [4, 4.6, 5.5] }, [{ d: "2026-10-25", sun: [4, 6, 8], use: [8, 9, 11] }, { d: "2026-10-26", sun: [3, 6, 9], use: [8, 9.6, 12] }]);
  console.assert(long.attributes.hours.length === 49, "forecast: the 25 hour day mock is not 49 hours");
  const mid = scenarioHours(forecastOf({ sensor: long, now: dst, clock, solarWh: {}, usual, price }), "mid", dst, clock);
  console.assert(mid.length === 24 + 24 && new Set(mid.map((h) => h.t)).size === mid.length && mid.at(-1).t === at("2026-10-26T23:00:00+01:00"), "forecast: 25 hour day walked wrong", mid);
  console.assert(mid.filter((h) => clock(h.t).key === "2026-10-25" && clock(h.t).hour === 2).length === 2, "forecast: 25 hour day lost its second 02:00", mid);
  const built = forecastOf({ sensor: undefined, now: at("2026-10-25T00:00:00+02:00"), clock, solarWh: {}, usual, price });
  console.assert(built.hours.length === 49 && built.hours.at(-1).t === at("2026-10-26T23:00:00+01:00") && same(built.days.map((d) => d.d), ["2026-10-25", "2026-10-26"]), "forecast: page walk on the 25 hour day wrong", built);

  // Scenarios keep the mid shape, scaled to left today and to tomorrow's entry in days.
  for (const [kind, i] of [["bad", 0], ["good", 2], ["mid", 1]]) {
    const rows = scenarioHours(a, kind, now, clock);
    console.assert(r3(total(rows, "2026-10-24", "sun", now)) === r3(a.left.sun[i]) && r3(total(rows, "2026-10-25", "sun", now)) === days[1].sun[i], `scenario ${kind}: sun totals wrong`, rows);
    console.assert(r3(total(rows, "2026-10-24", "use", now)) === r3(a.left.use[2 - i]) && r3(total(rows, "2026-10-25", "use", now)) === days[1].use[2 - i], `scenario ${kind}: use totals wrong`, rows);
    console.assert(rows.every((h) => (h.sun > 0) === (clock(h.t).hour >= 10 && clock(h.t).hour <= 15)), `scenario ${kind}: mid shape lost`, rows);
    // days without today's entry: tomorrow is still found by d, not by position.
    const shifted = forecastOf({ sensor: sensorOf("2026-10-24T10:40:00+02:00", "2026-10-24", "2026-10-25", { sun: [3, 6, 9], use: [4, 4.6, 5.5] }, [days[1]]), now, clock, solarWh: {}, usual, price });
    const rest = scenarioHours(shifted, kind, now, clock);
    console.assert(r3(total(rest, "2026-10-25", "sun", now)) === days[1].sun[i] && r3(total(rest, "2026-10-25", "use", now)) === days[1].use[2 - i], `scenario ${kind}: tomorrow not found by date`, rest);
  }

  // The sensor is found by platform when renamed, else by its fixed id.
  const A = { state: "a" }, B = { state: "b" };
  console.assert(findForecast({ entities: { "sensor.other": { platform: "x" }, "sensor.my_forecast": { platform: "solar_view" } }, states: { "sensor.other": B, "sensor.my_forecast": A, "sensor.solar_view_forecast": B } }) === A, "findForecast: renamed entity not found");
  console.assert(findForecast({ entities: {}, states: { "sensor.solar_view_forecast": B } }) === B && findForecast({ states: {} }) === undefined, "findForecast: fallback wrong");
}

// Check: what the page derives from the forecast (ghosts, lasts until, best time, money, month end),
// at fixed times in Rome.
{
  const { lookAhead, bestWindow, scenarioHours } = await import("../dist/forecast.js");
  const clock = clockOf("Europe/Rome");
  const at = Date.parse, H = 36e5;
  // A forecast from the present hour to the end of tomorrow, sun and use by clock hour, low and high
  // `spread` apart; left and days summed from the hours, the present hour by its part ahead.
  const aheadOf = (now, sun, use = () => 0.3, spread = 0, buy = () => 0.3) => {
    const hours = [], keys = new Set();
    const r = (m) => [m * (1 - spread), m, m * (1 + spread)];
    for (let t = now - (now % H); keys.add(clock(t).key).size < 3; t += H) {
      const { hour: h, key } = clock(t);
      hours.push({ t, sun: r(sun(h, key)), use: r(use(h)), cloud: null, rain: null, buy: buy(h), sell: 0.1 });
    }
    const sum = (key, f, from) => hours.filter((h) => clock(h.t).key === key)
      .reduce((s, h) => s.map((v, i) => v + h[f][i] * Math.min(1, (h.t + H - from) / H)), [0, 0, 0]);
    const [d0, d1] = keys;
    return { from: "sensor", hours, left: { sun: sum(d0, "sun", now), use: sum(d0, "use", now) },
      days: [d0, d1].map((d) => ({ d, sun: sum(d, "sun", -Infinity), use: sum(d, "use", -Infinity) })), months: null, cloud: false };
  };
  const battery = { kwh: 10, floor: 20, maxChargeKw: null, efficiency: 0.95 };
  const settings = { exportMaxKw: null, standbyKwhPerHour: 0 };
  const soFar = { solarKwh: 3, loadKwh: 4, batteryKwh: 1, gridImportKwh: 0.5, gridExportKwh: 0.2, saved: 0.9, cost: 0.15, earned: 0.02, paid: 1.05 };
  const day = (h) => (h >= 10 && h <= 15 ? 2 : 0);
  try {
    // Whiskers: a sunny day with a spread, at 11:00.
    const sunnyAt = at("2026-10-24T11:00:00+02:00");
    const sunny = aheadOf(sunnyAt, (h) => (h >= 8 && h <= 16 ? 1.5 : 0), () => 0.3, 0.3);
    const o = lookAhead(sunny, sunnyAt, clock, { soc: 60, loadW: 300, solarW: 1500 }, battery, settings, soFar);
    const soFarOf = { made: "solarKwh", used: "loadKwh", fromBatt: "batteryKwh", fromGrid: "gridImportKwh", sent: "gridExportKwh", saved: "saved", cost: "cost", earned: "earned", paid: "paid" };
    for (const [k, [lo, mid, hi]] of Object.entries(o.tonight))
      console.assert([lo, mid, hi].every(Number.isFinite) && lo <= mid && mid <= hi && (k === "homeMade" ? hi <= 1 && lo >= 0
        : mid >= (k === "fromSun" ? soFar.loadKwh - soFar.batteryKwh - soFar.gridImportKwh : soFar[soFarOf[k]])), `lookAhead: ${k} range wrong`, o.tonight[k]);
    console.assert(o.tonight.made[0] < o.tonight.made[2] && o.tonight.used[0] < o.tonight.used[2], "lookAhead: three runs give no whisker", o.tonight);
    const noBatt = lookAhead(sunny, sunnyAt, clock, { soc: null, loadW: 300, solarW: 1500 }, null, settings, soFar);
    console.assert(noBatt.tonight.fromBatt === null && Number.isFinite(noBatt.tonight.fromGrid[1]) && noBatt.lastsUntil === null, "lookAhead: no battery still has battery figures", noBatt);
    for (const kwh of [null, 0])
      console.assert(same(lookAhead(sunny, sunnyAt, clock, { soc: 60, loadW: 300, solarW: 1500 }, { ...battery, kwh }, settings, soFar), { tonight: null, lastsUntil: null, best: null, inHour: null, fills: false, socAhead: null, hoursAhead: null }), `lookAhead: battery size ${kwh} not hidden`);

    // In an hour: at 11:00 sharp the end of the first hour; at 11:30 half way through the second. The
    // range holds the mid and stays within the floor to 100 %; at the floor the battery cannot fall.
    const flat = aheadOf(sunnyAt, () => 0, () => 0.5);
    const inHour = (now, soc) => lookAhead(aheadOf(now, () => 0, () => 0.5), now, clock, { soc, loadW: 500, solarW: 0 }, battery, settings, soFar).inHour;
    console.assert(same(inHour(sunnyAt, 60).map(r3), [55, 55, 55]) && same(inHour(sunnyAt + H / 2, 60).map(r3), [55, 55, 55]), "in an hour: not 0.5 kWh down an hour on", inHour(sunnyAt, 60), inHour(sunnyAt + H / 2, 60));
    console.assert(same(inHour(sunnyAt, 20), [20, 20, 20]) && same(inHour(sunnyAt, 22).map(r3), [20, 20, 20]), "in an hour: fell under the floor", inHour(sunnyAt, 22));
    const spread = o.inHour;
    console.assert(spread && spread[0] <= spread[1] && spread[1] <= spread[2] && spread[0] >= battery.floor && spread[2] <= 100 && spread[0] < spread[2], "in an hour: range wrong", spread);
    console.assert(lookAhead(flat, sunnyAt, clock, { soc: null, loadW: 500, solarW: 0 }, battery, settings, soFar).inHour === null && noBatt.inHour === null, "in an hour: without a state of charge or a battery");
    // Fills: 2 kWh of sun an hour from 10 to 15, use 0.3. From 50 % at 9:00 the battery fills and sends
    // the rest; a 40 kWh battery never fills; from 16:00 the sun is gone for today.
    const fills = (now, b = battery) => lookAhead(aheadOf(now, day), now, clock, { soc: 50, loadW: 300, solarW: 0 }, b, settings, soFar).fills;
    console.assert(fills(at("2026-10-24T09:00:00+02:00")) === true && fills(at("2026-10-24T09:00:00+02:00"), { ...battery, kwh: 40 }) === false && fills(at("2026-10-24T16:00:00+02:00")) === false, "fills: wrong");

    // Lasts until: 10 kWh at 30 %, floor 20, 0.5 kWh an hour, no sun: 1 kWh, 2 hours.
    const night = at("2026-10-24T20:00:00+02:00"), half = at("2026-10-24T20:30:00+02:00");
    const lasts = (now, sun, n, use = () => 0.5, b = battery) => lookAhead(aheadOf(now, sun, use), now, clock, n, b, settings, soFar).lastsUntil;
    console.assert(lasts(night, () => 0, { soc: 30, loadW: 500, solarW: 0 }) === night + 2 * H, "lasts until: no sun not 2 hours", lasts(night, () => 0, { soc: 30, loadW: 500, solarW: 0 }));
    console.assert(lasts(night, (h) => (h >= 22 ? 0.5 : 0), { soc: 35, loadW: 500, solarW: 0 }) === Infinity, "lasts until: sun from the third hour is not until the sun takes over");
    // Empty just as the sun takes over counts as empty (<=, see lastsUntil).
    console.assert(lasts(night, (h) => (h >= 22 ? 0.5 : 0), { soc: 30, loadW: 500, solarW: 0 }) === night + 2 * H, "lasts until: empty as the sun takes over not empty");
    // Inside the present hour: 0.2 kWh at 1 kW from 20:30 is 12 minutes.
    console.assert(lasts(half, () => 0, { soc: 22, loadW: 1000, solarW: 0 }) === at("2026-10-24T20:42:00+02:00"), "lasts until: not 20:42 inside the present hour", lasts(half, () => 0, { soc: 22, loadW: 1000, solarW: 0 }));
    // Winter night, 8 kWh at 0.3 an hour: the floor at 26.7 h and sun from 16:00 tomorrow are both past 18 h; sun from 10:00 is not.
    const winter = (sun) => lasts(night, sun, { soc: 100, loadW: 300, solarW: 0 }, () => 0.3);
    console.assert(winter(() => 0) === null, "lasts until: a floor past 18 h gave a time", winter(() => 0));
    console.assert(winter((h, k) => (k === "2026-10-25" && h >= 16 ? 1 : 0)) === null, "lasts until: sun past 18 h gave until the sun takes over");
    console.assert(winter((h, k) => (k === "2026-10-25" && h >= 10 ? 1 : 0)) === Infinity, "lasts until: sun within 18 h not until the sun takes over");
    // The present hour at whichever is worse: 1 kW drawn now (0.5 kWh by 21:00), then 0.5 an hour.
    console.assert(lasts(half, () => 0, { soc: 30, loadW: 1000, solarW: 0 }) === at("2026-10-24T22:00:00+02:00"), "lasts until: present draw not used for the present hour", lasts(half, () => 0, { soc: 30, loadW: 1000, solarW: 0 }));
    console.assert(lasts(night, (h) => (h === 20 ? 0.5 : 0), { soc: 30, loadW: 500, solarW: 0 }) === night + 2 * H, "lasts until: forecast sun used over the present reading");
    console.assert(lasts(night, () => 0, { soc: 100, loadW: 10, solarW: 0 }, () => 0.01) === null, "lasts until: a floor far away gave a time");
    console.assert(lasts(night, () => 0, { soc: null, loadW: 500, solarW: 0 }) === null, "lasts until: no state of charge gave a time");

    // Best time: sun 2 kWh an hour from 10 to 15, use 0.3.
    const best = (now, sun, b = battery, soc = 50) => lookAhead(aheadOf(now, sun), now, clock, { soc, loadW: 300, solarW: 0 }, b, settings, soFar).best;
    const inSun = (w, sun) => w && w.to - w.from === 2 * H && [w.from, w.from + H].every((t) => sun(clock(t).hour) >= 0.5);
    const morning = best(at("2026-10-24T09:00:00+02:00"), day);
    console.assert(inSun(morning, day) && clock(morning.from).key === "2026-10-24" && clock(morning.from).hour >= 10 && clock(morning.to - H).hour <= 15, "best time: not today in the sun", morning);
    // Every window from 10 to 14 adds nothing with the same spare sun: the earliest wins.
    console.assert(morning?.from === at("2026-10-24T10:00:00+02:00"), "best time: a tie not to the earliest", morning);
    // A 20 kWh battery that never fills nor empties: the load adds no grid import but leaves 0.97 kWh
    // missing (1.02 to put back), over 0.2.
    console.assert(best(at("2026-10-24T09:00:00+02:00"), (h) => (h >= 10 && h <= 15 ? 0.6 : 0), { ...battery, kwh: 20 }) === null, "best time: energy missing from the battery not counted");
    const evening = best(at("2026-10-24T17:00:00+02:00"), day);
    console.assert(inSun(evening, day) && clock(evening.from).key === "2026-10-25", "best time: not tomorrow when today's sun is gone", evening);
    console.assert(best(at("2026-10-24T09:00:00+02:00"), (h) => (h >= 10 && h <= 15 ? 0.4 : 0)) === null, "best time: a window without enough sun");
    const holed = (h) => (h === 11 ? 0.4 : day(h));
    const hole = best(at("2026-10-24T09:00:00+02:00"), holed);
    console.assert(inSun(hole, holed) && hole.from === at("2026-10-24T12:00:00+02:00"), "best time: a window over an hour short of sun", hole);
    console.assert(best(at("2026-10-24T10:30:00+02:00"), day)?.from === at("2026-10-24T11:00:00+02:00"), "best time: started inside the present hour");
    // No battery and 0.3 spare an hour: the load takes 0.2 an hour from the grid, 0.4 in all, over 0.2.
    console.assert(best(at("2026-10-24T09:00:00+02:00"), (h) => (h >= 10 && h <= 15 ? 0.6 : 0), null) === null, "best time: shown though it adds over 0.2 kWh");
    // bestWindow straight on the mid rows, as lookAhead calls it.
    const nine = at("2026-10-24T09:00:00+02:00");
    console.assert(same(bestWindow(scenarioHours(aheadOf(nine, day), "mid", nine, clock), 50, battery, null, 1, clock), morning), "bestWindow: differs from lookAhead's best");

    // Money from 12:00, no battery: 4 sun hours (2 kWh) and 8 dark ones, use 0.5, standby 0.1 an hour.
    // saved 1 + 4 x 0.4 x 0.3 (dark hours 0, not below), cost 2 + 8 x 0.5 x 0.3, earned 4 x 1.5 x 0.1.
    // paid (the house with no system, standby left out) 3 + 12 x 0.4 x 0.3: in the dark hours the grid
    // also covers the standby, so paid is under saved plus cost.
    const noon = at("2026-10-24T12:00:00+02:00");
    const money = (buy, so = {}) => lookAhead(aheadOf(noon, (h) => (h >= 12 && h <= 15 ? 2 : 0), () => 0.5, 0, buy), noon, clock, { soc: null, loadW: 500, solarW: 2000 }, null,
      { exportMaxKw: null, standbyKwhPerHour: 0.1 }, { solarKwh: 0, loadKwh: 6, batteryKwh: 0, gridImportKwh: 3, gridExportKwh: 0, saved: 1, cost: 2, earned: 0, paid: 3, ...so }).tonight;
    const m = money(() => 0.3), x3 = (v) => [v, v, v];
    console.assert(same(Object.fromEntries(Object.entries(m).map(([k, v]) => [k, v && v.map(r3)])),
      { made: x3(8), used: x3(12), fromBatt: null, fromGrid: x3(7), sent: x3(6), saved: x3(1.48), cost: x3(3.2), earned: x3(0.6), paid: x3(4.44), fromSun: x3(5), homeMade: x3(0.271) }), "money: wrong", m);
    const noBuy = money((h) => (h === 20 ? null : 0.3));
    console.assert(noBuy.saved === null && noBuy.cost === null && noBuy.paid === null && same(noBuy.made.map(r3), x3(8)), "money: an hour without buy still priced", noBuy);
    console.assert(money(() => 0.3, { saved: null }).saved === null, "money: saved without a so far value");
    // From 12:30, no sun, 0.5 an hour: half the present hour plus 11, the present hour scaled once.
    const half12 = at("2026-10-24T12:30:00+02:00"), zero = { solarKwh: 0, loadKwh: 0, batteryKwh: 0, gridImportKwh: 0, gridExportKwh: 0, saved: 0, cost: 0, earned: 0 };
    const dark = lookAhead(aheadOf(half12, () => 0, () => 0.5), half12, clock, { soc: null, loadW: 500, solarW: 0 }, null, settings, zero).tonight;
    console.assert(r3(dark.used[1]) === 5.75 && r3(dark.fromGrid[1]) === 5.75 && r3(dark.cost[1]) === 1.725, "money: present hour scaled twice", dark);
    // Standby over today's 25 hours on 2026-10-25: (12.5 - 2.5 - 6) / (12.5 - 2.5), not 24 hours (0.406).
    const dstNoon = at("2026-10-25T12:00:00+01:00");
    const hm = lookAhead(aheadOf(dstNoon, () => 0, () => 0.5), dstNoon, clock, { soc: null, loadW: 500, solarW: 0 }, null, { exportMaxKw: null, standbyKwhPerHour: 0.1 }, { ...zero, loadKwh: 6.5 }).tonight.homeMade;
    console.assert(same(hm.map(r3), [0.4, 0.4, 0.4]), "home made: standby not over today's 25 hours", hm);

    // Month end: 120 so far + mean 6 x 6 days.

    // 25 hour day from 01:00: the best window lands on 10:00 by the clock, lasts until on the second 02:00.
    const dst = at("2026-10-25T01:00:00+02:00");
    const long = best(dst, day);
    console.assert(long?.from === at("2026-10-25T10:00:00+01:00") && clock(long.from).hour === 10, "best time: 25 hour day off by an hour", long);
    const end = lasts(dst, () => 0, { soc: 30, loadW: 500, solarW: 0 });
    console.assert(end === at("2026-10-25T02:00:00+01:00") && clock(end).hour === 2, "lasts until: 25 hour day off by an hour", end);
  } catch (e) { console.assert(false, "lookAhead: threw", e); }
}

// Check: money so far, hour by hour, at each hour's price; standby left out of the savings, never below 0.
{
  const { moneySoFar } = await import("../dist/forecast.js");
  const H = 36e5;
  const hours = { [H]: { loadKwh: 1, gridImportKwh: 0.2, gridExportKwh: 0 }, [2 * H]: { loadKwh: 0.5, gridImportKwh: 0, gridExportKwh: 1 },
    [3 * H]: { loadKwh: 0.05, gridImportKwh: 0.05, gridExportKwh: 0 } };
  const buy = (t) => (t === H ? 0.3 : 0.2);
  // saved (1 - 0.1 - 0.2) x 0.3 + (0.5 - 0.1) x 0.2 + 0, cost 0.2 x 0.3 + 0.05 x 0.2, earned 1 x 0.1.
  // paid (what the house would pay with no system, standby left out) (1 - 0.1) x 0.3 + (0.5 - 0.1) x 0.2 + 0:
  // in the third hour the grid covers only the standby, which costs but is not the house's.
  const m = moneySoFar(hours, buy, () => 0.1, 0.1, 4 * H);
  console.assert(r3(m.saved) === 0.29 && r3(m.cost) === 0.07 && r3(m.earned) === 0.1 && r3(m.paid) === 0.35, "money so far: wrong", m);
  const unknown = moneySoFar(hours, (t) => (t === 2 * H ? null : 0.3), () => null, 0.1, 4 * H);
  console.assert(unknown.saved === null && unknown.cost === null && unknown.earned === null && unknown.paid === null, "money so far: an hour without a price still priced", unknown);
  // Half the present hour gone: half its standby. (0.5 - 0.1) x 1.
  const part = moneySoFar({ [H]: { loadKwh: 0.5, gridImportKwh: 0, gridExportKwh: 0 } }, () => 1, () => 1, 0.2, 1.5 * H);
  console.assert(r3(part.saved) === 0.4 && r3(part.paid) === 0.4, "money so far: standby of the present hour not by the part passed", part);
}

// Check: the Energy page's today card and the Money page's today card. With a forecast and prices: the money
// ring, its sentence and the price now; the best time on the today card (today's window, or tomorrow's when
// today's sun is gone, inside the mock's sunny hours); a column each for made, used, from sun, from battery,
// from grid and sent (export on), each with a faded column at least as tall as the solid one and a whisker
// around its top. A usual day draws two dashed lines on Made and Used. Without what they need they go, and
// the columns stay.
{
  const t = STRINGS.en, H = 36e5, clock = clockOf(TZ);
  const money = formats("en", "EUR", "h12").money;
  const has = (p, sel) => !!p.shadowRoot.querySelector(sel);
  const cols = (p) => [...p.shadowRoot.querySelectorAll("#energy .today .cols .col")];
  const num = (el, a) => +el.getAttribute(a);
  const fits = (p) => cols(p).every((c) => {
    const g = c.querySelector(".ghost"), v = c.querySelector(".val"), w = c.querySelector(".whisker");
    if (!g || !w) return !w && (!g || num(g, "height") >= num(v, "height")); // one value: a faded column alone
    return num(g, "height") >= num(v, "height") && num(w, "y1") <= num(g, "y") && num(g, "y") <= num(w, "y2") && num(w, "y2") - num(w, "y1") >= 0;
  });
  const ghosts = (p) => cols(p).filter((c) => c.querySelector(".ghost")).length;
  const colored = (p, c) => cols(p).filter((el) => el.getAttribute("style").includes(`var(${c})`)).length;
  const clean = (p) => !/NaN/.test(p.shadowRoot.getElementById("energy").innerHTML + p.shadowRoot.getElementById("money").innerHTML);
  // The mock's sun runs from 10:00 to 15:00, today and tomorrow.
  const days = [0, -1].map((i) => clock(localMidnight(i) + 12 * H).key);
  const sunny = (t) => days.includes(clock(t).key) && clock(t).hour >= 10 && clock(t).hour <= 15;

  let p = await draw(fakeHass(SCENARIOS.sunny), en);
  const best = p._outlook?.best;
  // Money starts with the month: no ring of today's money or share.
  console.assert(!has(p, ".savings") && !has(p, "#money .share"), "money: a today card still drawn");
  console.assert(best && sunny(best.from) && sunny(best.to - H) && has(p, "#energy .today .best"), "today sunny: no best time inside the sunny hours of today or tomorrow", best && [new Date(best.from), new Date(best.to)]);
  console.assert(cols(p).length === 6 && ghosts(p) === 6 && fits(p) && clean(p), "today sunny: not six columns with faded columns and whiskers around them", cols(p).map((c) => c.outerHTML));
  console.assert(cols(p).map((c) => c.getAttribute("aria-label").split(":")[0]).join("|") === [t.colMade, t.colUsed, t.colSun, t.colBatt, t.colGrid, t.colSent].join("|"), "today sunny: columns not made, used, from sun, from battery, from grid, sent", cols(p).map((c) => c.getAttribute("aria-label")));
  console.assert(cols(p).every((c) => /\d/.test(c.getAttribute("aria-label"))) && !has(p, "#energy .usual"), "today sunny: a column without its sentence, or a usual day without hour rows");

  // One value is not a range. The sensor's forecast (sunny) has whiskers and says "likely"; the page's own
  // (stale) has low = mid = high: no zero-length whisker, no range on the ring, never "likely 10 to 10".
  const named = (p) => [...p.shadowRoot.querySelectorAll("#energy .today [aria-label]")];
  const likely = (p) => named(p).some((el) => el.getAttribute("aria-label").includes(" likely "));
  const flat = (p) => [...p.shadowRoot.querySelectorAll("#energy .today .whisker")].some((w) => num(w, "y1") === num(w, "y2"));
  // Late in the day what is left can round to one value: then every range may go, but a whisker still goes with "likely".
  const both = (p) => cols(p).every((c) => !!c.querySelector(".whisker, .range") === c.getAttribute("aria-label").includes(" likely "));
  console.assert(both(p) && !flat(p) && (clock(Date.now()).hour >= 22 || (has(p, "#energy .today .whisker") && likely(p))), "today sunny: no range drawn or named, or a whisker without its range",
    cols(p).map((c) => c.getAttribute("aria-label")));
  const stale = await draw(fakeHass(SCENARIOS.stale), en);
  console.assert(ghosts(stale) >= 1 && fits(stale) && !flat(stale) && !likely(stale), "today stale: one value drawn or named as a range",
    named(stale).map((el) => el.getAttribute("aria-label")));
  // The usual day (stale has 14 days of hour rows, 0.5 kWh of sun an hour): two dashed lines on Made and on
  // Used, the lower at the usual day by now, the upper at its whole 12 kWh, both named; none on the others.
  const usual = cols(stale).map((c) => [...c.querySelectorAll(".usual")].map((l) => num(l, "y1")));
  const whole = t.hUsual.split("{a}")[1].replace("{b}", "12");
  console.assert(usual.map((u) => u.length).join(" ") === "2 2 0 0 0 0" && usual.slice(0, 2).every(([now, all]) => now >= all)
    && cols(stale).slice(0, 2).every((c) => c.getAttribute("aria-label").endsWith(whole)), "today stale: the usual day not drawn on made and used, or not named", usual, cols(stale).map((c) => c.getAttribute("aria-label")));

  // No battery: no battery column or ghost; the other ghosts and the best time stay.
  p = await draw(fakeHass({ ...SCENARIOS.nobattery, ahead: "sunny" }), en);
  // Sent has its own colour, apart from the grid's, in the legend too.
  console.assert(colored(p, "--sent") === 1 && colored(p, "--grid") === 1 && $(p, "#energy .today .legend li:last-child i").getAttribute("style").includes("var(--sent)"), "today: sent drawn in the grid colour");
  console.assert(colored(p, "--batt") === 0 && cols(p).length === 5 && ghosts(p) === 5 && fits(p) && has(p, ".best") && clean(p), "today without battery: a battery column, or ghosts or best time missing", cols(p).length, ghosts(p));
  // A battery of unknown size: nothing for tonight, so the share ring instead of columns; no best time, no sentence.
  p = await draw(fakeHass(SCENARIOS.battUnknown), en);
  console.assert(cols(p).length === 0 && has(p, "#energy .today.share svg.ring") && !has(p, ".best") && !has(p, ".by") && !has(p, ".savings") && has(p, ".share") && clean(p), "today, battery of unknown size: forecast figures drawn");

  // No buying price anywhere (Energy settings or sensor): no price now, the kWh ghosts stay.
  const h = fakeHass(SCENARIOS.sunny), prefs = fakePrefs(SCENARIOS.sunny);
  h.states["sensor.solar_view_forecast"].attributes.hours.forEach((x) => { x.buy = x.sell = null; });
  prefs.energy_sources.forEach((s) => { delete s.number_energy_price; delete s.number_energy_price_export; });
  p = await draw(h, { ...en, callWS: async (m) => (m.type === "energy/get_prefs" ? prefs : h.callWS(m)) });
  console.assert(!has(p, ".price") && cols(p).length === 6 && ghosts(p) === 6 && fits(p) && clean(p), "today without prices: a price drawn, or ghosts lost");

  // First days and no forecast: no prediction at all, so the share ring instead of columns; no sentence, no best time.
  for (const k of ["firstDays", "midday"]) {
    p = await draw(fakeHass(SCENARIOS[k]), en);
    console.assert(cols(p).length === 0 && has(p, "#energy .today.share svg.ring") && !has(p, ".by") && !has(p, ".best") && has(p, ".share") && clean(p), `today ${k}: forecast figures without a forecast`);
  }

  // Export off, battery full: no sent column, and spare sun is lost, not made. What is made from now on stays
  // within what the house uses, what the battery gives back (and so can take again, before its losses) and what is sent.
  p = await draw(fakeHass(SCENARIOS.exportOffFull), en, configOf(SCENARIOS.exportOffFull));
  const o = p._outlook?.tonight, d = p._stats?.today;
  const used = d && d.solarKwh + d.batteryKwh + d.gridImportKwh - d.chargeKwh - d.gridExportKwh;
  console.assert(o && o.made[1] - d.solarKwh <= o.used[1] - used + (o.fromBatt[1] - d.batteryKwh) / p._stats.efficiency + (o.sent[1] - d.gridExportKwh) + 1e-6
    && o.sent[1] - d.gridExportKwh === 0 && ghosts(p) >= 1 && colored(p, "--sent") === 0 && cols(p).length === 5, "today export off and full: lost sun counted as made, or a sent column", o, d);
}

// Check: the Now page. In order: header, flow, advice, battery. The battery ring: the percentage alone in
// its middle, the battery size in the gap when known. The battery in an hour, at fixed times today (the
// mock's sun runs from 10:00 to 15:00): rising at 11:00 (a faded --batt piece past the solid end, the
// outer arc around it), falling at 21:00 (a faded --low piece), never falling at the floor, no outer arc
// from the page's own forecast; the hint says it. The advice from the outlook: short, okLasts, fills. The
// "?" opens a modal dialog and gives focus back. The tabs have icons. The icon over the flow follows the
// present hour, the moon its phase.
{
  const t = STRINGS.en, real = Date.now;
  // A panel drawn with the clock at hour h today (null: the real clock); the clock stays there while it
  // loads. `s` is a scenario's name, a scenario, or a function that makes the fake hass (at that hour).
  const at = async (s, h) => {
    const when = h === null ? null : new Date(Date.now()).setHours(h, 0, 0, 0);
    if (when) Date.now = () => when;
    try {
      const hass = typeof s === "function" ? s() : fakeHass(typeof s === "string" ? SCENARIOS[s] : s);
      return await draw(hass, en, configOf(typeof s === "string" ? SCENARIOS[s] : s));
    } finally { Date.now = real; }
  };
  const now = (p) => p.shadowRoot.getElementById("now");
  const ring = (p) => $(p, ".battery svg.ring"), soon = (p) => $(p, ".battery .ring .soon"), arc = (p) => $(p, ".battery .ring .range");
  const colour = (el) => el?.getAttribute("style").match(/var\(--(\w+)-mark/)?.[1];
  const withSoc = (s, soc) => () => { const h = fakeHass(s); h.states[ID.soc] = { state: String(soc), attributes: {} }; return h; };
  const night = { ...SCENARIOS.evening, ahead: "sunny" };
  try {
    let p = await at("sunny", null);
    console.assert([...now(p).children].map((el) => el.localName === "section" ? el.classList[1] : el.localName).join(" ") === "header div advice battery", "now: not header, flow, advice, battery", [...now(p).children].map((el) => el.className));
    console.assert(!$(p, ".battery .ring-mid .num") && $(p, ".battery .ring .size")?.textContent === "10 kWh", "now: the kWh line still under the percentage, or no size in the gap");
    console.assert(!$(await at("battUnknown", null), ".battery .ring .size"), "now: a size for a battery of unknown size");
    // The tab bar: an icon above each label, hidden from screen readers.
    console.assert([...p.shadowRoot.querySelectorAll(".tabs button")].every((b) => b.querySelector("svg[aria-hidden=true]") && b.textContent.trim() === b.lastChild.textContent && b.lastChild.textContent), "tabs: a tab without its icon or label");

    // Rising at 11:00: the piece past the solid end, in --batt, the outer arc around its end; the hint says both.
    p = await at("sunny", 11);
    const up = p._outlook?.inHour, s70 = 70;
    console.assert(up && up[1] - s70 >= 1 && colour(soon(p)) === "batt" && colour(arc(p)) === "batt", "in an hour, sunny at 11: no rising piece in --batt with its arc", up, soon(p)?.outerHTML);
    console.assert(+ring(p).querySelector(".val").getAttribute("stroke-dasharray").split(" ")[0] === s70, "in an hour, rising: the solid arc does not end at now");
    console.assert(ring(p).getAttribute("aria-label") === say(t.hRingSoon, { p: s70, a: Math.round(up[1]), b: Math.round(up[0]), c: Math.round(up[2]) }), "in an hour, rising: hint wrong", ring(p).getAttribute("aria-label"));
    // Falling at 21:00: the solid arc ends at the battery in an hour, the piece up to now in --low.
    p = await at(night, 21);
    const down = p._outlook?.inHour;
    console.assert(down && 60 - down[1] >= 1 && colour(soon(p)) === "low" && Math.abs(+ring(p).querySelector(".val").getAttribute("stroke-dasharray").split(" ")[0] - down[1]) < 0.1, "in an hour, evening at 21: no falling piece in --low ending at the battery in an hour", down);
    console.assert(!arc(p) || colour(arc(p)) === "low", "in an hour, falling: the outer arc not in --low");
    console.assert(down[0] >= 20 && down[0] <= down[1] && down[1] <= down[2] && down[2] <= 100, "in an hour: range outside the floor to 100, or not around its mid", down);
    // At the floor it cannot fall: nothing drawn. The page's own forecast (stale): a piece, never an outer arc.
    p = await at(withSoc(night, 20), 21);
    console.assert(!soon(p) && ring(p).getAttribute("aria-label") === say(t.hRing, { p: 20, k: "2 kWh" }), "in an hour: a fall drawn at the floor", soon(p)?.outerHTML);
    p = await at("stale", 11);
    console.assert(p._ahead?.from === "page" && !arc(p) && !ring(p).getAttribute("aria-label").includes(" likely "), "in an hour: a range from the page's own forecast");
    // Under 1 point of change, nothing: no sun and no use for the next hours, a full battery.
    p = await at(() => {
      const h = fakeHass(SCENARIOS.exportOffFull);
      h.states["sensor.solar_view_forecast"].attributes.hours.forEach((x) => { x.use = [0, 0, 0]; });
      return h;
    }, 21);
    console.assert(!soon(p) && !arc(p), "in an hour: drawn under 1 point of change");

    // Advice from the outlook: at 21:00 the battery runs out before the sun takes over (short), or lasts (okLasts);
    // at 11:00 with no spare sun now it fills later and sends the rest (fills).
    const adv = (p) => [$(p, ".advice").dataset.kind, $(p, ".advice p").textContent, $(p, ".batt-say p").textContent];
    let [kind, line, says] = adv(await at(night, 21));
    console.assert(kind === "short" && t.adviceShort.includes(line) && /\d/.test(says), "advice: evening, battery out before the sun, not short", kind, line, says);
    [kind, line, says] = adv(await at(withSoc(night, 100), 21));
    console.assert(kind === "okLasts" && t.adviceOkLasts.includes(line) && says === t.untilSun, "advice: evening, battery lasts, not okLasts", kind, line, says);
    [kind, line] = adv(await at({ ...SCENARIOS.cloudy, ahead: "sunny" }, 11));
    console.assert(kind === "fills" && t.adviceFills.includes(line), "advice: by day, the battery fills, not fills", kind, line);
    [kind] = adv(await at({ ...SCENARIOS.evening, forecast: null }, 21));
    console.assert(kind === "ok", "advice: short or okLasts without a forecast", kind);

    // Mode Weather (no house use from the sensor): the sky and its icon from the sensor, no outlook, so no
    // battery in an hour, no ghosts on Energy, "lasts until" from the present draw.
    p = await at({ ...SCENARIOS.cloudy, noUse: true }, 11);
    console.assert(p._ahead?.from === "sensor" && p._outlook === null && $(p, ".flow .sky-icon")?.dataset.icon === "sun cloud"
      && p.style.getPropertyValue("--sv-sky1") === skyAt(SCENARIOS.cloudy.v[4], false, dark, greyOf(80)).colors[0]
      && !soon(p) && !p.shadowRoot.querySelector("#energy .today .cols .ghost"), "mode Weather: the sensor's sky lost, or forecast figures without house use", p._ahead?.from, p._outlook);

    // The "?": a labelled button that opens a modal dialog; closing it the way Escape does gives focus back to it.
    p = await at("sunny", null);
    attach(p);
    const help = $(p, ".battery button.help"), read = $(p, "dialog.read");
    console.assert(help?.getAttribute("aria-label")?.startsWith(`${t.helpTitle}: `) && help.querySelector("svg[aria-hidden=true]"), "help: not a labelled button", help?.outerHTML);
    help?.focus(); help?.click();
    console.assert(read?.open && read.matches(":modal") && read.querySelector("h2").textContent === t.helpTitle && read.querySelectorAll("li span").length === 5
      && [...read.querySelectorAll("[data-t]")].every((el) => el.textContent.trim()), "help: no modal dialog with its title and lines");
    if (read?.requestClose) read.requestClose();
    else if (read?.dispatchEvent(new Event("cancel", { cancelable: true }))) read.close();
    await tick();
    console.assert(read && !read.open && p.shadowRoot.activeElement === $(p, ".battery button.help"), "help: closing does not give focus back to the button", p.shadowRoot.activeElement);
    p.remove();

    // The icon over the flow: by day the sun, behind a cloud from 50 %, a cloud from 90 %, rain over 0.2 mm;
    // by night the moon in its phase, the same way. Without the sensor the sun, or rain from a weather entity.
    const icon = async (s, h = null) => $(await at(s, h), ".flow .sky-icon")?.dataset.icon;
    const phase = moonPhase(Date.now());
    const overcast = () => {
      const h = fakeHass({ ...SCENARIOS.sunny, ahead: "cloudy" });
      h.states["sensor.solar_view_forecast"].attributes.hours.forEach((x) => { x.cloud = 95; });
      return h;
    };
    const got = [await icon("sunny"), await icon("cloudy"), await icon(overcast), await icon("rain"), await icon(night), await icon({ ...night, ahead: "cloudy" }), await icon("stale"), await icon({ ...SCENARIOS.stale, weather: "rainy" }), await icon({ ...SCENARIOS.rain, weather: "snowy" })];
    console.assert(JSON.stringify(got) === JSON.stringify(["sun", "sun cloud", "cloud", "rain", `moon ${phase}`, `moon ${phase} cloud`, "sun", "rain", "snow"]), "sky icon: wrong for the present hour", got);
    // Known phases (UTC): new moon 2024-04-08 18:21, first quarter 2024-04-15 19:13, full moon 2024-04-23 23:49, last quarter 2024-05-01 11:27.
    const phases = ["2024-04-08T18:21Z", "2024-04-15T19:13Z", "2024-04-23T23:49Z", "2024-05-01T11:27Z", "2024-04-11T12:00Z", "2024-04-19T12:00Z"].map((d) => moonPhase(Date.parse(d)));
    console.assert(JSON.stringify(phases) === "[0,2,4,6,1,3]", "moon phase: wrong", phases);
  } catch (e) {
    console.assert(false, "now: threw", e);
  } finally {
    Date.now = real;
  }
}

// Check: the rest of the Energy page, in order today, hour by hour, next hours, coming days, the month's days. Next hours: the
// present hour and the 5 after it, in a row; each bar inside its column, its whisker around its top; the
// sensor's cloud and rain as icons; from the page's own forecast no icons and no whiskers; none without a
// forecast. Coming days: 7 rows from tomorrow, each with its day's icon, every pill on the one track; none
// without the sensor. Days: one dot a day of this month numbered from 1, today last, faded and picked at
// first; another bar picked by a tap or by focus, kept across a redraw.
{
  const t = STRINGS.en, H = 36e5;
  const energy = (p) => p.shadowRoot.getElementById("energy");
  const has = (p, sel) => !!energy(p).querySelector(sel);
  const order = (p) => [...energy(p).querySelectorAll("section.card")].map((c) => c.classList[1]).join(" ");
  const hours = (p) => [...energy(p).querySelectorAll(".hours li")];
  const v = (el, name) => (el ? parseFloat(el.style.getPropertyValue(name)) : null);
  const nextOk = (p) => {
    const at = hours(p).map((li) => +li.dataset.at), now = Date.now();
    return at.length === 6 && at[0] <= now && now < at[0] + H && at.every((x, i) => !i || x === at[i - 1] + H) && hours(p)[0].firstChild.textContent === t.hourNow
      && hours(p).every((li) => /\d/.test(li.getAttribute("aria-label")) && (([h, lo, hi]) => h >= 0 && h <= 100 && (lo === null || (lo <= h + 0.1 && h <= hi + 0.1 && hi <= 100.01)))(
        [v(li.querySelector(".bar i"), "--h"), v(li.querySelector(".bar b"), "--lo"), v(li.querySelector(".bar b"), "--hi")]));
  };
  const icons = (p) => hours(p).map((li) => (li.querySelector(".wx .drop") ? "rain" : li.querySelector(".wx .cloud") ? "cloud" : li.querySelector(".wx") ? "-" : "none"));
  try {
    let p = await draw(fakeHass(SCENARIOS.sunny), en);
    console.assert(order(p) === "today battday next coming daily", "energy: cards not today, hour by hour, next hours, coming days, days", order(p));
    console.assert(nextOk(p) && icons(p).every((i) => i === "-"), "next hours sunny: not 6 hours in a row from the present one, a bar outside its whisker, or an icon on a clear hour", hours(p).map((li) => li.outerHTML));
    // The mock's sun runs from 10:00 to 15:00: a whisker on every sunny hour, all six on the scale of the highest high.
    const sunny = hours(p).filter((li) => v(li.querySelector(".bar i"), "--h") > 0);
    console.assert(sunny.every((li) => li.querySelector(".bar b") && li.getAttribute("aria-label").includes(" likely "))
      && (!sunny.length || Math.max(...sunny.map((li) => v(li.querySelector(".bar b"), "--hi"))) === 100), "next hours sunny: a sunny hour without its whisker, or not on one scale");
    p = await draw(fakeHass(SCENARIOS.cloudy), en);
    console.assert(nextOk(p) && icons(p).every((i) => i === "cloud") && hours(p)[0].getAttribute("aria-label").includes(t.wxPartly), "next hours cloudy: no cloud icon or word", icons(p));
    p = await draw(fakeHass(SCENARIOS.rain), en);
    console.assert(nextOk(p) && icons(p)[0] === "rain" && icons(p).slice(1).every((i) => i === "cloud"), "next hours rain: no rain icon on the present hour", icons(p));
    p = await draw(fakeHass(SCENARIOS.stale), en);
    console.assert(nextOk(p) && icons(p).every((i) => i === "none") && !has(p, ".hours .bar b") && !has(p, ".coming"), "next hours from the page's own forecast: an icon or a whisker, or coming days without the sensor", icons(p));
    for (const k of ["midday", "firstDays"]) console.assert(!has(await draw(fakeHass(SCENARIOS[k]), en), ".next"), `next hours ${k}: drawn without a forecast`);

    // Coming days: 7 rows from tomorrow, each with the icon of its day's cloud and rain.
    p = await draw(fakeHass(SCENARIOS.sunny), en);
    const rows = [...energy(p).querySelectorAll(".days li")];
    const pills = rows.map((li) => [v(li.querySelector(".track i"), "--a"), v(li.querySelector(".track i"), "--b")]);
    const tomorrow = new Date(localMidnight(-1) + 12 * H);
    console.assert(rows.length === 7 && rows[0].firstChild.textContent === new Intl.DateTimeFormat("en", { weekday: "short" }).format(tomorrow).replace(".", "")
      && rows.every((li) => li.querySelector(".wx circle") && !li.querySelector(".wx .cloud"))
      && pills.every(([a, b]) => a >= 0 && a <= b && b <= 100) && Math.max(...pills.map((x) => x[1])) === 100
      && rows.every((li) => /\d/.test(li.getAttribute("aria-label")) && li.getAttribute("aria-label").includes(" kWh of sun")), "coming days: rows, icons or pills wrong", rows.map((li) => li.outerHTML));
    const dayIcons = async (k) => [...energy(await draw(fakeHass(SCENARIOS[k]), en)).querySelectorAll(".days li")].map((li) => (li.querySelector(".wx .drop") ? "rain" : li.querySelector(".wx circle") ? (li.querySelector(".wx .cloud") ? "partly" : "sun") : li.querySelector(".wx .cloud") ? "cloud" : "-"));
    const cloudy = await dayIcons("cloudy"), rainy = await dayIcons("rain");
    console.assert(cloudy.length === 7 && cloudy.every((i) => i === "partly") && energy(p).querySelector(".days li").getAttribute("aria-label").includes(t.wxSunny)
      && rainy.every((i) => i === "rain"), "coming days: icons not from the day's cloud and rain", cloudy, rainy);

    // Days: one dot a day of this month numbered from 1, today last, faded and picked at first; a tap picks
    // another, focus another, and a redraw keeps it.
    const days = (p) => [...energy(p).querySelectorAll(".daily .week li")], n = new Date(Date.now()).getDate();
    const picked = (p) => [days(p).findIndex((li) => li.getAttribute("aria-current") === "true"), days(p).filter((li) => li.hasAttribute("aria-current")).length,
      [...energy(p).querySelectorAll(".daily .picked .day:not([hidden])")].map((d) => d.dataset.i).join()];
    console.assert(days(p).length === new Date(new Date(Date.now()).getFullYear(), new Date(Date.now()).getMonth() + 1, 0).getDate() && days(p).slice(n).every((li) => li.classList.contains("future") && !li.dataset.hint) && JSON.stringify(picked(p)) === JSON.stringify([n - 1, 1, String(n - 1)])
      && days(p)[n - 1].classList.contains("today") && days(p).filter((li) => li.classList.contains("today")).length === 1
      && days(p).map((li) => li.lastChild.textContent).join() === days(p).map((_, i) => i + 1).join()
      && energy(p).querySelector(".daily .picked .day:not([hidden]) .period")?.textContent === t.todaySoFar, "days: not a dot a day numbered from 1, or today not last, faded and picked", picked(p));
    if (n > 2) {
      days(p)[0].click();
      console.assert(JSON.stringify(picked(p)) === '[0,1,"0"]', "days: a tapped bar not picked", picked(p));
      days(p)[1].dispatchEvent(new FocusEvent("focusin", { bubbles: true, composed: true }));
      console.assert(JSON.stringify(picked(p)) === '[1,1,"1"]', "days: a focused bar not picked", picked(p));
      p._drawn = ""; p.hass = { ...p.hass };
      console.assert(JSON.stringify(picked(p)) === '[1,1,"1"]', "days: the picked day lost in a redraw", picked(p));
    }
    // Production: the latest 12 months January to December, this one pressed and "so far", its total under
    // them. A past month picked shows all its days, the last picked, none of them today; the days stay.
    const year = (p) => [...energy(p).querySelectorAll(".daily .year button")], k = p._stats.monthKey;
    console.assert(year(p).map((b) => b.dataset.month.slice(5)).join() === "01,02,03,04,05,06,07,08,09,10,11,12"
      && year(p).every((b) => b.dataset.month <= k && b.dataset.month > `${+k.slice(0, 4) - 1}-${k.slice(5)}`)
      && year(p).filter((b) => b.getAttribute("aria-pressed") === "true").map((b) => b.dataset.month).join() === k
      && year(p).find((b) => b.dataset.month === k).querySelector("small").textContent === t.soFar
      && year(p).filter((b) => b.dataset.month.slice(0, 4) !== k.slice(0, 4)).every((b) => b.querySelector("small .wide")?.textContent === b.dataset.month.slice(0, 4))
      && energy(p).querySelector(".daily .year + .stepped .month-total .period")?.textContent === say(t.monthSoFar, { m: formats("en", "EUR", "h12").monthYear(k) })
      && energy(p).querySelector(".daily .month-total dt")?.textContent === t.prodMonths, "production: not the latest 12 months, this one so far with its total", year(p).map((b) => b.dataset.month));
    const back = year(p).find((b) => b.dataset.month < k);
    back.click();
    const all = days(p), [y, m] = back.dataset.month.split("-").map(Number), length = new Date(Date.UTC(y, m, 0)).getUTCDate();
    console.assert(all.length === length && all.every((li) => !li.classList.contains("future") && !li.classList.contains("today")) && all[length - 1].getAttribute("aria-current") === "true"
      && energy(p).querySelector(".daily .year [aria-pressed=true]")?.dataset.month === back.dataset.month
      && energy(p).querySelector(".daily .chart-title .num")?.textContent === formats("en", "EUR", "h12").monthYear(back.dataset.month)
      && !/NaN|undefined/.test(energy(p).querySelector(".daily").innerHTML), "production: a past month picked, its days wrong", back.dataset.month, all.length);
    // One Tab stop per chart, on its pick: the arrows move along it.
    const stops = (sel) => [...energy(p).querySelectorAll(`.daily ${sel} [tabindex="0"]`)];
    console.assert(same(stops(".year").map((b) => b.dataset.month), [back.dataset.month]) && same(stops(".week").map((li) => li.dataset.i), [all[length - 1].dataset.i]),
      "production: not one Tab stop per chart, on the pick", stops(".year").length, stops(".week").length);
    p._pick = {}; p._drawn = ""; p.hass = { ...p.hass };
  } catch (e) { console.assert(false, "energy: threw", e); }
}

// Check: the 12 months' keys roll over with the year: January to December, each the latest up to this month.
{
  const keys = (k) => yearKeys(k).join();
  console.assert(keys("2027-01") === "2027-01,2026-02,2026-03,2026-04,2026-05,2026-06,2026-07,2026-08,2026-09,2026-10,2026-11,2026-12"
    && keys("2026-12") === "2026-01,2026-02,2026-03,2026-04,2026-05,2026-06,2026-07,2026-08,2026-09,2026-10,2026-11,2026-12"
    && keys("2026-10").split(",")[10] === "2025-11", "months: not the latest of each, January to December", keys("2027-01"));
}

// Check: the Money page's month balance and prices. The latest 12 months to pick, January to December, this
// one pressed; under them the picked month: what the grid cost, what was saved (and earned), the net, below 0
// in the low colour; for this month the month end from a fresh sensor, none from the statistics. From the
// sensor's months when fresh, else the statistics at the flat price, the bill's fixed part on the cost and the
// net. The prices now in their own card, selling only while export is on. Neither card without any price.
{
  const t = STRINGS.en, f = formats("en", "EUR", "h12"), money = f.money;
  const card = (p) => p.shadowRoot.querySelector("#money .months"), fig = (p, sel) => card(p)?.querySelector(sel)?.textContent;
  // A labelled figure under the bars (see readout), by its label.
  const said = (p, label) => [...card(p)?.querySelectorAll(".readout dl > div") ?? []].find((d) => d.querySelector("dt").textContent === label)?.querySelector("dd").textContent;
  const read = (p) => ({ cost: fig(p, ".side.cost b"), back: fig(p, ".side.back b"), net: said(p, t.netBenefit), end: fig(p, ".note") });
  const value = (v) => parseFloat(v.replace(/[^\d.-]/g, ""));
  const pickMonth = (p, key) => card(p).querySelector(`[data-month="${key}"]`).click();
  const prices = (p) => [...p.shadowRoot.querySelectorAll("#money .prices .price")].map((el) => `${el.querySelector("span").textContent}: ${el.querySelector("b").textContent}`).join("|");
  const before = (key) => { const d = new Date(`${key}-15T12:00:00Z`); d.setUTCMonth(d.getUTCMonth() - 1); return d.toISOString().slice(0, 7); };
  if (!extras) { const p = await draw(fakeHass(SCENARIOS.sunny), en); console.assert(!card(p) && !p.shadowRoot.querySelector("#money .prices"), "money month: drawn without any price"); }
  else {
    let p = await draw(fakeHass(SCENARIOS.sunny), en);
    const k = p._stats.monthKey, last = before(k), months = [...card(p).querySelectorAll(".year button")];
    console.assert(months.length === 12 && months.filter((b) => b.getAttribute("aria-pressed") === "true").map((b) => b.dataset.month).join() === k
      && fig(p, ".chart-title") === say(t.monthSoFar, { m: f.monthYear(k) }) && read(p).end === say(t.balEnd, { v: money(82.1 - 48.6) })
      && prices(p) === `${t.buyGrid}: ${money(0.3)} /kWh|${t.sellGrid}: ${money(0.1)} /kWh`, "money month sunny: months, month end or prices wrong", read(p), prices(p));
    // The sensor's last month as it is: no month end.
    pickMonth(p, last);
    console.assert(read(p).cost === money(14.6) && value(read(p).back) >= 98 && read(p).net === money(value(read(p).back) - 14.6) && !read(p).end
      && fig(p, ".chart-title") === f.monthYear(last), "money month sunny: last month wrong", read(p));
    // ?gap=1 leaves a day of this month without rows: its money is then unknown, so these need no gap.
    if (q.get("gap") !== "1") {
      // No sensor: from the statistics at the flat price, and no month end.
      p = await draw(fakeHass(SCENARIOS.midday), en);
      const lm = p._stats.lastMonth, m = p._stats.month, base = read(p);
      console.assert(base.cost === money(m.gridImportKwh * 0.3) && base.back === money(Math.max(0, m.loadKwh - m.gridImportKwh) * 0.3 + m.gridExportKwh * 0.1) && !base.end,
        "money month midday: this month from the statistics wrong", base);
      pickMonth(p, last);
      console.assert(read(p).cost === money(lm.gridImportKwh * 0.3), "money month midday: last month from the statistics wrong", read(p));
      // The bill's fixed part: on the cost and off the net; from an entity each month its own mean (10 this month, 12 last).
      const fixed = read(await draw(fakeHass(SCENARIOS.midday), en, { bill_fixed: 10 }));
      console.assert(Math.abs(value(fixed.cost) - value(base.cost) - 10) < 0.006 && Math.abs(value(fixed.net) - value(base.net) + 10) < 0.006, "money month: the bill's fixed part not on the cost and the net", fixed, base);
      p = await draw(fakeHass(SCENARIOS.midday), en, { bill_fixed: "sensor.bill_fixed" });
      const now10 = value(read(p).cost) - value(base.cost);
      pickMonth(p, last);
      console.assert(Math.abs(now10 - 10) < 0.006 && Math.abs(value(read(p).cost) - lm.gridImportKwh * 0.3 - 12) < 0.006, "money month: the bill's fixed part not the entity's mean of each month", now10, read(p));
      // A grid that cost more than the system brought: the net below 0, in the low colour.
      p = await draw(fakeHass(SCENARIOS.midday), en, { bill_fixed: 1000 });
      console.assert(value(read(p).net) < 0 && card(p).querySelector(".readout dd.neg") && card(p).querySelector(`[data-month="${k}"] i.neg`), "money month: a negative net not drawn below 0", read(p));
      // The zero line as high as the largest value below 0 needs: the largest above and below fill the bar together.
      const nets = [...card(p).querySelectorAll(".year i")].map((i) => parseFloat(i.style.getPropertyValue("--v")) * (i.classList.contains("neg") ? -1 : 1));
      const zero = parseFloat(card(p).querySelector(".year").style.getPropertyValue("--zero"));
      console.assert(Math.abs(Math.max(0, ...nets) - Math.min(0, ...nets) - 100) < 0.2 && Math.abs(zero + Math.min(0, ...nets)) < 0.2, "money month: bars not scaled from the zero line", nets, zero);
    }
    // Energy sent: saved and earned on the right, each named under them.
    const real = Date.now; // at 15:00, when today has sent some (see fakeStats)
    Date.now = () => new Date(real()).setHours(15, 0, 0, 0);
    try { p = await draw(fakeHass({ ...SCENARIOS.full, ahead: "sunny" }), en); } finally { Date.now = real; }
    console.assert(card(p)?.querySelector(".side.back span")?.textContent === t.savedEarned && said(p, t.savedLabel) && said(p, t.exportLabel), "money month with export: saved and earned not shown", card(p)?.innerHTML);
    // Export off: no selling price.
    p = await draw(fakeHass(SCENARIOS.exportOffFull), en, configOf(SCENARIOS.exportOffFull));
    console.assert(prices(p) === `${t.buyGrid}: ${money(0.3)} /kWh`, "prices, export off: a selling price", prices(p));
  }
}

// Check: payback and this month's days on the Money page. Time left walks each coming month like the same month
// a year before, else like the average month; a range only while there is less than a year on record.
{
  const t = STRINGS.en;
  const months = (from, values) => values.map((back, i) => ({ key: new Date(Date.UTC(from[0], from[1] - 1 + i, 1)).toISOString().slice(0, 7), back }));
  console.assert(JSON.stringify(paybackLeft(450, months([2026, 7], [100, 100, 100]), "2026-10")) === "[4,5,6]", "payback: 3 months of 100, 450 owed",
    paybackLeft(450, months([2026, 7], [100, 100, 100]), "2026-10"));
  const year = months([2025, 11], Array.from({ length: 12 }, (_, i) => 10 * (i + 1)));
  console.assert(JSON.stringify(paybackLeft(60, year, "2026-10")) === "[3,3,3]", "payback: a year on record, not walked by the same months", paybackLeft(60, year, "2026-10"));
  console.assert(paybackLeft(100, [], "2026-10") === null, "payback: time left with nothing on record");

  let p = await draw(fakeHass(SCENARIOS.sunny), en, configOf(SCENARIOS.sunny));
  const bars = [...p.shadowRoot.querySelectorAll("#money .recent .week li")], n = new Date(Date.now()).getDate();
  const shown = (sel) => [...p.shadowRoot.querySelectorAll(`${sel} .day:not([hidden])`)].map((d) => d.dataset.i).join();
  if (extras) {
    console.assert(bars.length === new Date(new Date(Date.now()).getFullYear(), new Date(Date.now()).getMonth() + 1, 0).getDate() && bars[n - 1].getAttribute("aria-current") === "true" && bars[n - 1].classList.contains("today") && shown("#money .recent") === String(n - 1)
      && $(p, "#money .recent .day:not([hidden]) .period")?.textContent === t.todaySoFar
      && [...p.shadowRoot.querySelectorAll("#money .recent .day:not([hidden]) dt")].map((d) => d.textContent).join() === [t.returns, t.gridCost, t.netBenefit].join()
      && !$(p, "#money .recent .month-total"), "money days: not a dot a day with today picked, or a month total (it is on Month balance)", bars.length);
    // ?gap=1 leaves a day unknown: payback then says it cannot add up, with no ring.
    if (q.get("gap") === "1") console.assert($(p, "#money .payback .note")?.textContent === t.paybackIncomplete && !$(p, "#money .payback .ring"), "payback with a gap: not the incomplete note", $(p, "#money .payback")?.textContent);
    else console.assert(/^[\d,]+ €$/.test($(p, "#money .payback .ring-mid")?.textContent) && $(p, "#money .payback .ring .size")?.textContent === "9,000 €"
      && $(p, "#money .payback .ring-name")?.textContent === t.plantCost && $(p, "#money .payback .money").textContent.startsWith("About ")
      && !/%/.test($(p, "#money .payback").textContent), "payback: amount, cost, its name or time left missing, or a percentage shown", $(p, "#money .payback")?.textContent);
    // A day bar picks its own day; Energy's days keep today, also after a redraw.
    bars[0].click();
    p.hass = { ...p.hass }; await tick();
    console.assert(shown("#money .recent") === "0" && shown("#energy .daily") === String(n - 1), "money days: a pick moved Energy's, or was lost", shown("#money .recent"), shown("#energy .daily"));
  } else console.assert(!bars.length && !$(p, "#money .payback"), "money days or payback without prices");
  p = await draw(fakeHass(SCENARIOS.sunny), en, {});
  console.assert(!$(p, "#money .payback"), "payback without a system cost");
  // Paid back: the month it happened and what came back since, a check in the full ring; or no month when it was
  // paid before the records start. ?gap=1 leaves a day unknown, so neither adds up (see above).
  if (extras && q.get("gap") !== "1") {
    const since = new Date(localMidnight(270)).toISOString().slice(0, 7) + "-01";
    p = await draw(fakeHass(SCENARIOS.sunny), en, { system_cost: 500, install_date: since });
    console.assert(/^Paid back in \w+ \d{4}$/.test($(p, "#money .payback p").textContent) && /^Since then \+[\d,]+ € gained$/.test($(p, "#money .payback .money").textContent)
      && $(p, "#money .payback .ring-mid .done"), "payback paid: month, gain or check missing", $(p, "#money .payback")?.textContent);

// Check: hour by hour on Energy. With a battery: its hourly means as a line, the floor, and with the outlook
// (sunny) the rest of today as dashes. Above it a line each for the sun made, the house used and the grid
// gave, solid so far and dashed ahead, one hour picked on both charts. The hints name each hour: the charge and the energy for the hours past, the energy alone
// for this one, the forecast's charge after it. No forecast (midday): no dashes, no hints ahead. No battery:
// the energy alone.
{
  let p = await draw(fakeHass(SCENARIOS.sunny), en);
  const card = (p) => p.shadowRoot.querySelector("#energy .battday"), hints = (p) => [...card(p)?.querySelector(".hours24")?.querySelectorAll("[data-hint]") ?? []].map((h) => h.dataset.hint);
  // Hours since midnight and in all today: not the clock's hour on a day the clocks change.
  const m0 = localMidnight(), m1 = new Date(m0).setDate(new Date(m0).getDate() + 1);
  const past = Math.floor((Date.now() - m0) / 36e5), floor = card(p)?.querySelector(".floor");
  console.assert(card(p)?.querySelector(".past") && card(p).querySelector(".ahead") && +floor?.getAttribute("y1") === 100 - p._src.batt.floor && card(p).querySelector(".socline .series")
    && hints(p).length === Math.round((m1 - m0) / 36e5) && hints(p).slice(0, past).every((h) => /^At .*, the panels made .* the house used .* the grid gave .* and the battery was at \d+%\.$/.test(h)
      || (q.get("gap") === "1" && h.endsWith(STRINGS.en.noData))) // ?gap=1: 1:00 and 2:00 have no rows
    && / the panels made /.test(hints(p)[past]) && !/ battery /.test(hints(p)[past]) && hints(p).slice(past + 1).every((h) => /^At .*, the panels should make .* the grid give .* and the battery be at about \d+%\.$/.test(h))
    && (past === hints(p).length - 1 || card(p).querySelector(".series.later")?.getAttribute("d")),
    "hour by hour: charge line, dashes, floor, energy lines, their dashes or hour hints wrong", hints(p));
  // This hour picked at first on both charts, its sentence under them; a tap on the charge chart picks an hour on both.
  const picks = (p) => [...card(p).querySelectorAll(".hours24 li[aria-current]")].map((li) => li.dataset.i).join() + "|" + [...card(p).querySelectorAll(".day:not([hidden])")].map((d) => d.dataset.i).join();
  console.assert(picks(p) === `${past},${past}|${past}`, "hour by hour: this hour not picked on both charts", picks(p));
  // Now: one line on each chart at the same place, named once, over the top chart.
  const nowAt = [...card(p).querySelectorAll(".now-line")].map((l) => l.getAttribute("x1"));
  console.assert(nowAt.length === 2 && nowAt[0] === nowAt[1] && card(p).querySelectorAll(".now-label").length === 1 && card(p).querySelector(".charge > .now-label")?.textContent === STRINGS.en.nowMark,
    "hour by hour: now not marked on both charts, or not named once over the top one", nowAt);
  card(p).querySelector(".charge .hours24 li").click();
  console.assert(past === 0 || (picks(p) === "0,0|0" && [...card(p).querySelectorAll(".day:not([hidden]) dt")].some((d) => d.textContent === STRINGS.en.battAvg)), "hour by hour: a tap on the charge chart not picked on both", picks(p));
  // Pointing at an hour of the energy chart shows it on both, with the same hint, and picks nothing.
  if (past > 0) {
    const rows = [...card(p).querySelectorAll(".hours24")], at = rows[1].children[past - 1];
    at.dispatchEvent(new PointerEvent("pointerover", { bubbles: true, composed: true }));
    const hovered = rows.map((r) => [...r.querySelectorAll("li.hover")].map((li) => li.dataset.i).join()).join("|");
    console.assert(hovered === `${past - 1}|${past - 1}` && at.dataset.hint === rows[0].children[past - 1].dataset.hint && picks(p) === "0,0|0", "hour by hour: hover not shown on both charts, or it picked", hovered, picks(p));
    // A mouse dragged across with its button held picks nothing.
    const box = (li) => li.getBoundingClientRect();
    rows[0].children[0].dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, composed: true, isPrimary: true, pointerType: "mouse", buttons: 1 }));
    card(p).dispatchEvent(new PointerEvent("pointermove", { bubbles: true, composed: true, pointerType: "mouse", buttons: 1, clientX: box(at).left + 1, clientY: box(at).top + 1 }));
    card(p).dispatchEvent(new PointerEvent("pointerup", { bubbles: true, composed: true }));
    console.assert(picks(p) === "0,0|0", "hour by hour: a mouse drag picked an hour", picks(p));
  }
  p = await draw(fakeHass(SCENARIOS.midday), en);
  console.assert(card(p)?.querySelector(".past") && !card(p).querySelector(".ahead") && hints(p).length === past + 1, "hour by hour: dashes without a forecast", hints(p).length);
  p = await draw(fakeHass(SCENARIOS.nobattery), en);
  console.assert(card(p) && !card(p).querySelector(".floor, .past, .charge") && card(p).querySelector(".socline .series") && card(p).querySelectorAll(".legend li").length === 3, "hour by hour without a battery: not the energy alone");
}

// Check: ‹ and › beside a picked hour or day pick its neighbour, as a tap would, its figures shown, and are
// greyed where there is none that way; a month's go to the month beside on screen (see steps).
{
  const p = await draw(fakeHass(SCENARIOS.sunny), en), cards = [...p.shadowRoot.querySelectorAll("#energy .battday, #energy .daily, #money .recent")];
  const at = (c) => c.querySelector(":is(.week, .hours24) li[aria-current]")?.dataset.i + "|" + c.querySelector(".picked .day:not([hidden])")?.dataset.i;
  const off = (c) => [...c.querySelectorAll("[data-step]")].map((b) => b.getAttribute("aria-disabled") === "true").join();
  const tap = (c, by) => c.querySelector(`[data-step="${by}"]`).click();
  for (const c of cards) {
    // The last one a tap can pick: a day or an hour to come only with a forecast for it.
    const cells = [...c.querySelector(".week, .hours24").children], last = cells.findLastIndex((li) => !li.classList.contains("future"));
    const i = +c.querySelector(":is(.week, .hours24) li[aria-current]").dataset.i, start = at(c);
    console.assert(off(c) === `${i === 0},${i === last}`, `steps: ${c.dataset.pick}: not greyed only where nothing comes that way`, off(c), i, last);
    tap(c, 1);
    console.assert(at(c) === (i === last ? start : `${i + 1}|${i + 1}`), `steps: ${c.dataset.pick}: › did not pick the next one, or went past the last`, at(c));
    if (i < last) tap(c, -1);
    if (i === 0) continue;
    tap(c, -1);
    console.assert(at(c) === `${i - 1}|${i - 1}` && off(c) === `${i === 1},false`, `steps: ${c.dataset.pick}: ‹ did not pick the one before`, at(c), off(c));
    tap(c, 1);
    console.assert(at(c) === start, `steps: ${c.dataset.pick}: › did not go back`, at(c));
  }
  console.assert(cards.length === 2 + (extras ? 1 : 0), "steps: a picker without its ‹ and ›", cards.map((c) => c.dataset.pick));
  // Production's months: this month picked, ‹ to the one left of it, › to the one right (last year's December).
  const cur = clockOf(TZ)(Date.now()).key.slice(0, 7), month = (k) => p.shadowRoot.querySelector(`#energy .daily .year [data-month="${k}"]`)?.getAttribute("aria-pressed");
  const keys = [...p.shadowRoot.querySelectorAll("#energy .daily .year [data-month]")].map((b) => b.dataset.month), n = keys.indexOf(cur);
  const mstep = (cls) => p.shadowRoot.querySelector(`#energy .daily .total .step-${cls}`);
  console.assert(mstep("prev")?.dataset.month === keys[n - 1] && mstep("next")?.dataset.month === keys[n + 1] && (keys[n + 1] || mstep("next").getAttribute("aria-disabled") === "true"), "steps: month ‹ › not the months beside this one", keys, n);
  mstep("prev").click();
  console.assert(month(keys[n - 1]) === "true" && mstep("next")?.dataset.month === cur, "steps: month ‹ did not pick the month before", keys[n - 1]);
}

// Check: the share ring's lead lines on a winter morning (little sun, a small battery part, most from the grid),
// a sunny day (most from the sun), days where two parts are close (59 % sun, 59 % grid) and almost no sun with
// the grid a little over half:
// each stays at least 4 px off every other label and every other line, so none crosses another or a label.
for (const [today, out] of [[SCENARIOS.winter.today, 0.3], [[7.8, 6.1, 0.2, 0], 0.5], [[7.8, 6.1, 0.2, 0], 2.3], [[0.4, 6.0, 3.54, 0], 2.2], [[0.1, 6.0, 3.4, 0], 2.5]]) {
  const real = Date.now; // at 15:00, when today is these totals (see fakeStats)
  Date.now = () => new Date(real()).setHours(15, 0, 0, 0);
  const p = await draw(fakeHass({ ...SCENARIOS.winter, today, out }), en).finally(() => { Date.now = real; });
  document.body.append(p);
  const box = $(p, "#energy .ring-box"), labels = [...(box?.querySelectorAll(".part") ?? [])].map((l) => [l.classList[1], l.getBoundingClientRect()]);
  // Each lead as screen points every half unit, with its label's side: leads and labels both follow the parts' order.
  const leads = [...(box?.querySelectorAll(".lead") ?? [])].map((path, i) => {
    const m = path.getScreenCTM(), pts = [];
    for (let s = 0; s <= path.getTotalLength(); s += 0.5) { const q = path.getPointAtLength(s); pts.push([m.a * q.x + m.c * q.y + m.e, m.b * q.x + m.d * q.y + m.f]); }
    return [labels[i]?.[0], pts];
  });
  const off = (pt, r) => Math.hypot(Math.max(r.left - pt[0], 0, pt[0] - r.right), Math.max(r.top - pt[1], 0, pt[1] - r.bottom));
  const near = leads.flatMap(([side, pts]) => [...labels.filter(([s]) => s !== side).map(([s, r]) => [side, s, Math.min(...pts.map((pt) => off(pt, r)))]),
    ...leads.filter(([s]) => s !== side).map(([s, other]) => [side, `${s} line`, Math.min(...pts.flatMap((a) => other.map((b) => Math.hypot(a[0] - b[0], a[1] - b[1]))))])]).filter((x) => x[2] < 4);
  console.assert(leads.length === 3 && !near.length, "share ring: a lead line runs into another label or line", today, out, near);
  p.remove();
}

// Check: history and holes in it. Past months are priced as Home Assistant's cost sensors recorded them, not at
// today's price. A day with no rows keeps its place, empty, and says so, on Energy and on Money; an hour with no

{
  const t = STRINGS.en, f = formats("en", "EUR");

    console.assert(days[0]?.classList.contains("none") && days[0].dataset.hint.endsWith(t.noData) && days.filter((li) => li.classList.contains("none")).length === (q.get("gap") === "1" && n > 2 ? 2 : 1)
      && $(p, ".daily .day dt")?.textContent === t.noData, "days: a day with no rows not drawn as missing", days.map((li) => li.outerHTML));
    if (extras) console.assert($(p, ".recent .week li")?.classList.contains("none"), "money days: a day with no rows not kept empty");
  }
