// Check: reading the Energy settings, the owner's config, units, time zone, language and currency.
{
  // Older grid shape (lists of flows), two batteries of different size, an entity named in config.
  const src = entitiesFrom({ energy_sources: [
    { type: "grid", flow_from: [{ stat_energy_from: "in1", number_energy_price: 0.25 }, { stat_energy_from: "in2" }], flow_to: [{ stat_energy_to: "out1" }], power: [{ stat_rate: "gw" }] },
    { type: "battery", stat_energy_from: "bo1", stat_energy_to: "bi1", stat_soc: "soc1", capacity: 5 },
    { type: "battery", stat_energy_from: "bo2", stat_energy_to: "bi2", stat_soc: "soc2", capacity: 15 },
    { type: "gas", stat_energy_from: "gas" },
  ] }, { entities: { solar_power: "sp", load_power: ["lp"] }, battery_floor: 20 });
  console.assert(JSON.stringify([src.gridImportKwh, src.gridExportKwh, src.gridW, src.solarW, src.loadW, src.batteryKwh, src.solarKwh])
    === JSON.stringify([["in1", "in2"], ["out1"], ["gw"], ["sp"], ["lp"], ["bo1", "bo2"], []]), "entities: wrong lists", src);
  console.assert(src.batt.kwh === 20 && src.batt.floor === 20 && src.price.buy === 0.25 && src.price.sell === null, "entities: wrong battery or prices", src);
  console.assert(entitiesFrom(null).solarW.length === 0 && entitiesFrom(null, { battery_kwh: 7 }).batt.kwh === 7, "entities: no Energy settings");
  // Battery wear: a health sensor alone decides; else the battery's age, from its own date before the system's.
  const b = entitiesFrom(null, { install_date: "2020-01-01", battery_install_date: "2025-01-01" }).batt;
  console.assert(b.since === "2025-01-01" && entitiesFrom(null, { install_date: "2020-01-01" }).batt.since === "2020-01-01", "wear: battery date not read", b);
  console.assert(JSON.stringify(wearOf(b, 65.4, Date.parse("2026-01-01"))) === '{"kind":"health","p":65}' && wearOf(b, 80, Date.parse("2040-01-01")) === null, "wear: health sensor not deciding alone");
  console.assert(wearOf(b, Infinity, Date.parse("2034-06-01")) === null && wearOf(b, Infinity, Date.parse("2034-08-01"))?.y === 9, "wear: age warning not at 9.5 years");
  // The older grid shape keeps the selling price on the export flow, under the same name as the buying price.
  const old = entitiesFrom({ energy_sources: [{ type: "grid", flow_from: [{ stat_energy_from: "in1" }], flow_to: [{ stat_energy_to: "out1", number_energy_price: 0.1 }] }] });
  console.assert(old.price.buy === null && old.price.sell === 0.1 && old.gridExportKwh[0] === "out1", "entities: old export price read as the buying price", old);
  // The forecast settings: numbers of 0 or more only, else no limit and standby not set (see totals).
  const set = entitiesFrom(null, { battery_max_charge_kw: 2.1, export_max_kw: 0, standby_w: 100 });
  const unset = entitiesFrom(null, { battery_max_charge_kw: "2", export_max_kw: -1, standby_w: "x" });
  console.assert(set.batt.maxChargeKw === 2.1 && set.exportMaxKw === 0 && set.standbyW === 100 && unset.batt.maxChargeKw === null && unset.exportMaxKw === null && unset.standbyW === null
    && entitiesFrom(null, { standby_w: -5, battery_max_charge_kw: -2 }).standbyW === null && entitiesFrom(null, { battery_max_charge_kw: -2 }).batt.maxChargeKw === null,
    "entities: forecast settings not read, or a negative taken", set, unset);

  // Days are Home Assistant's days: 11:30 UTC is already tomorrow in Auckland. One row each side of
  // that midnight: rows land on 1 and 30 September (twice), 1 October (yesterday) and today.
  const clock = clockOf("Pacific/Auckland"), now = Date.UTC(2026, 9, 1, 11, 30); // 2 October 00:30 there
  console.assert(clock(now).key === "2026-10-02" && clock(now).hour === 0, "clock: wrong day for the time zone");
  const one = entitiesFrom({ energy_sources: [{ type: "solar", stat_energy_from: "s" }] });
  const sums = totals(one, { s: [{ start: Date.UTC(2026, 7, 31, 12), change: 9 }, { start: Date.UTC(2026, 8, 29, 12), change: 4 }, { start: Date.UTC(2026, 8, 30, 10), change: 5 }, { start: Date.UTC(2026, 8, 30, 12), change: 3 }] },
    { s: [{ start: now - 30 * 60e3, change: 0.5 }, { start: now - 35 * 60e3, change: 2 }] }, {}, {}, clock, now);
  // September has only 2 of its 30 days on record: its total is unknown, not the 2 days as the month.
  console.assert(sums.today.solarKwh === 0.5 && sums.month.solarKwh === 3.5 && sums.lastMonth.solarKwh === null && sums.lastMonth.days === 2
    && sums.monthDays.length === 2 && sums.monthDays[0].solarKwh === 3 && sums.monthDays[1].solarKwh === 0.5 && !sums.monthDays[0].none, "totals: wrong day or month buckets", sums);

  // What the forecast takes from the statistics (UTC, 6 October 09:30): today by the hour (house use
  // as the energy balance, not the load sensor), the battery round trip from 8 days of hour rows,
  // standby from a load sensor 1.5 kWh a day under the energy balance (62.5 W) unless standby_w is set.
  {
    const utc = clockOf("UTC"), today = Date.UTC(2026, 9, 6), H = 36e5;
    const prefs = { energy_sources: [{ type: "solar", stat_energy_from: "s" }, { type: "battery", stat_energy_from: "bo", stat_energy_to: "bi" },
      { type: "grid", stat_energy_from: "gi", stat_energy_to: "go" }] };
    const all = entitiesFrom(prefs, { entities: { load_energy: "l" } }), owned = entitiesFrom(prefs, { entities: { load_energy: "l" }, standby_w: 50 });
    const day = (kwh) => ({ s: 10, bo: 3, bi: 3.3, gi: 2, go: 1, l: kwh });
    const daily = (l) => Object.fromEntries(Object.keys(day(l)).map((id) => [id, Array.from({ length: 7 }, (_, i) => ({ start: today - (7 - i) * 864e5, change: day(l)[id] }))]));
    // Every meter has a row every 5 minutes, most of them 0, as Home Assistant records them.
    const five = Array.from({ length: 13 }, (_, i) => today + 9 * H + i * 3e5), rows = (...v) => five.map((start, i) => ({ start, change: v[i] ?? 0 }));
    const recent = { s: rows(0.5, ...Array(10).fill(0), 0.5, 0.2), l: rows(0.4), bo: rows(), bi: rows(), gi: rows(), go: rows() };
    const hourly = { bo: Array.from({ length: 8 * 24 }, (_, i) => ({ start: today - 8 * 864e5 + i * H, change: 0.09 })), bi: Array.from({ length: 8 * 24 }, (_, i) => ({ start: today - 8 * 864e5 + i * H, change: 0.1 })) };
    const st = totals(all, daily(9.2), recent, hourly, {}, utc, today + 9.5 * H);
    console.assert(st.todayHours[today + 9 * H]?.solarKwh === 1 && st.todayHours[today + 9 * H].loadKwh === 1 && st.todayHours[today + 10 * H]?.loadKwh === 0.2 && st.todayHours[today + 9 * H].houseKwh === 0.4, "totals: today not by the hour, or use not the energy balance", st.todayHours);
    console.assert(Math.abs(st.efficiency - 0.9) < 1e-9 && Math.abs(st.standbyW - 62.5) < 1e-9,
      "totals: forecast inputs wrong", st);
    console.assert(totals(all, daily(10.5), recent, hourly, {}, utc, today + 9.5 * H).standbyW === 0, "totals: standby worked out from a gap under 1 kWh a day");
    console.assert(totals(owned, daily(9.2), recent, hourly, {}, utc, today + 9.5 * H).standbyW === 50, "totals: the owner's standby_w lost to the worked out one");
  }
  // The usual day: 6 whole days of sun only at noon (1, 2, 3, 4, 5, 12 kWh; with only solar, use is the same),
  // a machine's 0.5 kWh run at every noon. The sun leaves out each hour's lowest and highest (3.5), use keeps
  // them (4.5) with the run inside it (0.5 apart), and the days spread from their 25th to their 75th
  // percentile over the mean (2.25 and 4.75 over 4.5).
  {
    const utc = clockOf("UTC"), H = 36e5, day0 = Date.UTC(2026, 9, 1), sunOnly = entitiesFrom({ energy_sources: [{ type: "solar", stat_energy_from: "s" }] });
    const s = Array.from({ length: 6 * 24 }, (_, i) => ({ start: day0 + i * H, change: i % 24 === 12 ? [1, 2, 3, 4, 5, 12][Math.floor(i / 24)] : 0 }));
    const runs = { m: Array.from({ length: 6 }, (_, d) => ({ start: day0 + d * 864e5 + 12 * H, change: 0.5 })) };
    const u = totals(sunOnly, {}, {}, { s }, {}, utc, day0 + 6 * 864e5 + 9 * H, {}, runs).usual;
    console.assert(u?.solarW[12] === 3500 && u.loadW[12] === 4500 && u.balanceW[12] === 4500 && u.machineW[12] === 500 && u.machineW[11] === 0 && same(u.spread.sun.map(r3), [0.5, 1.056]),
      "usual day: sun not trimmed, use not kept whole, machine runs not kept apart, or no spread", u?.solarW[12], u?.loadW[12], u?.machineW?.[12], u?.spread);
    // The recorder catching up: day 3's 11:00 row missing, its noon row (3 kWh) holds both and is left out:
    // 1, 2, 4, 5, 12 trimmed is 2, 4, 5.
    const gap = totals(sunOnly, {}, {}, { s: s.filter((r) => r.start !== day0 + 2 * 864e5 + 11 * H) }, {}, utc, day0 + 6 * 864e5 + 9 * H).usual;
    console.assert(r3(gap?.solarW[12]) === 3667, "usual day: a catch-up row counted", gap?.solarW[12]);
    // India (:30 local): rows start on UTC hours, so the row filed under 11 covers 11:30 to 12:30; its
    // 1 kWh goes half to 11 and half to 12.
    const kolkata = clockOf("Asia/Kolkata"), half = Array.from({ length: 6 * 24 }, (_, i) => ({ start: day0 + i * H, change: i % 24 === 6 ? 1 : 0 }));
    const ind = totals(sunOnly, {}, {}, { s: half }, {}, kolkata, day0 + 6 * 864e5 + 9 * H).usual;
    console.assert(ind?.solarW[11] === 500 && ind.solarW[12] === 500 && ind.solarW[10] === 0, "usual day: a half hour zone not split", ind?.solarW.slice(9, 14));
    // Where today's sun so far ends: the solar sensor that lags most; none while one has no row.
    const two = entitiesFrom({ energy_sources: [{ type: "solar", stat_energy_from: "s1" }, { type: "solar", stat_energy_from: "s2" }] });
    const at9 = (m) => ({ start: day0 + 9 * H + m * 6e4, change: 0.1 });
    console.assert(totals(two, {}, { s1: [at9(20)], s2: [at9(5)] }, {}, {}, utc, day0 + 9.5 * H).sunUntil === day0 + 9 * H + 10 * 6e4
      && totals(two, {}, { s1: [at9(20)] }, {}, {}, utc, day0 + 9.5 * H).sunUntil === -Infinity, "totals: sun so far not ended by the sensor that lags most");
  }
  // A forecast day with under 3/4 of its fullest day's hours (the last day cut short) is left to the usual day.
  {
    const rome = clockOf("Europe/Rome"), wh_hours = {};
    for (const [d, n] of [["2026-10-20", 10], ["2026-10-21", 10], ["2026-10-22", 4]]) for (let h = 0; h < n; h++) wh_hours[`${d}T${String(8 + h).padStart(2, "0")}:00:00+02:00`] = 500;
    const st = totals(entitiesFrom({ energy_sources: [{ type: "solar", stat_energy_from: "s" }] }), {}, {}, {}, { fc: { wh_hours } }, rome, Date.parse("2026-10-20T09:00:00+02:00"));
    console.assert("2026-10-21" in st.sunDays && !("2026-10-22" in st.sunDays) && !Object.keys(st.solarWh).some((t) => rome(+t).key === "2026-10-22") && st.forecast.tomorrow === 5,
      "forecast: a day covered in part counted as forecast", st.sunDays);
  }

  // kW sensors, two solar arrays, a dollar house, and a language without texts (English shows).
  const h = fakeHass(SCENARIOS.midday);
  h.states[ID.solarW] = { state: "1.5", attributes: { unit_of_measurement: "kW" } };
  h.states["sensor.roof2"] = { state: "500", attributes: { unit_of_measurement: "W" } };
  const prefs = fakePrefs(SCENARIOS.midday);
  prefs.energy_sources.push({ type: "solar", stat_energy_from: "sensor.roof2_energy", stat_rate: "sensor.roof2" });
  const callWS = h.callWS;
  let p = await draw(h, { language: "ja-JP", locale: { language: "ja-JP" }, config: { ...h.config, currency: "USD" }, callWS: async (m) => (m.type === "energy/get_prefs" ? prefs : callWS(m)) });
  console.assert($(p, ".flowtext").textContent.includes("2000 W"), "units: kW and a second array not summed in W");
  console.assert($(p, ".tabs button").textContent === STRINGS.en.tabNow && (!extras || /\$/.test($(p, "#money .prices b")?.textContent)), "language fallback or currency", $(p, "#money .prices b")?.textContent);

  // No battery: no card, no place in the flow, no part of the share ring. No state of charge: the flow keeps the battery.
  p = await draw(fakeHass(SCENARIOS.nobattery));
  console.assert(!$(p, ".battery") && p.shadowRoot.querySelectorAll(".flow .node").length === 3 && p.shadowRoot.querySelectorAll("#energy .today .part").length === 2
    && !p.shadowRoot.innerHTML.includes("NaN"), "no battery: something of it is still drawn", !!$(p, ".battery"), p.shadowRoot.querySelectorAll(".flow .node").length,
    p.shadowRoot.querySelectorAll("#energy .today .part").length, p.shadowRoot.innerHTML.match(/.{0,80}NaN.{0,40}/)?.[0]);
  p = await draw(fakeHass(SCENARIOS.midday), {}, { entities: { battery_soc: [] } });
  console.assert(!$(p, ".battery") && p.shadowRoot.querySelectorAll(".flow .node").length === 4 && !p.shadowRoot.innerHTML.includes("NaN"), "no state of charge: the card must go, the battery stays in the flow");

  // A sensor named in the settings that does not exist: a message that names it, for admins only.
  p = await draw(fakeHass(SCENARIOS.midday), {}, { entities: { grid_power: "sensor.typo" } });
  console.assert($(p, ".empty") && $(p, ".empty").textContent.includes("sensor.typo") === admin, "missing sensor: no message, or the name shown to a non-admin");
}

// Check: a figure missing from the statistics stays unknown, never 0. Two solar meters, a grid and a house
// meter, two 5 minute rows each today (UTC, 2 November 09:30): 10 kWh of sun, 2 from the grid, the house 9.
// Today by hour draws the house meter (9), the money and the forecast keep the balance (12); without a house
// meter both are the balance. A meter with no rows, a missing row or a change that is not a number leaves its
// part unknown, and what is worked out from it; a real 0 stays 0, as does a part nobody meters (the battery).
{
  const utc = clockOf("UTC"), day = Date.UTC(2026, 10, 2), H = 36e5, now = day + 9.5 * H, at = [day + 9 * H, day + 9 * H + 3e5];
  const prefs = { energy_sources: [{ type: "solar", stat_energy_from: "s1" }, { type: "solar", stat_energy_from: "s2" }, { type: "grid", stat_energy_from: "gi", stat_energy_to: "go" }] };
  const house = entitiesFrom(prefs, { entities: { load_energy: "l" } }), plain = entitiesFrom(prefs);
  const rows = (...v) => v.map((change, i) => ({ start: at[i], change }));
  const run = (src, change = {}) => { const r = { s1: rows(4, 1), s2: rows(3, 2), gi: rows(1, 1), go: rows(0, 0), l: rows(5, 4), ...change }; return totals(src, r, r, {}, {}, utc, now); };
  const hourOf = (st) => st.todayHours[at[0]];
  const ok = run(house);
  console.assert(ok.today.solarKwh === 10 && ok.today.loadKwh === 9 && ok.today.batteryKwh === 0 && ok.today.gridExportKwh === 0 && hourOf(ok).houseKwh === 9 && hourOf(ok).loadKwh === 12,
    "statistics: the house meter not drawn by the hour, or the balance lost", ok.today, hourOf(ok));
  console.assert(run(plain).today.loadKwh === 12 && hourOf(run(plain)).houseKwh === 12, "statistics: without a house meter, use is not the balance");
  const noHouse = run(house, { l: [] }), zero = run(house, { l: rows(0, 0) });
  console.assert(noHouse.today.loadKwh === null && hourOf(noHouse).houseKwh === null && hourOf(noHouse).loadKwh === 12 && hourOf(zero).houseKwh === 0 && zero.today.loadKwh === 0,
    "statistics: a missing house meter read as the balance, or a real 0 lost");
  for (const [what, change] of [["one of two solar meters without rows", { s2: [] }], ["a missing 5 minutes", { s2: rows(3) }], ["a null change", { s2: rows(3, null) }], ["a change that is not a number", { s2: rows(3, NaN) }]]) {
    const st = run(house, change);
    console.assert(st.today.solarKwh === null && hourOf(st).solarKwh === null && hourOf(st).loadKwh === null && st.today.loadKwh === 9, `statistics: ${what} not unknown`, st.today, hourOf(st));
  }
  // The same 5 minutes missing from every meter (rows at 9:00 and 9:10) stays known: a meter that counts up
  // puts those minutes into its next row (see statisticsBuckets). It sums as a row of 0 there would.
  const gap = day + 9 * H + 3e5, all = (...at) => Object.fromEntries(["s1", "s2", "gi", "go", "l"].map((id) => [id, at.map((start) => ({ start, change: start === gap ? 0 : 1 }))]));
  const shared = run(house, all(day + 9 * H, day + 9 * H + 6e5)), zeros = run(house, all(day + 9 * H, gap, day + 9 * H + 6e5));
  console.assert(shared.today.solarKwh === 4 && hourOf(shared).solarKwh === 4 && shared.today.loadKwh === 2 && zeros.today.solarKwh === 4 && hourOf(zeros).solarKwh === 4,
    "statistics: 5 minutes no meter has a row for made the day unknown", shared.today, zeros.today);
  // The night Rome's clocks go back: 5 real hours of rows from midnight are 60 rows, none missing.
  const rome = Date.UTC(2026, 9, 24, 22), night = Object.fromEntries(["s1", "s2", "gi", "go"].map((id) => [id, Array.from({ length: 60 }, (_, i) => ({ start: rome + i * 3e5, change: 1 }))]));
  const fall = totals(plain, night, night, {}, {}, clockOf("Europe/Rome"), rome + 5 * H);
  console.assert(fall.today.solarKwh === 120 && Object.keys(fall.todayHours).length === 5 && Object.values(fall.todayHours).every((x) => x.solarKwh === 24),
    "statistics: the night the clocks go back has a 5 minutes missing", fall.today, fall.todayHours);
  // 1 November has no rows: this month's total is unknown, not today's alone.
  console.assert(ok.month.solarKwh === null && ok.month.days === 1, "statistics: a month with a day missing has a total", ok.month);
  const f = formats("en", "EUR");
  console.assert([f.kwh(null), f.money(NaN), f.num(Infinity), f.moneyWhole(undefined)].every((s) => s === "—") && f.kwh(0) === "0 kWh" && f.money(0) === "0.00 €",
    "formats: an unknown figure is not a dash, or 0 is");
}

// Check: the share ring says its percentage in every language, with and without a battery, the same sentence
// in its hint; with the battery unknown the ring is plain but the share stays; with the grid unknown no share.
{
  const today = { loadKwh: 10, gridImportKwh: 2, batteryKwh: 3, gridExportKwh: 0 };
  const said = (html) => [html.match(/aria-label="([^"]*)"/)?.[1], html.match(/data-hint="([^"]*)"/)?.[1]];
  for (const [l, t] of Object.entries(STRINGS)) for (const batt of [null, { kwh: 10, floor: 20 }]) {
    const f = formats(l, "EUR"), [label, hinted] = said(shareRing({ today, batt, sends: true }, t, f));
    console.assert(label?.includes(`${f.num(80)}%`) && label === hinted && !/\{\w\}/.test(label), `share ring ${l}: no percentage in its label`, label);
  }
  const t = STRINGS.en, f = formats("en", "EUR");
  const part = shareRing({ today: { ...today, batteryKwh: null }, batt: { kwh: 10, floor: 20 }, sends: true }, t, f);
  console.assert(said(part)[0].startsWith("80%") && !part.includes('class="part') && part.includes("<dd>—</dd>") && !/NaN|Infinity/.test(part), "share ring: an unknown battery breaks the ring or loses the share", part);
  const none = shareRing({ today: { ...today, gridImportKwh: null }, batt: { kwh: 10, floor: 20 }, sends: true }, t, f);
  console.assert(!said(none)[0].includes("%") && none.includes('<span class="big">—</span>') && none.includes(t.shareIncomplete), "share ring: an unknown share shown as a number", none);
}

// Check: the install date is a calendar day, its month as written in any time zone (and as an older remembered
// copy holds it, UTC midnight in ms); a day that does not exist counts from the first month on record. A
// month with unknown returns leaves the total unknown.
{
  const t = STRINGS.en, f = formats("en", "EUR"), since = (d) => entitiesFrom(null, { system_cost: 100, install_date: d }).payback.since;
  console.assert(since("2026-11-01") === "2026-11-01" && [since("2026-02-30"), since("2026-11-1"), since("1 Nov 2026"), since(20261101)].every((s) => s === null), "payback: install date not read as a calendar day");
  const got = (pb, all) => paybackCard(all, { cost: 100, before: 0, ...pb }, { t, f }, false).match(/class="amount">([^<]*)</)?.[1];
  for (const [d, before, month] of [["2026-11-01", "2026-10", "2026-11"], ["2027-01-01", "2026-12", "2027-01"]]) {
    const all = [{ key: before, back: 100 }, { key: month, back: 5 }];
    console.assert(got({ since: d }, all) === f.moneyWhole(5) && got({ since: Date.parse(d) }, all) === f.moneyWhole(5), `payback: install ${d} counts another month`, got({ since: d }, all));
  }
  console.assert(paybackCard([{ key: "2026-11", back: null }], { cost: 100, before: 0, since: null }, { t, f }, false).includes(t.paybackIncomplete), "payback: unknown returns counted");
}

// Check: Money with the statistics alone. A month missing from the month rows leaves payback unknown; a fixed
// fee whose entity has no value leaves the cost unknown, not 0; a negative tariff draws no bar or dot below the
// chart; a picked day the month does not have falls back to its last day.
{
  const t = STRINGS.en, f = formats("en", "EUR"), utc = clockOf("UTC"), key = utc(Date.now()).key.slice(0, 7);
  const next = (k) => new Date(Date.UTC(+k.slice(0, 4), +k.slice(5, 7), 1)).toISOString().slice(0, 7);
  const x = { loadKwh: 10, gridImportKwh: 2, gridExportKwh: 1, costMoney: null, earnedMoney: null, days: 30 }, all = [];
  for (let k = "2025-01"; k < key; k = next(k)) all.push([k, x]);
  const html = (months, { fee = 0, price = { buy: 0.3, sell: 0.1 }, pick = null } = {}) => moneyHtml({ t, f, clock: utc, pick, data: {
    price, sends: true, payback: { cost: 1e6, before: 0, since: null }, months, month: x, lastMonth: x, monthKey: key, ahead: null, outlook: null, usualToday: null,
    monthDays: [{ date: Date.parse(`${key}-01`) + 432e5, ...x }], billFixed: { months: {}, now: fee } } });
  console.assert(!html(all).includes(t.paybackIncomplete) && html(all.filter((_, i) => i !== 1)).includes(t.paybackIncomplete), "payback: a month missing from the month rows counted as nothing");
  console.assert(html(all, { fee: null }) !== html(all, { fee: 0 }), "money: a fixed fee with no value counted as 0");
  const low = html(all, { price: { buy: -0.1, sell: -0.2 } });
  console.assert(!/--[vw]:-/.test(low), "money: a negative tariff drawn below its chart", low.match(/--[vw]:-[^;"]*/g));
  console.assert(html(all, { pick: { recent: 30 } }).match(/<div class="day" data-i="\d+">/g)?.length === 1, "daily returns: a picked day past the month's last shows no figures");
}

// Check: money keeps its sign (a negative tariff), energy never goes below 0; in the first hour of a day
// yesterday comes from the 5 minute rows; an hour one battery has no charge for has no combined charge; the
// money so far is unknown where its energy is.
{
  const utc = clockOf("UTC"), day = Date.UTC(2026, 10, 5), H = 36e5, row = (start, change) => [{ start, change }];
  const src = entitiesFrom({ energy_sources: [{ type: "solar", stat_energy_from: "s" }, { type: "grid", stat_energy_from: "gi", stat_energy_to: "go", stat_cost: "c", stat_compensation: "k" }] });
  const now = totals(src, {}, { s: row(day + 9 * H, 10), gi: row(day + 9 * H, 3), go: row(day + 9 * H, 2), c: row(day + 9 * H, -0.6), k: row(day + 9 * H, -0.2) }, {}, {}, utc, day + 12 * H);
  console.assert(now.today.costMoney === -0.6 && now.today.earnedMoney === -0.2 && now.today.solarKwh === 10, "totals: negative money read as 0", now.today);
  const y = day - 3e5, both = (a, b) => [{ start: y, change: a }, { start: day, change: b }];
  const late = totals(src, {}, { s: both(6, 0), gi: both(1, 0), go: both(0, 0) }, {}, {}, utc, day + 0.5 * H);
  console.assert(late.monthDays[3]?.solarKwh === 6, "totals: just after midnight yesterday unknown while its 5 minute rows hold it", late.monthDays[3]);
  const soc = socDay({ a: [{ start: day + 9 * H, mean: 20 }, { start: day + 10 * H, mean: 30 }], b: [{ start: day + 10 * H, mean: 60 }] }, { a: 5, b: 15 }, utc, day + 12 * H, ["a", "b"]);
  console.assert(soc.length === 1 && soc[0][0] === day + 10 * H && soc[0][1] === 52.5, "battery charge: one battery's mean read as all of them", soc);
  const { moneySoFar } = await import("../dist/forecast.js");
  const m = moneySoFar({ [day]: { loadKwh: 1, gridImportKwh: null, gridExportKwh: 0.5 } }, () => 0.3, () => 0.1, 0, day + H);
  console.assert(m.saved === null && m.cost === null && m.earned === 0.05 && m.paid === 0.3, "money so far: an unknown import counted as 0", m);
}

// Check: Hour by hour has the day's real hours in Rome: 23 the day the clocks go forward, 25 the day they go
// back (its two 2:00 told apart, each with its own row), 24 on any other; midnight first.
{
  const t = STRINGS.en, f = formats("en", "EUR", "h23", "Europe/Rome"), clock = clockOf("Europe/Rome"), H = 36e5, real = Date.now;
  const card = (midnightUtc, rows = []) => {
    Date.now = () => midnightUtc + 12 * H;
    try { return battDayCard({ data: { batt: null, now: { soc: null }, battDay: rows, outlook: null }, t, f, clock, pick: null }); } finally { Date.now = real; }
  };
  const cells = (html) => [...html.split('<ol class="hours24"')[1].split("</ol>")[0].matchAll(/<li([^>]*)>/g)].map((m) => m[1].match(/data-hint="([^"]*)"/)?.[1] ?? "");
  const spring = card(Date.UTC(2026, 2, 28, 23)), normal = card(Date.UTC(2026, 10, 4, 23));
  const fall = card(Date.UTC(2026, 9, 24, 22), [[Date.UTC(2026, 9, 25, 0), null, 0, 0, 1, 1, 0], [Date.UTC(2026, 9, 25, 1), null, 0, 0, 2, 2, 0]]);
  const back = cells(fall);
  console.assert(cells(spring).length === 23 && back.length === 25 && cells(normal).length === 24 && spring.includes("--n:23") && fall.includes("--n:25")
    && /<div class="ticks"><span style="left:0%">00</.test(spring + fall), "hour by hour: not the day's real hours, or not from midnight", cells(spring).length, back.length);
  console.assert(back[2] && back[3] && back[2].includes("GMT+2") && back[3].includes("GMT+1") && !back[4].includes("GMT"), "hour by hour: the two 2:00 of the night the clocks go back not told apart", back[2], back[3]);
}

// Check: offline, Now alone shows the message on a page of its own (no dashboard tracks), Energy and Money
// and their tabs gone; back online they return. A redraw puts focus back on the same control (a "?", a
// month, an hour), and Escape hides a hint without moving focus until the viewer leaves it. The language
// picker changes the page's language at once and is no switch.
{
  const p = await draw(fakeHass(SCENARIOS.offline), en);
  attach(p);
  const tabs = [...p.shadowRoot.querySelectorAll(".tabs button")], page = (id) => p.shadowRoot.getElementById(id);
  console.assert(p.shadowRoot.querySelector(".pager").classList.contains("message") && page("energy").hidden && page("money").hidden && tabs[1].hidden && tabs[2].hidden && !tabs[0].hidden,
    "offline: other pages or tabs still shown, or no message layout");
  p.hass = { ...fakeHass(SCENARIOS.sunny), ...en };
  await tick(100);
  console.assert(!p.shadowRoot.querySelector(".pager").classList.contains("message") && !page("energy").hidden && !tabs[1].hidden, "offline: pages not back with the numbers");
  const redraw = () => { p._drawn = ""; p._html = []; p._render(); };
  const active = () => p.shadowRoot.activeElement;
  for (const sel of ['#energy .help[data-card="daily"]', "#energy .daily [data-month]", '#energy .battday .hours24 li[tabindex="0"]', '#now .node[data-focus-key="flow:170:146"]']) {
    const el = $(p, sel);
    el.focus();
    redraw();
    console.assert(active() && active() !== el && active().matches(sel) && active().isConnected, `focus: lost on a redraw (${sel})`, active());
  }
  // A month step draws its card anew and keeps focus on itself, then the other way back to this month.
  for (const sel of ["#energy .daily .total .step-prev", "#energy .daily .total .step-next"]) {
    $(p, sel).focus();
    $(p, sel).click();
    console.assert(active()?.matches(sel), `focus: lost on a month step (${sel})`, active());
  }
  // Safari does not focus a button it clicks. A month step clicked while a day has focus takes focus itself: the
  // redraw must not put it back on that day (its hint would open, the day picked over the month's last).
  for (const sel of ["#energy .daily .total .step-prev", "#energy .daily .total .step-next"]) {
    $(p, '#energy .daily .week li[tabindex="0"]').focus();
    $(p, sel).click();
    console.assert(active()?.matches(sel), `steps: a month step left focus on a day (${sel})`, active());
  }
  // A page in the background gets no focus events from focus(): they are sent by hand, as the browser would.
  const node = () => $(p, '#now .node[data-focus-key="flow:170:146"]'), tip = () => $(p, ".hint").classList.contains("on");
  const enter = (el) => { el.focus(); el.dispatchEvent(new FocusEvent("focusin", { bubbles: true, composed: true })); };
  const escape = (el) => { const e = new KeyboardEvent("keydown", { key: "Escape", bubbles: true, composed: true, cancelable: true }); el.dispatchEvent(e); return e.defaultPrevented; };
  enter(node());
  const shown = tip(), taken = escape(node()), kept = node() === active() && !tip();
  redraw();
  node().dispatchEvent(new FocusEvent("focusin", { bubbles: true, composed: true }));
  console.assert(shown && taken && kept && !tip() && active() === node(), "hint: Escape moved focus, or the hint came back on a redraw", { shown, taken, kept });
  node().dispatchEvent(new FocusEvent("focusout", { bubbles: true, composed: true, relatedTarget: $(p, ".gear") }));
  enter($(p, ".gear"));
  console.assert(!escape($(p, ".gear")), "hint: Escape taken with no hint to hide");
  enter(node());
  console.assert(tip(), "hint: not shown again after leaving and coming back");
  let saved = null;
  try { saved = localStorage.getItem("solar-view-language"); } catch (e) { /* no storage */ }
  const pick = $(p, 'select[name="language"]');
  pick.value = "it";
  pick.dispatchEvent(new Event("change", { bubbles: true }));
  console.assert(p.getAttribute("lang") === "it" && tabs[0].textContent === STRINGS.it.tabNow && getComputedStyle(pick).width !== "48px", "language: not applied at once, or styled as a switch");
  pick.value = "";
  pick.dispatchEvent(new Event("change", { bubbles: true }));
  console.assert(p.getAttribute("lang") === "en" && tabs[0].textContent === STRINGS.en.tabNow
    && (!CSS.supports("appearance", "base-select") || $(p, "selectedcontent").textContent === STRINGS.en.languageAuto), "language: Automatic does not go back to the viewer's, or is not named");
  try { saved === null ? localStorage.removeItem("solar-view-language") : localStorage.setItem("solar-view-language", saved); } catch (e) { /* no storage */ }
  p.remove();
}

// Checks for edge cases, each on a throwaway panel: the midday scenario with something changed.
{
  const midday = (states = {}) => { const h = fakeHass(SCENARIOS.midday); Object.assign(h.states, states); return h; };
  const val = (state) => ({ state: String(state), attributes: {} });
  const focus = (p, sel) => $(p, sel).dispatchEvent(new FocusEvent("focusin", { bubbles: true, composed: true }));
  const hinted = (p) => $(p, ".hint").classList.contains("on");

  // sun.sun without a value must not reach the sky colours or the page as NaN.
  let p = await draw(midday({ "sun.sun": { state: "unknown", attributes: {} } }));
  console.assert(/^#[0-9a-f]{6}$/.test(p.style.getPropertyValue("--sv-sky1")) && !p.shadowRoot.innerHTML.includes("NaN"), "sun without elevation: NaN on the page");

  // "Enough until": not in the morning, and counting what the setting sun still covers (0.2 h here).
  p = await draw(fakeHass(SCENARIOS.dawn));
  console.assert(!/\d/.test($(p, ".batt-say p").textContent), "dawn: battery end time shown while the sun is rising");
  const firstLight = fakeHass(SCENARIOS.evening);
  firstLight.states["sun.sun"] = { state: "below_horizon", attributes: { elevation: -3, rising: true } };
  p = await draw(firstLight);
  console.assert(!/\d/.test($(p, ".batt-say p").textContent), "first light: battery end time shown just before sunrise");
  p = await draw(midday({ [ID.solarW]: val(900), [ID.battW]: val(100), [ID.soc]: val(22),
    "sun.sun": { state: "above_horizon", attributes: { elevation: 8, rising: false } } }));
  console.assert(!/\d/.test($(p, ".batt-say p").textContent), "setting sun: battery end time ignores the sun's share");
  // The evening scenario with the mock sensor, its clock held at 21:00 today: the battery carries the house
  // until the mock's sun at 10:00 tomorrow, so it shows an end time. At a daytime ?at= the sun would take over.
  const eveningAt21 = async (...args) => {
    const real = Date.now, when = new Date(real()).setHours(21, 0, 0, 0);
    Date.now = () => when;
    try { return await draw(fakeHass({ ...SCENARIOS.evening, ahead: "sunny" }), ...args); } finally { Date.now = real; }
  };
  p = await eveningAt21();
  console.assert(/\d/.test($(p, ".batt-say p").textContent), "evening: no battery end time");

  const solarOnly = entitiesFrom({ energy_sources: [{ type: "solar", stat_energy_from: "s" }] });
  // The Solar Forecast by the hour start: at 02:30 on the night the clocks go back, the hour after is the
  // second 02:00, its own hour (summed with the first it would read as no fade at all).
  {
    const wh_hours = Object.fromEntries([3000, 400, 400, 400].map((v, i) => [new Date(Date.parse("2026-10-25T00:00:00Z") + i * 36e5).toISOString(), v]));
    const f = totals(solarOnly, {}, {}, {}, { fc: { wh_hours } }, clockOf("Europe/Rome"), Date.parse("2026-10-25T02:30:00+02:00")).forecast;
    console.assert(f?.fade.now === 3000 && f.fade.next === 400 && f.today === 4.2, "forecast: the repeated hour counted as one", f);
  }

  // No forecast, no outlook: no "enough until" of any kind, only what the battery does now.
  p = await draw(fakeHass({ ...SCENARIOS.evening, forecast: null, ahead: null }), en);
  console.assert($(p, ".batt-say p").textContent === STRINGS.en.discharging, "no forecast: the battery end guessed anyway", $(p, ".batt-say p").textContent);

  // Battery ring: the percentage and, when the size is known, the stored kWh in its name. The bar is gone.
  const ringName = (p) => $(p, ".battery svg.ring")?.getAttribute("aria-label") ?? "";
  p = await draw(midday(), en);
  console.assert(ringName(p).includes("70%") && ringName(p).includes("kWh") && !$(p, ".gauge"), "battery ring: missing, unnamed, or the bar still drawn", ringName(p));
  p = await draw(fakeHass(SCENARIOS.battUnknown), en);
  console.assert(ringName(p).includes("70%") && !ringName(p).includes("kWh"), "battery ring: kWh named for a battery of unknown size", ringName(p));
  // Any ring: values past 0..1 stay on the ring, NaN never reaches the markup.
  {
    const box = document.body.appendChild(document.createElement("div"));
    box.innerHTML = ring(1.2, "--batt", "x");
    const svg = box.firstElementChild, b = svg.getBBox(), v = svg.viewBox.baseVal;
    console.assert(b.x >= v.x && b.y >= v.y && b.x + b.width <= v.x + v.width && b.y + b.height <= v.y + v.height, "ring: drawn outside its box", b);
    console.assert(!ring(NaN, "--batt", "x").includes("NaN"), "ring: NaN in the markup");
    box.remove();
  }

  // Battery words count from the floor (20 %): at the floor "Empty" and its advice, just above it "Low".
  const socAt = (scenario, soc) => { const h = fakeHass(SCENARIOS[scenario]); h.states[ID.soc] = val(soc); return draw(h, en); };
  p = await socAt("night", 20);
  console.assert($(p, ".batt-word").textContent === STRINGS.en.empty && STRINGS.en.adviceEmpty.includes($(p, ".advice p").textContent), "battery at the floor: not called empty");
  p = await socAt("night", 30);
  console.assert($(p, ".batt-word").textContent === STRINGS.en.low && $(p, ".advice").dataset.kind === "low", "battery just above the floor: not called low");
  // Sun to spare that fades soon is no worry with a nearly full battery, and export alone is no spare sun without one.
  p = await draw((() => { const h = fakeHass({ ...SCENARIOS.midday, fade: [3000, 400] }); h.states[ID.soc] = val(90); return h; })(), en);
  console.assert($(p, ".advice").dataset.kind === "go", "full battery: still warned that the sun fades");
  p = await draw(midday({ [ID.solarW]: val(600), [ID.battW]: val(0), [ID.gridW]: val(-200) }));
  console.assert($(p, ".advice").dataset.kind !== "go", "200 W sent to the grid read as spare sun");
  // Charging from the grid at night is not "filling up with sun", and the sun arrow stays off.
  p = await draw(midday({ [ID.solarW]: val(0), [ID.battW]: val(-1000), [ID.gridW]: val(1300) }), en);
  console.assert($(p, ".batt-say p").textContent === STRINGS.en.chargingGrid && p.shadowRoot.querySelectorAll(".flow .streak").length === 1, "grid charging: shown as sun");
  // This month's days: each from its day row, today from its 5 minute rows; a day with no rows is none.
  {
    const utcDay = (d) => Date.UTC(2026, 9, d), sunOnly = entitiesFrom({ energy_sources: [{ type: "solar", stat_energy_from: "s" }] });
    const daily = { s: [...Array.from({ length: 30 }, (_, i) => ({ start: Date.UTC(2026, 8, 1 + i), change: 10 })), { start: utcDay(1), change: 10 }] };
    const m = totals(sunOnly, daily, { s: [{ start: utcDay(2) + 36e5, change: 0.1 }] }, {}, {}, clockOf("UTC"), utcDay(2) + 8 * 36e5);
    const empty = totals(sunOnly, { s: daily.s.slice(0, 30) }, { s: [{ start: utcDay(2) + 36e5, change: 0.1 }] }, {}, {}, clockOf("UTC"), utcDay(2) + 8 * 36e5);
    console.assert(m.month.solarKwh === 10.1 && m.forecast === null && m.monthDays.map((d) => d.solarKwh).join() === "10,0.1" && !m.monthDays.some((d) => d.none)
      && empty.monthDays[0].none && !empty.monthDays[1].none, "month days: not each day's rows, or a day without rows not none", m.monthDays, empty.monthDays);
  }

  // 12 or 24 hours: the panel config first, then the viewer's profile.
  const clockText = async (more, config) => $(await eveningAt21({ language: "en", locale: { language: "en", ...more } }, config), ".batt-say p").textContent;
  console.assert(/[AP]M/.test(await clockText({})) && !/[AP]M/.test(await clockText({ time_format: "24" })) && !/[AP]M/.test(await clockText({}, { time_format: 24 }))
    && /[AP]M/.test(await clockText({ time_format: "24" }, { time_format: "12" })), "time format: 12 or 24 hours not followed");

  // Properties set before the element was defined (Home Assistant on a first visit) must still draw.
  p = document.createElement("solar-view");
  for (const [k, v] of Object.entries({ hass: midday(), narrow: true, panel: { config: {} } })) Object.defineProperty(p, k, { value: v, writable: true, configurable: true, enumerable: true });
  attach(p); await tick(); p.remove();
  console.assert($(p, "#now .advice") && $(p, ".tabs button").textContent, "early properties: the page stayed empty");

  // The menu button: on a narrow screen, and on a wide one when the sidebar is always hidden.
  const menu = async (narrow, dockedSidebar) => !$(await draw(midday(), { dockedSidebar, props: { narrow } }), "ha-menu-button").hidden;
  console.assert(await menu(true, "auto") && !(await menu(false, "docked")) && await menu(false, "always_hidden"), "menu button: wrong for some sidebar setting");

  // A hint must not outlive the numbers it was read from.
  p = await draw(midday());
  focus(p, ".battery .ring");
  console.assert(hinted(p), "hint: not shown on focus");
  p.hass = midday({ [ID.soc]: val(33) });
  console.assert(!hinted(p), "hint: still showing the old numbers after a redraw");

  // Skeleton: really hidden from screen readers, and no hint from its placeholder numbers.
  p = await draw(fakeHass(SCENARIOS.midday, true));
  console.assert($(p, ".pager").classList.contains("skel") && $(p, "#now").getAttribute("aria-hidden") === "true" && $(p, "#now").inert, "skeleton: pages not hidden");
  focus(p, ".battery .ring");
  console.assert(!hinted(p), "skeleton: hint shows placeholder numbers");

  // On the page before Home Assistant hands it anything: a sky, not a blank page.
  const bare = document.createElement("solar-view");
  document.body.append(bare);
  console.assert(bare.style.getPropertyValue("--l1"), "no hass yet: a blank page, no sky");
  bare.remove();

  // A remembered copy of an old shape is not used (see placeholder): the typical numbers stand in.
  localStorage.setItem("solar-view-last", JSON.stringify({ now: { soc: 50 }, monthDays: [{ solarKwh: 3 }], batt: null }));
  p = await draw(fakeHass(SCENARIOS.midday, true));
  console.assert(p && $(p, "#now .advice"), "remembered copy of an old shape: blank page");
  // One of the right shape that still cannot be drawn: the draw fails, the copy goes, the typical numbers stand in.
  localStorage.setItem("solar-view-last", JSON.stringify({ now: { soc: 50 }, monthDays: [{ solarKwh: 3 }], batt: null, sends: true }));
  const error = console.error;
  let failedDraws = 0;
  console.error = () => { failedDraws++; }; // the panel reports the failed draw, which is expected here
  try { p = await draw(fakeHass(SCENARIOS.midday, true)); } catch (e) { p = null; } finally { console.error = error; }
  console.assert(failedDraws > 0 && localStorage.getItem("solar-view-last") === null && p && $(p, "#now .advice"), "broken remembered copy: no failed draw, the copy kept, or a blank page", failedDraws);

  // Nothing is remembered now, as on a first visit: that skeleton must not be redrawn by every update.
  const header = $(p, "#now header");
  await tick(5); p.hass = { ...p.hass };
  console.assert(header === $(p, "#now header"), "first visit: the skeleton is redrawn on every update");

  // A first visit's skeleton has the pages, tabs and cards the loaded page will have, with or without a battery
