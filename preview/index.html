<!-- Preview of the real panel (../dist/solar-view.js)
     driven by a fake `hass` object: states, Energy settings, statistics and forecast. ?scenario= ?lang=en|it|es|fr|de|pt|nl|pl ?dark=0|1 ?admin=0 ?extras=0 ?first=1
     ?day=N picks the advice line as if it were day N (0, 1, 2...), instead of today's.
     ?loading=2 starts with 2 seconds of "Home Assistant is still starting"; the button replays it.
     ?page=now|energy|money opens on that page, ?shot=1 hides this tool's controls.
     ?check=skeleton compares the loading skeleton with the loaded page, ?sweep=1 tries every combination of sensor values.
     ?display=rain:0,clouds:0 turns those display switches off on this device, as the gear would.
     The "preview" drawer sets all of this live, plus the time (?at=2026-10-25T11:00), the forecast and
     the live values on top of the scenario; every change goes into the URL, so a link reproduces it.
     The checks are the console.assert calls below: the console must stay free of assertion failures. -->
<script>

  document.documentElement.lang = new URLSearchParams(location.search).get("lang") || navigator.language;

  try {
    const d = new URLSearchParams(location.search).get("display");
    if (d === null) localStorage.removeItem("solar-view-show");
    else localStorage.setItem("solar-view-show", JSON.stringify(Object.fromEntries(d.split(",").map((s) => s.split(":")).filter(([, v]) => v === "0").map(([k]) => [k, false]))));
  } catch (e) { /* no storage: every switch on */ }
</script>

<script type="module">
import { STRINGS, LANGUAGES, loadLanguage, formats, entitiesFrom, clockOf, totals, ring, SKY, skyAt, dawnOf, greyOf, moonPhase, paybackLeft, monthSun, seasonGuess, yearKeys, shareRing, paybackCard, socDay, moneyHtml, battDayCard, wearOf } from "../dist/solar-view.js";
// Failed checks are also listed in window.failed, for tools that cannot read the console.

{
  const supported = (l) => [l, l.split("-")[0]].find((c) => Object.hasOwn(LANGUAGES, c));
  let chosen = "";
  try { chosen = localStorage.getItem("solar-view-language") ?? ""; } catch (e) { /* no storage */ }
  const guess = supported(chosen) ?? supported(document.documentElement.lang) ?? "en";
  console.assert(textFiles().sort().join() === [...new Set(["en", guess])].sort().join(), "texts: the first load fetched other languages", textFiles());
}
// The panel above has read its switches (?display=) by now: the checks below start with every switch on.
try { localStorage.removeItem("solar-view-show"); } catch (e) { /* no storage: nothing kept */ }
// The clock of the whole page, the panel's and the checks' alike: the real one moved by `offset`, so it
// keeps ticking from the time picked in the drawer (?at=). The fake data below is built from it too.
const trueNow = Date.now.bind(Date);
let offset = 0;
Date.now = () => trueNow() + offset;

// A real house's 2017, day by day, for the fake statistics' past days (see home-days.py).
const HOME = await (await fetch("./home-days.json")).json();
// Its town's real weather that year, hour by hour (cloud %, rain mm; the url in the file rebuilds it), for
// the drawer's "real" weather: the forecast sensor then says what that house and sky really did.
const WEATHER = await (await fetch("./home-weather.json")).json();
// A time's day of 2017 (the same date) and hour of that year; the hour's real sun, the day's total in the
// mock's bell shape.
const day2017 = (t) => { const d = new Date(t); return Math.min(364, Math.round((Date.UTC(2017, d.getMonth(), d.getDate()) - Date.UTC(2017, 0, 1)) / 864e5)); };
const hour2017 = (t) => day2017(t) * 24 + new Date(t).getHours();
// The same house by the hour (home-hours.json, see home-days.py), for the drawer's "real" live values.
const HOURS = await (await fetch("./home-hours.json")).json();
// The house's hour holding `t`: sun and use in kWh, the battery's charge at its start and end in %, and the flows
// that follow from them, 95 % each way as home-days.py simulates them (charged, given, grid in, grid out).
// Without a battery the charge is 0 and the grid takes all.
const realHour = (t, battery = true) => {
  const i = hour2017(t), sun = HOURS.sun[i], use = HOURS.use[i];
  const end = battery ? HOURS.soc[i] : 0, start = battery ? HOURS.soc[i - 1] ?? end : 0, d = ((end - start) / 100) * 10;
  const charge = d > 0 ? d / 0.95 : 0, out = d < 0 ? -d * 0.95 : 0, spare = sun - use;
  return { sun, use, start, end, charge, out, imp: Math.max(0, -spare - out), exp: Math.max(0, spare - charge) };
};
// A statistics part of that hour, in kWh (money at RECORDED's prices).
const realPart = (part, t, battery) => {
  const r = realHour(t, battery);
  return { solarKwh: r.sun, loadKwh: r.use, chargeKwh: r.charge, batteryKwh: r.out, gridImportKwh: r.imp, gridExportKwh: r.exp,
    costMoney: r.imp * RECORDED.buy, earnedMoney: r.exp * RECORDED.sell }[part] ?? 0;

// The live values at `t` from those hours, as a scenario's first four `v`: solar W, battery W (+ giving), grid W
// (+ taking), and the charge in % by the minute.
const realLive = (t) => {
  const r = realHour(t), f = (t % 36e5) / 36e5;
  return [Math.round(r.sun * 1000), Math.round((r.out - r.charge) * 1000), Math.round((r.imp - r.exp) * 1000), Math.round(r.start + (r.end - r.start) * f)];
};
const realSun = (t) => HOME.days[day2017(t)][0] * bellKwh(new Date(t).getHours(), "sunny") / BELL_DAY;
// The sensors of the fake house, named as its fake Energy settings name them.
const ID = {
  solarW: "sensor.solar_power", battW: "sensor.battery_power", gridW: "sensor.grid_power", soc: "sensor.battery_soc",
  solarKwh: "sensor.solar_energy", batteryKwh: "sensor.battery_out_energy", chargeKwh: "sensor.battery_in_energy",
  gridImportKwh: "sensor.grid_in_energy", gridExportKwh: "sensor.grid_out_energy",
  // The cost sensors Home Assistant makes for a grid with prices (see energy/info in fakeHass).
  costMoney: "sensor.grid_in_energy_cost", earnedMoney: "sensor.grid_out_energy_compensation",

// rows before that day (its month row from that month on), as Home Assistant keeps a new statistic.
const ROOF2 = "sensor.roof2_energy";

// What the fake grid's kWh cost and paid, as its cost sensors record them: today's prices of the fake

const RECORDED = { buy: 0.3, sell: 0.1 };

  full:    { v: [2500, 0, -2100, 100, 40, false], today: [9.4, 6.6, 0.2, 1.1], expect: "go" },
  dawn:    { v: [130, 270, 0, 24, 3, true], today: [0.2, 2.6, 0.1, 0], expect: "ok" },
  dusk:    { v: [30, 620, 0, 60, 1, false], today: [15.2, 12.4, 0.3, 0.1], expect: "ok" },
  night:   { v: [8, 0, 350, 26, -30, false], today: [15.2, 14.1, 0.9, 0.1], expect: "low" },
  evening: { v: [0, 350, 0, 60, -20, false], today: [15.2, 12.4, 0.3, 0.1], expect: "ok" }, // the night-time "ok" lines

  // Spare sun now, but the forecast drops from [this hour, the next 3 hours] in Wh: "soon" instead of "go".
  // Without a battery: with one, spare sun is only spare once it is nearly full, and then it carries the cycle.
  fading:  { v: [2500, 0, -2100, 0, 42, false], today: [7.8, 6.1, 1.2, 2.9], battery: false, fade: [3000, 400], expect: "soon" },
  // Not much sun now, but the next 3 hours are forecast to be clearly sunnier: "later".
  brightening: { v: [250, 150, 0, 45, 30, false], today: [1.2, 5.0, 0.4, 0], fade: [300, 1500], expect: "later" },
  poorNoForecast: { v: [250, 150, 0, 45, 30, false], today: [1.2, 5.0, 0.4, 0], forecast: null, expect: "ok" },
  // A winter morning: little sun, an almost empty battery, most of the day so far from the grid (`out`: kWh the battery gave).
  winter:  { v: [150, 0, 900, 12, 4, true], today: [0.4, 6.0, 5.2, 0], out: 0.3, forecast: null, expect: "ok" },
  // A house with panels and a grid connection, no battery.
  nobattery: { v: [2500, 0, -2100, 0, 42, false], today: [7.8, 6.1, 1.2, 2.9], battery: false, expect: "go" },
  // The Energy page of Home Assistant was never set up.
  nodata:  null,
  // The inverter is down: the sensors exist but have no value.
  offline: { v: ["unavailable", "unavailable", "unavailable", "unavailable", 30, false], today: [3, 3, 0, 0], offline: true },
  // With the forecast sensor (see fakeForecast): `ahead` names its weather, "stale" is 4 hours old,
  // so the page builds its own from the usual day (`hourly`).
  sunny:   { v: [2500, -2100, 0, 70, 42, false], today: [7.8, 6.1, 0.2, 0], ahead: "sunny", expect: "ok" },
  cloudy:  { v: [700, 100, 0, 55, 30, false], today: [3.1, 5.2, 0.4, 0], ahead: "cloudy", expect: "ok" },
  rain:    { v: [150, 250, 0, 45, 25, false], today: [1.4, 5.0, 0.6, 0], ahead: "rain", expect: "ok" },
  stale:   { v: [2500, -2100, 0, 70, 42, false], today: [7.8, 6.1, 0.2, 0], ahead: "stale", hourly: { solarKwh: 0.5 }, expect: "ok" },
  // The first days after install: no usual day, and the service writes nothing until there is one.
  firstDays: { v: [0, 350, 0, 60, -20, false], today: [15.2, 12.4, 0.3, 0.1], firstDays: true, expect: "ok" },
  // A battery of unknown size: no battery figures from the forecast.
  battUnknown: { v: [2500, -2100, 0, 70, 42, false], today: [7.8, 6.1, 0.2, 0], ahead: "sunny", battKwh: null, expect: "ok" },
  // A zero-export inverter with a full battery: the spare sun is throttled (lost), so solar only meets the house.
  exportOffFull: { v: [600, 0, 0, 100, 40, false], today: [9.4, 6.6, 0.2, 0], ahead: "sunny", exportOff: true, expect: "ok" },
  // Payback done (see configOf): a 1000 system, back within the months on record, then one back before Home
  // Assistant recorded (saved before over the cost).
  paidBack: { v: [2500, -2100, 0, 70, 42, false], today: [7.8, 6.1, 0.2, 0], payback: { cost: 1000 }, expect: "ok" },
  paidBefore: { v: [2500, -2100, 0, 70, 42, false], today: [7.8, 6.1, 0.2, 0], payback: { cost: 1000, before: 1500 }, expect: "ok" },
  // A second inverter, its meter 2 days old (see ROOF2), with hour rows so there could be a usual day.
  expanded: { v: [2500, -2100, 0, 70, 42, false], today: [7.8, 6.1, 0.2, 0], roof2: 2, hourly: { solarKwh: 0.5, gridImportKwh: 0.4 }, expect: "ok" },
  // A battery installed 9 years and 7 months ago (see configOf), past the 9.5 years of the wear card.
  batteryExpiring: { v: [2500, -2100, 0, 70, 42, false], today: [7.8, 6.1, 0.2, 0], batteryAgeDays: 3500, expect: "ok" },
};
// Left out of the drawer's list: the weather has its own list and the time its slider. The checks still use them.
const DRAWER_SKIPS = ["sunny", "cloudy", "rain", "dawn", "dusk"];
// The panel config a scenario needs.
// Every panel has a payback setting while prices are on: the system cost 9000 and went in about 9 months ago
// (under a year on record, so time left is a range). ?payback=0 leaves it out.
const configOf = (s) => ({ ...(extras && q.get("payback") !== "0" ? { system_cost: s?.payback?.cost ?? 9000, install_date: new Date(localMidnight(270)).toISOString().slice(0, 10),
  ...(s?.payback?.before ? { saved_before: s.payback.before } : {}) } : {}),
  // A tariff with the bands' typed prices: the PUN of October 2026 (GME), F23 the mean of F2 and F3.
  ...(s?.tariff ? { tariff: { type: s.tariff, prices: { f1: 0.233, f2: s.tariff === "two" ? 0.234 : 0.252, f3: 0.216 } } } : {}),
  ...(s?.batteryAgeDays ? { battery_install_date: new Date(localMidnight(s.batteryAgeDays)).toISOString().slice(0, 10) } : {}),
  ...(s?.exportOff ? { export_max_kw: 0 } : {}), ...(s?.floor != null ? { battery_floor: s.floor } : {}), ...(q.get("bill") ? { bill_months: +q.get("bill") } : {}), ...(q.get("billstart") ? { bill_start: q.get("billstart") } : {}) });
const q = new URLSearchParams(location.search);
const name = q.get("scenario") in SCENARIOS ? q.get("scenario") : "midday";
// Language, theme and viewer can change from the drawer once the checks have run.
let lang = q.get("lang") || navigator.language;
let dark = q.has("dark") ? q.get("dark") === "1" : matchMedia("(prefers-color-scheme: dark)").matches;
// ?admin=0 shows the page as a non-admin user (no sensor names in the setup message). ?extras=0 drops forecast and prices.
let admin = q.get("admin") !== "0";
const extras = q.get("extras") !== "0";
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
const localMidnight = (daysBack = 0) => { const d = new Date(Date.now()); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - daysBack); return d.getTime(); };
// The mock's sun in kWh for an hour of the day: a bell from 10:00 to 15:00, about 3.5 at its top, halved when grey.
const GREY = ["cloudy", "overcast", "rain", "snow"];

// For the checks: English for a drawn panel, a text's {x} filled from `parts`, the same as JSON, 3 decimals.
const en = { language: "en", locale: { language: "en" } }, say = (text, parts) => text.replace(/\{(\w)\}/g, (_, k) => parts[k]);

function fakePrefs(s) {

    { type: "grid", stat_energy_from: ID.gridImportKwh, stat_energy_to: ID.gridExportKwh, stat_rate: ID.gridW,
      number_energy_price: extras ? 0.3 : null, number_energy_price_export: extras ? 0.1 : null }];
  if (s.roof2 != null) sources.splice(1, 0, { type: "solar", stat_energy_from: ROOF2 });
  if (s.battery !== false) sources.push({ type: "battery", stat_energy_from: ID.batteryKwh, stat_energy_to: ID.chargeKwh,

    return Object.fromEntries(msg.statistic_ids.map((id) => [id, Array.from({ length: Math.max(0, Math.floor((Date.now() - from) / 36e5)) }, (_, i) => {

      change: s.real ? realPart(partOf(id), localMidnight(14) + i * 36e5, s.battery !== false) : hourly(partOf(id), localMidnight(14) + i * 36e5) }))
    : []]));

  // Today: every part follows a day profile (the sun from 7:00 to 18:00, the house more in the evening, the

  const PROFILE = { solarKwh: sunW, chargeKwh: sunW, gridExportKwh: sunW, earnedMoney: sunW, gridImportKwh: useW, costMoney: useW, batteryKwh: (h) => (sunW(h) ? 0.1 : useW(h)) };

  if (n === "scenario") Object.assign(ctl, { scenario: t.value }, ctlOf(SCENARIOS[t.value]));
  else if (n === "date" || n === "minute") {
    const m = +el.minute.value;
    ctl.at = `${el.date.value}T${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
    setClock();
    Object.assign(ctl, sunNow());
  } else if (n in ctl) {
    ctl[n] = t.type === "checkbox" ? t.checked : typeof ctl[n] === "number" ? +t.value : t.value;
    // A slider moved by hand is no longer the house's; a forecast picked turns the house on (the usual day is its own).
    if (["solar", "battW", "gridW", "soc"].includes(n)) ctl.real = false;
    if (n === "fc") ctl.real = t.value !== "none";
  }
  else if (n === "theme") { t.value === "system" ? q.delete("dark") : q.set("dark", t.value === "dark" ? "1" : "0"); dark = t.value === "system" ? matchMedia("(prefers-color-scheme: dark)").matches : t.value === "dark"; }
  else if (n === "lang") { t.value ? q.set("lang", t.value) : q.delete("lang"); lang = t.value || navigator.language; }
  else if (n === "admin") { t.checked ? q.delete("admin") : q.set("admin", "0"); admin = t.checked; }
  else if (n === "day") { t.value === "" ? q.delete("day") : q.set("day", t.value); panel.testDay = t.value === "" ? undefined : +t.value; }
  else if (n === "page") { q.set("page", t.value); $(panel, `.tabs [data-page="${t.value}"]`)?.click(); }
  else if (n === "sw") {
    // The panel reads its switches when it is made, so these take a reload, as the gear's do for a new page.
    const off = [...form.querySelectorAll("[name=sw]")].filter((b) => !b.checked).map((b) => `${b.value}:0`);
    off.length ? q.set("display", off.join(",")) : q.delete("display");
    save();
    location.reload();
    return;
  }
  save();
  fill();
  if (n !== "page") show();
});
form.addEventListener("click", (e) => {
  const what = e.target.dataset?.do;
  if (what === "now") { ctl.at = null; setClock(); Object.assign(ctl, sunNow()); save(); fill(); show(); }
  // Not a plain reload: from ?sweep=1 or ?check= that would run those again.
  if (what === "checks") { q.delete("sweep"); q.delete("check"); location.search = `?${q}`; }
  if (what === "sweep") location.search = "?sweep=1";
  if (what === "loading") load(2);
  if (what === "skeleton") window.skeletonCheck?.().then((d) => { el.status.value = `skeleton check: ${d.length} boxes differ (console has the table)`; });
});
fill();

// A throwaway panel, drawn once its numbers have loaded.
const draw = async (hass, more = {}, config) => {
  const p = document.createElement("solar-view");
  if (config) p.panel = { config };
  Object.assign(p, more.props || {});
  p.hass = { ...hass, ...more, props: undefined };
  await tick();
  return p;
};
const $ = (p, sel) => p.shadowRoot.querySelector(sel);
// A throwaway panel put on the page across a wait (focus and showModal need it there): out of sight
// and out of the layout, or it and its dialog flash over the real panel.
const attach = (p) => {
  p.shadowRoot.append(Object.assign(document.createElement("style"), { textContent: ":host{position:fixed;inset:0;opacity:0;pointer-events:none}dialog,::backdrop{opacity:0}" }));
  document.body.append(p);
};

// The skeleton is drawn from what this browser showed last time. Pretend the last visit was this
// same scenario, so "loading" looks as it would on a second visit. ?first=1 shows a first visit.
// Before the checks below: they take a few seconds, and the panel would stay blank until they end.
// Their panels each remember their own numbers, so this runs again once they are done.
async function remember() {
  const s = current();
  if (q.get("first") === "1") try { localStorage.removeItem("solar-view-last"); } catch (e) { /* no storage: a first visit anyway */ }
  else if (s && !s.offline) await draw(fakeHass(s), {}, configOf(s));
}
await remember();
load(Number(q.get("loading")) || 0);
await tick(); // a first visit draws once the Energy settings answer (see _render)
console.assert(panel.shadowRoot.getElementById("now").innerHTML, "reload: the panel is blank until the checks end");

// For screenshots: ?shot=1 hides this tool's own controls, ?page=now|energy|money (after the checks) opens on that page.
if (q.get("shot") === "1") document.getElementById("dev-open").hidden = true;

// Check: a language not loaded yet comes when the gear picks it, without a reload. The page keeps its texts and
// numbers until the file is there, then changes both, and the go line gets its appliance icon (day 1: the oven)
// and the owner's own lines for that language are there. Then every language is loaded, for the checks below.
{
  const late = Object.keys(LANGUAGES).find((l) => !STRINGS[l]);
  const p = await draw(fakeHass(SCENARIOS.nobattery), { ...en, props: { testDay: 1 } }, { advice: { [late]: { go: ["Own line"] } } });
  attach(p);
  let saved = null;
  try { saved = localStorage.getItem("solar-view-language"); } catch (e) { /* no storage */ }
  const pick = $(p, 'select[name="language"]'), tab = () => $(p, ".tabs button").textContent;
  pick.value = late;
  pick.dispatchEvent(new Event("change", { bubbles: true }));
  const kept = tab() === STRINGS.en.tabNow && p.getAttribute("lang") === "en";
  await loadLanguage(late);
  await tick();
  console.assert(kept && tab() === STRINGS[late].tabNow && p.getAttribute("lang") === late && textFiles().filter((l) => l === late).length === 1,
    "a language loaded late: not kept until its file came, or not applied", late, { kept, tab: tab() });
  console.assert($(p, ".advice p").textContent === STRINGS[late].adviceGo[1] && $(p, ".advice svg").innerHTML.includes("M20 21v-8"), "a language loaded late: its go line without its icon");
  p.testDay = STRINGS[late].adviceGo.length;
  p._drawn = ""; p.hass = { ...p.hass };
  await tick();
  console.assert($(p, ".advice p").textContent === "Own line", "a language loaded late: the owner's own lines missing", $(p, ".advice p").textContent);
  try { saved === null ? localStorage.removeItem("solar-view-language") : localStorage.setItem("solar-view-language", saved); } catch (e) { /* no storage */ }
  p.remove();
}
await Promise.all(Object.keys(LANGUAGES).map(loadLanguage));
// Each language's file as written, without the English the panel puts under it.
const TEXTS = Object.fromEntries(await Promise.all(Object.keys(LANGUAGES).map(async (code) => {
  const own = (await import(`../dist/strings-${code}.js`)).STRINGS;
  console.assert(Object.keys(own).join() === code, `strings-${code}.js: holds another language`, Object.keys(own));
  return [code, own[code]];

// Check: the drawer's "real" live values: the battery ring shows the house's charge now, and today's sun so far
// is its hours' sun up to now (the 5 minute rows lag a little, so within 0.2 kWh).
{
  const now = Date.now(), live = realLive(now);
  const p = await draw(fakeHass({ ...SCENARIOS.midday, real: true, hourly: usualHour(true), v: [...live, 30, false] }), en);
  const ring = Number($(p, ".battery .big")?.firstChild?.textContent), t0 = localMidnight(), h = (now - t0) / 36e5;
  const sun = Array.from({ length: Math.ceil(h) }, (_, i) => realPart("solarKwh", t0 + i * 36e5, true) * Math.min(1, h - i)).reduce((a, b) => a + b, 0);
  console.assert(ring === live[3] && Math.abs(p._stats.today.solarKwh - sun) < 0.2, "real live values: the ring or today's sun not the house's", ring, live, p._stats.today.solarKwh, sun);
}

// Check: the config in groups reads as the flat keys; predictions.level none (no forecast) and usual (the
// page's own beside a fresh sensor); in Italian every number on Now, Energy and Money, and in their names and
// hints, has a decimal point, never a comma.
{
  const flat = await draw(fakeHass(SCENARIOS.sunny), en, { battery_floor: 30, entities: { load_energy: "sensor.x" } });
  const grouped = await draw(fakeHass(SCENARIOS.sunny), en, { plant: { battery_floor: 30 }, sensors: { load_energy: "sensor.x" } });
  console.assert(flat._src.batt.floor === 30 && grouped._src.batt.floor === 30 && same(grouped._src.loadKwh, ["sensor.x"]), "config: groups not read as the flat keys", grouped._src.batt, grouped._src.loadKwh);
  const none = await draw(fakeHass(SCENARIOS.stale), en, { predictions: { level: "none" } }); // stale has hour rows: a usual day
  const usual = await draw(fakeHass(SCENARIOS.sunny), en, { predictions: { level: "usual" } });
  // Machines by type, in the order written; a bare type is a run of 1 kWh over 2 hours; none at all is the washer.
  const mach = await draw(fakeHass(SCENARIOS.sunny), en, { machines: { quiet_hours: "1-6", dryer: { kwh: 2.5, hours: 2 }, dishwasher: null, oven: { kwh: 2 } } });
  console.assert(same(mach._src.machines.map((m) => [m.type, m.kwh]), [["dryer", 2.5], ["dishwasher", 1]]) && mach._src.quiet[0] === 1 && same(flat._src.machines.map((m) => m.type), ["washer"]),
    "config: machines not read by type", mach._src.machines, mach._src.quiet);
  console.assert(none._ahead === null && none._outlook === null && !$(none, ".best") && none._stats.usual === null && !$(none, ".today .usual") && usual._ahead?.from !== "sensor", "config: level none or usual not kept", none._ahead?.from, !!none._stats.usual, usual._ahead?.from);
  // Check: the help lines follow the level: month end and days to come only where Production draws them, the
  // battery's range only from the sensor, the small rings' line naming where they come from, the weather line
  // only with an icon drawn.
  const shown = (p, k) => { const li = $(p, `dialog.read [data-t="${k}"]`)?.closest("li"); return !!li && !li.hidden; };
  for (const [what, p] of [["level none", none], ["level usual", usual], ["sensor", flat]]) {
    const rings = !!$(p, ".today.share .rings");
    console.assert(shown(p, "helpProdEnd") === !!$(p, ".daily i.ghost") && shown(p, "helpProdAhead") === !!$(p, ".daily li.ahead")
      && !(shown(p, "helpRange") && p._ahead?.from !== "sensor")
      && shown(p, "helpShareAhead") === (rings && p._ahead?.from !== "sensor") && shown(p, "helpShareAheadFc") === (rings && p._ahead?.from === "sensor")
      && shown(p, "helpDaysSky") === !!$(p, ".coming svg.wx > *"),
      `help lines, ${what}: a line for a mark not drawn`, ["helpProdEnd", "helpProdAhead", "helpRange", "helpShareAhead", "helpShareAheadFc", "helpDaysSky"].filter((k) => shown(p, k)), rings);
  }
  // Check: with a tariff, the prices card buys at the band now and has a box per band, the band now outlined
  // with the buying price, each with its hours today (or none, or all day); without one, no boxes and no help line.
  for (const [type, n] of [["three", 3], ["two", 2], ["single", 0]]) {
    const p = await draw(fakeHass(SCENARIOS.sunny), en, { tariff: { type, prices: { f1: 0.233, f2: 0.252, f3: 0.216 } } });
    const boxes = [...p.shadowRoot.querySelectorAll("#money .bands li")], cur = boxes.filter((li) => li.hasAttribute("aria-current"));
    const buy = $(p, "#money .price:not(.out) b")?.firstChild?.textContent.trim();
    // Each box's share of this month's grid energy; the rounded shares add up to about 100.
    const shares = boxes.map((li) => parseInt(li.querySelector(".band-pct")?.textContent));
    console.assert(boxes.length === n && (!n || (cur.length === 1 && cur[0].querySelector(".num").textContent === buy && boxes.every((li) => li.children.length >= 3)
      && shares.every(Number.isFinite) && Math.abs(shares.reduce((a, v) => a + v, 0) - 100) <= 2))
      && shown(p, "helpPricesBands") === !!n, `prices, tariff ${type}: boxes, band now or help line wrong`, boxes.map((li) => li.textContent), buy);
  }
  console.assert(!$(flat, "#money .bands") && !shown(flat, "helpPricesBands"), "prices without a tariff: band boxes drawn");
  const itPanel = await draw(fakeHass(SCENARIOS.sunny), { language: "it", locale: { language: "it" } }, { plant: { system_cost: 9000 } });
  const pages = ["now", "energy", "money"].map((id) => itPanel.shadowRoot.getElementById(id));
  const text = pages.map((el) => [el?.textContent ?? "", ...[...(el?.querySelectorAll("[aria-label],[title],[data-hint]") ?? [])].map((x) => [x.getAttribute("aria-label"), x.getAttribute("title"), x.dataset.hint].join(" "))].join(" ")).join(" ");
  console.assert(!/\d,\d/.test(text) && /\d\.\d/.test(text), "decimal point: a comma between digits in Italian", text.match(/.{0,16}\d,\d.{0,8}/g));
}

// Check: every scenario must give the expected advice in the real rendered panel.
// The forecast scenarios also check what the panel worked out: from the sensor when fresh, by the
// page when stale; ranges for tonight unless the battery size is unknown; nothing in the first days,
// where there is no usual day to build a forecast from.
for (const [k, s] of Object.entries(SCENARIOS)) {
  const p = await draw(fakeHass(s), {}, configOf(s));
  if (!s || s.offline) { console.assert($(p, ".empty"), `${k} must show a message, not zeros`); continue; }
  const kind = $(p, ".advice").dataset.kind;
  // By day "ok" turns "fills" while the battery still fills later today (see outlookAdvice), and how much
  // sun is left depends on the hour the checks run: "fills" passes for "ok" when the panel's outlook fills.
  const expect = !extras && { wait: "ok", soon: "go", later: "ok" }[s.expect] || (s.expect === "ok" && kind === "fills" && p._outlook?.fills ? "fills" : s.expect);
  console.assert(kind === expect, `advice for ${k}: got ${kind}, expected ${expect}`);
  // Level none: no advice from the solar forecast either ("wait", "soon" and "later" fall back).
  if (["wait", "soon", "later"].includes(s.expect)) {
    const none = $(await draw(fakeHass(s), {}, { ...configOf(s), predictions: { level: "none" } }), ".advice").dataset.kind, plain = { wait: "ok", soon: "go", later: "ok" }[s.expect];
    console.assert(none === plain, `advice for ${k} with level none: got ${none}, expected ${plain}`);
  }
  const range = (r) => Array.isArray(r) && r.length === 3 && r.every(Number.isFinite) && r[0] <= r[1] && r[1] <= r[2];
  if (s.ahead) console.assert(p._ahead?.from === (s.ahead === "stale" ? "page" : "sensor"), `forecast for ${k}: from ${p._ahead?.from}`, p._ahead);
  if (s.ahead && s.battKwh !== null) console.assert(["made", "used", "fromBatt", "fromGrid", "sent"].every((f) => range(p._outlook?.tonight?.[f])), `forecast for ${k}: tonight has no ranges`, p._outlook);
  if (s.battKwh === null) console.assert(p._outlook && p._outlook.tonight === null && p._outlook.best === null, `forecast for ${k}: figures with a battery of unknown size`, p._outlook);
  if (s.firstDays) console.assert(p._outlook === null && !/\d/.test($(p, ".batt-say p").textContent), `forecast for ${k}: an outlook, or a lasts until without one`, p._outlook);
}

// Check: a second inverter added 2 days ago (see ROOF2) counts as nothing before its first row, so the days
// and months before it keep the first inverter's numbers and there is a usual day; a row it misses after its
// first one still leaves that day unknown.
{
  const s = SCENARIOS.expanded, h = fakeHass(s), clock = clockOf(TZ), gap = q.get("gap") === "1";
  const p = await draw(h, en, configOf(s)), o = await draw(fakeHass(SCENARIOS.midday), en, configOf(SCENARIOS.midday));
  const first = clock(localMidnight(s.roof2)).key, y = localMidnight(1);
  const days = (x) => [...Object.values(x._stats.pastDays).flat(), ...x._stats.monthDays];
  const keyOf = (d) => new Date(d.date).toISOString().slice(0, 10), mine = days(p), theirs = Object.fromEntries(days(o).map((d) => [d.date, d.solarKwh]));
  const wrong = mine.filter((d) => !d.none && (keyOf(d) < first ? Math.abs(d.solarKwh - theirs[d.date]) > 0.01 : !(d.solarKwh >= theirs[d.date] - 0.01))).map(keyOf);
  console.assert(!wrong.length && mine.filter((d) => d.none || !Number.isFinite(d.solarKwh)).length === days(o).filter((d) => d.none || !Number.isFinite(d.solarKwh)).length,
    "second inverter: days before it lost or changed their numbers", wrong);
  const months = p._stats.months.filter(([k, d]) => !Number.isFinite(d.solarKwh) || (k < first.slice(0, 7) && d.solarKwh !== Object.fromEntries(o._stats.months)[k]?.solarKwh)).map(([k]) => k);
  console.assert(!months.length && (gap || Number.isFinite(p._stats.lastMonth.solarKwh)), "second inverter: months before it unknown or changed", months, p._stats.lastMonth.solarKwh);
  console.assert(p._stats.usual, "second inverter: no usual day from the hours before it");
  const miss = await draw(h, { ...en, callWS: async (m) => { const r = await h.callWS(m); if (m.period === "day" && r[ROOF2]) r[ROOF2] = r[ROOF2].filter((x) => x.start !== y); return r; } }, configOf(s));
  const yesterday = days(miss).find((d) => keyOf(d) === clock(y).key);
  console.assert(yesterday && !Number.isFinite(yesterday.solarKwh), "second inverter: a day it has no row for after its first one is not unknown", yesterday);
}

// Check: a new forecast is worked through as soon as the sensor writes, without asking the
// statistics again; the same forecast again changes nothing.
{
  let calls = 0;
  const h = fakeHass(SCENARIOS.sunny);
  const p = await draw(h, { callWS: (m) => { if (m.type === "recorder/statistics_during_period") calls++; return h.callWS(m); } });
  const asked = calls, first = p._ahead;
  p.hass = { ...p.hass, states: { ...p.hass.states } };
  console.assert(p._ahead === first, "forecast: worked through again with the same state");
  const next = fakeForecast({ ahead: "cloudy" });
  next.state = new Date(Date.parse(next.state) - 36e5).toISOString(); // an hour older, still fresh
  p.hass = { ...p.hass, states: { ...p.hass.states, "sensor.solar_view_forecast": next } };
  console.assert(p._ahead !== first && p._ahead?.hours[0].cloud === 80 && calls === asked, `forecast: new state not worked through, or the statistics asked again (${calls - asked})`, p._ahead);
}

// Check: the forecast counts house use as the energy balance. A load sensor 1.5 kWh a day under it
// (standby worked out as 62.5 W) gives the same savings and home made share by tonight as no load
// sensor with standby_w 62.5. One frozen clock for both panels.
{
  const LOAD = "sensor.load_energy", sign = { [ID.solarKwh]: 1, [ID.batteryKwh]: 1, [ID.gridImportKwh]: 1, [ID.chargeKwh]: -1, [ID.gridExportKwh]: -1 };
  const h = fakeHass(SCENARIOS.sunny);
  // The load rows: the energy balance of each row, 1.5 kWh less on the finished days, 0.3 less today so far.
  const callWS = async (m) => {
    if (m.type !== "recorder/statistics_during_period") return h.callWS(m);
    const res = await h.callWS({ ...m, statistic_ids: m.statistic_ids.filter((id) => id !== LOAD) });
    res[LOAD] = (res[ID.solarKwh] || []).map((r, i) => ({ start: r.start,
      change: Object.entries(sign).reduce((s, [id, k]) => s + k * (res[id]?.[i]?.change || 0), 0) - (m.period === "day" ? 1.5 : 0.3) }));
    return res;
  };
  const now = Date.now, frozen = now();
  Date.now = () => frozen;
  const withLoad = await draw(h, { callWS }, { entities: { load_energy: LOAD } });
  const withStandby = await draw(h, {}, { standby_w: 62.5 });
  Date.now = now;
  const pick = (p) => JSON.stringify([p._stats?.standbyW, p._outlook?.tonight?.saved, p._outlook?.tonight?.homeMade].map((v) => JSON.stringify(v, (k, x) => (typeof x === "number" ? Math.round(x * 1e6) / 1e6 : x))));
  console.assert(withLoad._outlook?.tonight && pick(withLoad) === pick(withStandby), "forecast: a load sensor changes the savings or the home made share", pick(withLoad), pick(withStandby));
}

// Check: every language has every text, every advice pool has lines (the go lines as many as in en), and no
// string can break out of an attribute (they go into data-hint and aria-label unescaped).
for (const [code, other] of Object.entries(TEXTS)) for (const [key, en] of Object.entries(TEXTS.en)) {
  console.assert(other[key] !== undefined, `strings: ${key} missing in ${code}`);
  // Only the go lines are matched across languages (each names the appliance of its icon, see GO_ORDER).
  if (Array.isArray(en)) console.assert(Array.isArray(other[key]) && other[key].length > 1 && (key !== "adviceGo" || other[key].length === en.length), `advice lines: ${key} too short in ${code}, or the go lines differ from en`);
}
for (const text of Object.values(TEXTS).flatMap((t) => Object.values(t)).flatMap((v) => (typeof v === "string" ? v : Object.values(v))))
  console.assert(text && !/["<>&\u2014]/.test(text), `string not safe in an attribute: ${text}`);

// Check: the day simulation against the shared cases (the integration's Python test runs the same file).
{
  const { simulate } = await import("../dist/forecast.js");
  const cases = await (await fetch("./simulate-cases.json")).json();
  for (const c of cases) {
    const got = simulate(c.hours, c.soc, c.battery, c.exportMaxKw, c.firstShare)
      .map((s) => Object.fromEntries(Object.entries(s).map(([k, v]) => [k, r3(v)])));
    console.assert(JSON.stringify(got) === JSON.stringify(c.expect), `simulate: ${c.name}`, got, c.expect);
  }
  const { efficiencyOf } = await import("../dist/forecast.js");
  console.assert(efficiencyOf(9, 10, 6) === 0.95 && efficiencyOf(9, 10, 7) === 0.9 && efficiencyOf(5, 10, 30) === 0.85 && efficiencyOf(11, 10, 30) === 1, "efficiency: wrong default or clamp");
}

// Check: the forecast shape, from the sensor or built by the page, at fixed times in Rome
// (2026-10-25 is the 25 hour day: clocks go back at 03:00).
{
  const { forecastOf, scenarioHours, findForecast } = await import("../dist/forecast.js");
  const clock = clockOf("Europe/Rome");
  const at = Date.parse;
  // A sensor with every hour from midnight of `first` to the end of `last`: sun 1 kWh mid from 10 to 15.
  const sensorOf = (written, first, last, left, days) => {
    const hours = [];
    for (let t = at(`${first}T00:00:00+02:00`); clock(t).key <= last; t += 36e5) {
      const m = clock(t).hour >= 10 && clock(t).hour <= 15 ? 1 : 0;
      hours.push({ t: new Date(t).toISOString(), sun: [m / 2, m, m * 1.5], use: [0.3, 0.4, 0.6], cloud: 40, rain: 0, buy: 0.3, sell: null });
    }
    return { state: new Date(at(written)).toISOString(), attributes: { hours, left, days } };
  };
  // Sum of one field over a day's rows from now, the present hour by its part still ahead.
  const total = (rows, key, field, now) => rows.filter((r) => clock(r.t).key === key)
    .reduce((s, r) => s + r[field] * Math.min(1, (r.t + 36e5 - now) / 36e5), 0);
  const usual = { loadW: Array(24).fill(400), solarW: Array.from({ length: 24 }, (_, h) => (h >= 10 && h <= 15 ? 800 : 0)) };
  const price = { buy: 0.3, sell: 0.1 };
  const days = [{ d: "2026-10-24", sun: [3, 6, 9], use: [8, 9.6, 12] }, { d: "2026-10-25", sun: [4, 6, 8], use: [8, 9, 11] }];

  // Fresh, written at 10:40 (the 10:00 hour; under 3 h old), read at 13:30: hours from 13:00 copied,
  // left rebased (2.5 of the 6 sun hours left).
  const now = at("2026-10-24T13:30:00+02:00");
  const fresh = sensorOf("2026-10-24T10:40:00+02:00", "2026-10-24", "2026-10-25", { sun: [3, 6, 9], use: [4, 4.6, 5.5] }, days);
  const a = forecastOf({ sensor: fresh, now, clock, solarWh: {}, usual, price });
  console.assert(a?.from === "sensor" && a.cloud === true, "forecast: fresh sensor not used", a);
  // The sensor's 36 hours to the end of tomorrow, then the usual day's to the month's end (it predicts house use).

    // Machine advice: a washer of 1 kWh over 2 hours, peak 2 kW, quiet hours 0 to 7, the battery kept 10

    const W = { type: "washer", kwh: 1, hours: 2, peakKw: 2 };
    const bandsAt = (t) => { const c = clock(t), band = bandOf(c.key, c.hour, "three"); return { band, buy: { f1: 0.3, f2: 0.4, f3: 0.2 }[band] }; };
    const plan = (now, sun, o = {}) => lookAhead({ ...aheadOf(now, sun, () => 0.3, o.spread ?? 0, () => 0.3, o.sell ?? (() => 0.1)), tomorrowSun: !o.guess, machineW: o.machineW ?? null }, now, clock, { soc: o.soc ?? 50, loadW: o.loadW ?? 300, solarW: sun(clock(now).hour, clock(now).key) * 1000 },
      o.b === undefined ? battery : o.b, { ...settings, exportMaxKw: o.exportMaxKw ?? null, machines: o.machines ?? [W], quiet: o.quiet ?? [0, 7], marginPct: o.margin ?? 10, gridMaxKw: o.gridMaxKw ?? null, bandAt: o.bands ? bandsAt : undefined }, soFar).best;

    const is = (b, kind, why, t) => b?.kind === kind && b.why === why && (t === undefined || b.t === at(t));
    const sat = (h) => `2026-10-24T${h}:00+02:00`, sun25 = (h) => `2026-10-25T${h}:00+01:00`;
    // Noon, sun to fill the battery and carry the night: now, on sun.

    console.assert(is(one(at(sat("10:30")), day), "now", "sunNow", sat("10:30")), "advice: not now inside the present hour", one(at(sat("10:30")), day));
    // 20:00 at 90 %: 6 kWh above the raised floor carry 4.2 of night and the load: now, on the battery.
    // At 40 % the night already runs short: tomorrow at 10:00, when the sun takes it.
    console.assert(is(one(at(sat("20:00")), day, { soc: 90 }), "now", "battNow"), "advice: not now on the battery", one(at(sat("20:00")), day, { soc: 90 }));

    // Tomorrow must save 0.3 kWh at the mean price (0.09): Saturday 17:00, no battery, no sun today, 0.3 spare

    console.assert(is(one(at(sat("17:00")), thin25, { b: null }), "at", "grid", sun25("10:00")) && is(one(at(sat("17:00")), thin25, { b: null, sell: () => 0.2 }), "now", "bestNow"),

    console.assert(is(sunday(false), "at", "sunTomorrow", sun25("10:00")) && is(sunday(true), "at", "cheaper", sun25("07:00")) && sunday(true).band === "f3",

    // The night after tomorrow: 21:00, a full 20 kWh battery, 0.05 spare an hour from 10. The washer now

    // 25 hour day from 01:00, the battery at its floor: 10:00 by the clock.

    // Bands: Wednesday 4 November 2026, Saturday 24 October, holidays (8 December, Easter Monday 2026 and 2027).
    const bands = [["2026-11-04", 10, "three", "f1"], ["2026-11-04", 7, "three", "f2"], ["2026-11-04", 19, "three", "f2"], ["2026-11-04", 23, "three", "f3"], ["2026-11-04", 6, "three", "f3"],
      ["2026-10-24", 10, "three", "f2"], ["2026-10-25", 10, "three", "f3"], ["2026-12-08", 10, "three", "f3"], ["2026-04-06", 10, "three", "f3"], ["2027-03-29", 10, "three", "f3"],
      ["2027-03-30", 10, "three", "f1"], ["2026-11-04", 20, "two", "f23"], ["2026-11-04", 10, "two", "f1"], ["2026-11-04", 3, "single", "f1"]];
    for (const [key, hour, type, want] of bands) console.assert(bandOf(key, hour, type) === want, `bands: ${key} ${hour}:00 ${type} not ${want}`, bandOf(key, hour, type));
    const rows = [{ start: at(sat("12:00")), mean: 0.4 }, { start: at(sun25("12:00")), mean: 0.2 }, { start: at(sun25("13:00")), mean: 0.3 }];
    console.assert(same(bandPrices("three", { f1: 0.3 }, rows, clock), { f1: 0.3, f2: 0.4, f3: 0.25 }) && same(bandPrices("two", { f1: 0.3, f2: 0.25 }, [], clock), { f1: 0.3, f23: 0.25 })
      && bandPrices("three", { f1: 0.3, f2: 0.4 }, [], clock) === null && r3(bandPrices("single", {}, rows, clock)?.f1) === 0.3 && bandPrices("tree", { f1: 0.3 }, [], clock) === null,

    // Machines from their sensor: 4 runs of 0.6 + 0.4 kWh hour rows; 4 runs of 18 rows of 0.06 kWh in 5
    // minute rows, with a 10 minute pause in the middle (100 minutes, 0.72 kW at peak). 2 runs: the typed figures.
    const typed = { type: "dryer", kwh: 1.5, hours: 3, peakKw: null }, M = 3e5;
    const hourRows = (n) => Array.from({ length: n }, (_, i) => [{ start: i * 864e5, change: 0.6 }, { start: i * 864e5 + H, change: 0.4 }]).flat();

    console.assert(same(machineOf(typed, hourRows(2), fiveRows(2)), { type: "dryer", kwh: 1.5, hours: 3, peakKw: 2 }), "machines: too few runs, not the typed figures", machineOf(typed, hourRows(2), fiveRows(2)));
    console.assert(machineOf({ type: "dryer", kwh: null, hours: null, peakKw: null }, [], []) === null, "machines: a machine without a load");

    // paid (the house with no system, standby left out) 3 + 12 x 0.4 x 0.3: in the dark hours the grid
    // also covers the standby, so paid is under saved plus cost.
    const noon = at("2026-10-24T12:00:00+02:00");
    const money = (buy, so = {}) => lookAhead(aheadOf(noon, (h) => (h >= 12 && h <= 15 ? 2 : 0), () => 0.5, 0, buy), noon, clock, { soc: null, loadW: 500, solarW: 2000 }, null,
      { exportMaxKw: null, standbyKwhPerHour: 0.1 }, { solarKwh: 0, loadKwh: 6, batteryKwh: 0, gridImportKwh: 3, gridExportKwh: 0, saved: 1, cost: 2, earned: 0, paid: 3, ...so }).tonight;
    const m = money(() => 0.3), x3 = (v) => [v, v, v];
    console.assert(same(Object.fromEntries(Object.entries(m).map(([k, v]) => [k, v && v.map(r3)])),
      { made: x3(8), used: x3(12), fromBatt: null, fromGrid: x3(7), sent: x3(6), saved: x3(1.48), cost: x3(3.2), earned: x3(0.6), paid: x3(4.44), fromSun: x3(5), homeMade: x3(0.271) }), "money: wrong", m);

    console.assert(noBuy.saved === null && noBuy.cost === null && noBuy.paid === null && same(noBuy.made.map(r3), x3(8)), "money: an hour without buy still priced", noBuy);

// Check: money so far, hour by hour, at each hour's price; standby left out of the savings, never below 0.
{
  const { moneySoFar } = await import("../dist/forecast.js");
  const H = 36e5;
  const hours = { [H]: { loadKwh: 1, gridImportKwh: 0.2, gridExportKwh: 0 }, [2 * H]: { loadKwh: 0.5, gridImportKwh: 0, gridExportKwh: 1 },

  // paid (what the house would pay with no system, standby left out) (1 - 0.1) x 0.3 + (0.5 - 0.1) x 0.2 + 0:

  console.assert(r3(m.saved) === 0.29 && r3(m.cost) === 0.07 && r3(m.earned) === 0.1 && r3(m.paid) === 0.35, "money so far: wrong", m);
  const unknown = moneySoFar(hours, (t) => (t === 2 * H ? null : 0.3), () => null, 0.1, 4 * H);
  console.assert(unknown.saved === null && unknown.cost === null && unknown.earned === null && unknown.paid === null, "money so far: an hour without a price still priced", unknown);
  // Half the present hour gone: half its standby. (0.5 - 0.1) x 1.
  const part = moneySoFar({ [H]: { loadKwh: 0.5, gridImportKwh: 0, gridExportKwh: 0 } }, () => 1, () => 1, 0.2, 1.5 * H);
  console.assert(r3(part.saved) === 0.4 && r3(part.paid) === 0.4, "money so far: standby of the present hour not by the part passed", part);
}

// Check: the Energy page's today card and the Money page's today card. With a forecast (the sensor's, or the
// page's own from the usual day): no columns but the share ring, and beside it two small rings, in an hour
// and at the end of the day (the end alone in the last hour), each named, using at least as much as the one

{
  const t = STRINGS.en, H = 36e5, clock = clockOf(TZ);

  // Every ring draws its parts in the mark colours, each part once. Not the same parts on each: before the
  // sun is up the ring so far has no sun, the end of the day's has.

    return k.length > 0 && k.every((x) => ["sun", "batt", "grid"].includes(x)) && new Set(k).size === k.length; };

  const rings = (p) => {
    const s = small(p), lastHour = Date.now() + H >= p._outlook?.hoursAhead?.at(-1)?.[0] + H;
    return s.length === (lastHour ? 1 : 2) && clean(p) && s.at(-1).getAttribute("aria-label").startsWith(t.hShareEnd.split("{p}")[0])
      && s.every((x, i) => !i || usedBy(x) >= usedBy(s[i - 1])) && [$(p, "#energy .today .rings > div > .ring-box svg"), ...s].every(marked)
      && has(p, ".best") === !!p._outlook?.best && has(p, "#energy .today .best") === (!!p._outlook?.best && !has(p, "#now section.battery"));
  };
  // The mock's sun runs from 10:00 to 15:00, today and tomorrow.
  const days = [0, -1].map((i) => clock(localMidnight(i) + 12 * H).key);
  const sunny = (t) => days.includes(clock(t).key) && clock(t).hour >= 10 && clock(t).hour <= 15;

  let p = await draw(fakeHass(SCENARIOS.sunny), en);
  const best = p._outlook?.best;
  // Money starts with the month: no ring of today's money or share.
  console.assert(!has(p, ".savings") && !has(p, "#money .share"), "money: a today card still drawn");
  // The default washer: one line on the battery card, a start today or tomorrow on a whole hour outside the quiet hours.

  console.assert(best?.length === 1 && fair(best[0]) && p.shadowRoot.querySelectorAll("#now section.battery .best").length === 1 && $(p, ".best").textContent.includes(t.washer) && !has(p, "#energy .best"),

  console.assert(rings(p), "today sunny: not the share ring with its small rings for in an hour and the end of the day", named(p));
  const stale = await draw(fakeHass(SCENARIOS.stale), en);
  console.assert(rings(stale), "today stale: not the share ring with its small rings for in an hour and the end of the day", named(stale));

  // No battery: no battery part on any ring; what was sent in its own colour, apart from the grid's (nothing is

  console.assert(rings(p) && !colours($(p, "#energy .today .ring-box svg")).includes("--batt") && (!(p._stats.today.gridExportKwh > 0) || readout(p).includes("var(--sent")) && readout(p).includes("var(--grid"),

  // usual day (14 days of hour rows, 0.5 kWh of sun an hour) still the ring alone: Power origin is always rings.
  p = await draw(fakeHass(SCENARIOS.battUnknown), en);
  console.assert(has(p, "#energy .today.share svg.ring") && !has(p, ".rings-ahead") && !has(p, ".best") && !has(p, ".by") && !has(p, ".savings") && clean(p), "today, battery of unknown size: forecast figures drawn");
  p = await draw(fakeHass({ ...SCENARIOS.battUnknown, hourly: { solarKwh: 0.5 } }), en);
  console.assert(p._stats.usualToday && has(p, "#energy .today.share svg.ring") && !has(p, ".rings-ahead"), "today with a usual day and no forecast: not the ring alone", named(p));

  // No buying price anywhere (Energy settings or sensor): no price now, the small rings stay.
  const h = fakeHass(SCENARIOS.sunny), prefs = fakePrefs(SCENARIOS.sunny);
  h.states["sensor.solar_view_forecast"].attributes.hours.forEach((x) => { x.buy = x.sell = null; });
  prefs.energy_sources.forEach((s) => { delete s.number_energy_price; delete s.number_energy_price_export; });
  p = await draw(h, { ...en, callWS: async (m) => (m.type === "energy/get_prefs" ? prefs : h.callWS(m)) });
  console.assert(!has(p, ".price") && rings(p), "today without prices: a price drawn, or small rings lost");

  // First days and no forecast: no prediction at all, so the share ring alone; no sentence, no best time.

  }

  // Export off, battery full: nothing sent, and spare sun is lost, not made. What is made from now on stays
  // within what the house uses, what the battery gives back (and so can take again, before its losses) and what is sent.
  p = await draw(fakeHass(SCENARIOS.exportOffFull), en, configOf(SCENARIOS.exportOffFull));
  const o = p._outlook?.tonight, d = p._stats?.today;
  const used = d && d.solarKwh + d.batteryKwh + d.gridImportKwh - d.chargeKwh - d.gridExportKwh;
  console.assert(o && o.made[1] - d.solarKwh <= o.used[1] - used + (o.fromBatt[1] - d.batteryKwh) / p._stats.efficiency + (o.sent[1] - d.gridExportKwh) + 1e-6
    && o.sent[1] - d.gridExportKwh === 0 && rings(p) && !readout(p).includes("var(--sent"), "today export off and full: lost sun counted as made, or something sent", o, d);
}

// Check: the Now page. In order: header, flow, advice, battery. The battery ring: the percentage alone in
// its middle, the battery size in the gap when known. The battery in an hour, at fixed times today (the
// mock's sun runs from 10:00 to 15:00): rising at 11:00 (a faded --batt piece past the solid end, the
// outer arc around it), falling at 21:00 (a faded --low piece), never falling at the floor, no outer arc
// from the page's own forecast; the hint says it. The advice from the outlook: short, okLasts, fills. The
// "?" opens a modal dialog and gives focus back. The tabs have icons. The icon over the flow follows the
// present hour, the moon its phase.
{
  const t = STRINGS.en, real = Date.now;
  // A panel drawn with the clock at hour h today (null: the real clock); the clock stays there while it
  // loads. `s` is a scenario's name, a scenario, or a function that makes the fake hass (at that hour).
  const at = async (s, h) => {
    const when = h === null ? null : new Date(Date.now()).setHours(h, 0, 0, 0);
    if (when) Date.now = () => when;
    try {
      const hass = typeof s === "function" ? s() : fakeHass(typeof s === "string" ? SCENARIOS[s] : s);
      return await draw(hass, en, configOf(typeof s === "string" ? SCENARIOS[s] : s));
    } finally { Date.now = real; }
  };
  const now = (p) => p.shadowRoot.getElementById("now");
  const ring = (p) => $(p, ".battery svg.ring"), soon = (p) => $(p, ".battery .ring .soon"), arc = (p) => $(p, ".battery .ring .range");
  const colour = (el) => el?.getAttribute("style").match(/var\(--(\w+)-mark/)?.[1];
  const withSoc = (s, soc) => () => { const h = fakeHass(s); h.states[ID.soc] = { state: String(soc), attributes: {} }; return h; };
  const night = { ...SCENARIOS.evening, ahead: "sunny" };
  try {
    let p = await at("sunny", null);
    console.assert([...now(p).children].map((el) => el.localName === "section" ? el.classList[1] : el.localName).join(" ") === "header div advice battery coming", "now: not header, flow, advice, battery, coming days", [...now(p).children].map((el) => el.className));
    console.assert(!$(p, ".battery .ring-mid .num") && $(p, ".battery .ring .size")?.textContent === "10 kWh", "now: the kWh line still under the percentage, or no size in the gap");
    console.assert(!$(await at("battUnknown", null), ".battery .ring .size"), "now: a size for a battery of unknown size");
    // The tab bar: an icon above each label, hidden from screen readers.
    console.assert([...p.shadowRoot.querySelectorAll(".tabs button")].every((b) => b.querySelector("svg[aria-hidden=true]") && b.textContent.trim() === b.lastChild.textContent && b.lastChild.textContent), "tabs: a tab without its icon or label");

    // Rising at 11:00: the piece past the solid end, in --batt, the outer arc around its end; the hint says both.
    p = await at("sunny", 11);
    const up = p._outlook?.inHour, s70 = 70;
    console.assert(up && up[1] - s70 >= 1 && colour(soon(p)) === "batt" && colour(arc(p)) === "batt", "in an hour, sunny at 11: no rising piece in --batt with its arc", up, soon(p)?.outerHTML);
    console.assert(+ring(p).querySelector(".val").getAttribute("stroke-dasharray").split(" ")[0] === s70, "in an hour, rising: the solid arc does not end at now");
    console.assert(ring(p).getAttribute("aria-label") === say(t.hRingSoon, { p: s70, a: Math.round(up[1]), b: Math.round(up[0]), c: Math.round(up[2]) }), "in an hour, rising: hint wrong", ring(p).getAttribute("aria-label"));
    // Falling at 21:00: the solid arc ends at the battery in an hour, the piece up to now in --low.
    p = await at(night, 21);
    const down = p._outlook?.inHour;
    console.assert(down && 60 - down[1] >= 1 && colour(soon(p)) === "low" && Math.abs(+ring(p).querySelector(".val").getAttribute("stroke-dasharray").split(" ")[0] - down[1]) < 0.1, "in an hour, evening at 21: no falling piece in --low ending at the battery in an hour", down);
    console.assert(!arc(p) || colour(arc(p)) === "low", "in an hour, falling: the outer arc not in --low");
    console.assert(down[0] >= 20 && down[0] <= down[1] && down[1] <= down[2] && down[2] <= 100, "in an hour: range outside the floor to 100, or not around its mid", down);
    // At the floor it cannot fall: nothing drawn. The page's own forecast (stale): a piece, never an outer arc.
    p = await at(withSoc(night, 20), 21);
    console.assert(!soon(p) && ring(p).getAttribute("aria-label") === say(t.hRing, { p: 20, k: "2 kWh" }), "in an hour: a fall drawn at the floor", soon(p)?.outerHTML);
    p = await at("stale", 11);
    console.assert(p._ahead?.from === "page" && !arc(p) && !ring(p).getAttribute("aria-label").includes(" likely "), "in an hour: a range from the page's own forecast");
    // Under 1 point of change, nothing: no sun and no use for the next hours nor drawn now (the present
    // draw counts for the present hour), a full battery.
    p = await at(() => {
      const h = fakeHass(SCENARIOS.exportOffFull);
      h.states["sensor.solar_view_forecast"].attributes.hours.forEach((x) => { x.use = [0, 0, 0]; });
      for (const id of [ID.solarW, ID.battW, ID.gridW]) h.states[id].state = "0";
      return h;
    }, 21);
    console.assert(!soon(p) && !arc(p), "in an hour: drawn under 1 point of change");

    // Advice from the outlook: at 21:00 the battery runs out before the sun takes over (short), or lasts (okLasts);
    // at 11:00 with no spare sun now it fills later and sends the rest (fills).
    const adv = (p) => [$(p, ".advice").dataset.kind, $(p, ".advice p").textContent, $(p, ".batt-say p").textContent];
    let [kind, line, says] = adv(await at(night, 21));
    console.assert(kind === "short" && t.adviceShort.includes(line) && /\d/.test(says), "advice: evening, battery out before the sun, not short", kind, line, says);
    [kind, line, says] = adv(await at(withSoc(night, 100), 21));
    console.assert(kind === "okLasts" && t.adviceOkLasts.includes(line) && says === t.untilSun, "advice: evening, battery lasts, not okLasts", kind, line, says);
    [kind, line] = adv(await at({ ...SCENARIOS.cloudy, ahead: "sunny" }, 11));
    console.assert(kind === "fills" && t.adviceFills.includes(line), "advice: by day, the battery fills, not fills", kind, line);
    [kind] = adv(await at({ ...SCENARIOS.evening, forecast: null }, 21));
    console.assert(kind === "ok", "advice: short or okLasts without a forecast", kind);

    // Mode Weather (no house use from the sensor): the sky and its icon from the sensor, no outlook, so no
    // battery in an hour, no rings ahead on Energy, "lasts until" from the present draw.
    p = await at({ ...SCENARIOS.cloudy, noUse: true }, 11);
    console.assert(p._ahead?.from === "sensor" && p._outlook === null && $(p, ".flow .sky-icon")?.dataset.icon === "sun cloud"
      && p.style.getPropertyValue("--sv-sky1") === skyAt(SCENARIOS.cloudy.v[4], false, dark, greyOf(80)).colors[0]
      && !soon(p) && !p.shadowRoot.querySelector("#energy .rings-ahead"), "mode Weather: the sensor's sky lost, or forecast figures without house use", p._ahead?.from, p._outlook);
    // Nor the usual day beside it (the coming days' use line, payback's time left), nor the month's money end.
    const money = p.shadowRoot.querySelector("#money")?.textContent ?? "";
    console.assert(!$(p, ".coming .use") && !money.includes("by the end of the month") && !/About .* left/.test(money),
      "mode Weather: a usual day line, payback time left or month end beside weather alone");

    // The "?": a labelled button that opens a modal dialog; closing it the way Escape does gives focus back to it.
    p = await at("sunny", null);
    attach(p);
    const help = $(p, ".battery button.help"), read = $(p, "dialog.read");
    console.assert(help?.getAttribute("aria-label")?.startsWith(`${t.helpTitle}: `) && help.querySelector("svg[aria-hidden=true]"), "help: not a labelled button", help?.outerHTML);
    help?.focus(); help?.click();
    console.assert(read?.open && read.matches(":modal") && read.querySelector("h2").textContent === t.helpTitle && read.querySelectorAll("li span").length === 5
      && [...read.querySelectorAll("[data-t]")].every((el) => el.textContent.trim()), "help: no modal dialog with its title and lines");
    if (read?.requestClose) read.requestClose();
    else if (read?.dispatchEvent(new Event("cancel", { cancelable: true }))) read.close();
    await tick();
    console.assert(read && !read.open && p.shadowRoot.activeElement === $(p, ".battery button.help"), "help: closing does not give focus back to the button", p.shadowRoot.activeElement);
    p.remove();

    // The icon over the flow: by day the sun, behind a cloud from 50 %, a cloud from 90 %, rain over 0.2 mm;
    // by night the moon in its phase, the same way. Without the sensor the sun, or rain from a weather entity.
    const icon = async (s, h = null) => $(await at(s, h), ".flow .sky-icon")?.dataset.icon;
    const phase = moonPhase(Date.now());
    const overcast = () => {
      const h = fakeHass({ ...SCENARIOS.sunny, ahead: "cloudy" });
      h.states["sensor.solar_view_forecast"].attributes.hours.forEach((x) => { x.cloud = 95; });
      return h;
    };
    const got = [await icon("sunny"), await icon("cloudy"), await icon(overcast), await icon("rain"), await icon(night), await icon({ ...night, ahead: "cloudy" }), await icon("stale"), await icon({ ...SCENARIOS.stale, weather: "rainy" }), await icon({ ...SCENARIOS.rain, weather: "snowy" })];
    console.assert(JSON.stringify(got) === JSON.stringify(["sun", "sun cloud", "cloud", "rain", `moon ${phase}`, `moon ${phase} cloud`, "sun", "rain", "snow"]), "sky icon: wrong for the present hour", got);
    // Known phases (UTC): new moon 2024-04-08 18:21, first quarter 2024-04-15 19:13, full moon 2024-04-23 23:49, last quarter 2024-05-01 11:27.
    const phases = ["2024-04-08T18:21Z", "2024-04-15T19:13Z", "2024-04-23T23:49Z", "2024-05-01T11:27Z", "2024-04-11T12:00Z", "2024-04-19T12:00Z"].map((d) => moonPhase(Date.parse(d)));
    console.assert(JSON.stringify(phases) === "[0,2,4,6,1,3]", "moon phase: wrong", phases);
  } catch (e) {
    console.assert(false, "now: threw", e);
  } finally {
    Date.now = real;
  }
}

// Check: Production with the page's own forecast (level usual): this month's days to come dashed on from today, a
// faded dot each, every one pickable with its sentence (from the solar forecast while it has the day, else a
// usual day); this month's bar has a faded block behind it, and its total says where the month should end: so
// far, plus the rest of today, plus every day to come. Nothing of it with level none, nor beside a fresh sensor.
{
  const card = (p) => p.shadowRoot.querySelector("#energy .daily");
  try {
    const p = await draw(fakeHass(SCENARIOS.stale), en, { predictions: { level: "usual" } }), c = card(p), s = p._stats, a = p._ahead;
    const coming = [...c.querySelectorAll(".week li.ahead")], d = new Date(Date.now()), today = s.monthDays.length;
    const left = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate() - today;
    const keys = coming.map((li) => new Date(s.monthDays[0].date + (+li.dataset.i) * 864e5).toISOString().slice(0, 10));
    const kwh = keys.map((k) => a.days.find((x) => x.d === k)?.sun[1] ?? s.sunDays[k] ?? s.usualSunDays[k] ?? s.usualSun);
    const end = s.monthDays.reduce((t, x) => t + x.solarKwh, 0) + a.left.sun[1] + kwh.reduce((t, v) => t + v, 0);
    const shown = parseFloat(c.querySelector(".month-total .est dd")?.textContent.replace(/[^\d.]/g, ""));
    const bar = c.querySelector(".year [aria-pressed=true]"), ghost = bar?.querySelector("i.ghost"), solid = bar?.querySelector("i:not(.ghost)");
    console.assert(a?.from === "page" && coming.length === left && coming.every((li, i) => +li.dataset.i === today + i && li.dataset.hint === li.getAttribute("aria-label")
        && li.getAttribute("aria-label").endsWith(keys[i] in s.sunDays ? "from the solar forecast" : "as on a usual day"))
      && (!left || c.querySelector(".series.later")?.getAttribute("d").startsWith("M"))
      // ?gap=1 leaves a day of this month without numbers: no month end then.
      && (s.monthDays.some((x) => x.none) ? !ghost && !c.querySelector(".month-total .est")
        : Math.abs(shown - end) <= 0.5 + end * 0.01 && c.querySelectorAll(".year i.ghost").length === 1
          && parseFloat(ghost.style.getPropertyValue("--v")) >= parseFloat(solid.style.getPropertyValue("--v")) && bar.getAttribute("aria-label").endsWith("by the end (estimate)")),
      "production, level usual: the days to come or the month end wrong", coming.length, left, shown, end);
    if (left) {
      coming.at(-1).click();
      const said = c.querySelector(".picked .day:not([hidden])");
      console.assert(said?.dataset.i === coming.at(-1).dataset.i && said.textContent === coming.at(-1).dataset.hint && said.querySelector("b")
        && c.querySelector(".step-next[data-step]")?.getAttribute("aria-disabled") === "true" && c.querySelector(".step-prev[data-step]")?.getAttribute("aria-disabled") !== "true",
        "production, level usual: the last day to come not picked with its sentence", said?.outerHTML);
    }
    const none = await draw(fakeHass(SCENARIOS.stale), en, { predictions: { level: "none" } });
    console.assert(!card(none).querySelector(".week li.ahead, .year i.ghost, .series.later, .month-total .est"), "production, level none: predicts");
    // Weather alone: the sensor's days dashed on as far as they reach (15 in the mock), the month end only once
    // they reach it; on Today by hour the sun dashed on to midnight, but no use or grid ahead.
    const wx = await draw(fakeHass({ ...SCENARIOS.cloudy, noUse: true }), en), wc = card(wx), c0 = clockOf(TZ)(Date.now());
    const reach = wx._ahead.days.filter((x) => x.d > c0.key && x.d.startsWith(s.monthKey)).length;
    const later = [...wx.shadowRoot.querySelectorAll("#energy .battday .series.later")].map((x) => x.getAttribute("d"));
    console.assert(wc.querySelectorAll(".week li.ahead").length === reach && !!wc.querySelector(".year i.ghost") === (reach === left)
      && (c0.hour >= 23 || later[0]?.includes("L") && !later[1].includes("L") && !later[2].includes("L")),
      "weather alone: the sensor's days to come, its month end, or the sun ahead on Today by hour wrong", reach, left, later);
    // Coming days beside the page's own forecast: the solar forecast's whole days after today (up to 7), no weather.
    const rows = [...p.shadowRoot.querySelectorAll("#now .coming .days li")], want = Math.min(7, Object.keys(s.sunDays).length);
    console.assert(want > 0 && rows.length === want && rows.every((li) => !li.querySelector(".wx")?.innerHTML),
      "coming days, level usual: not the solar forecast's days", rows.length, want);
    // The usual day's sun follows the season by the clear sky at Home Assistant's location: each day to come
    // its own (within half and twice the usual day's); without a longitude, the usual day's as it is.
    const days = Object.values(s.usualSunDays), flat = fakeHass(SCENARIOS.stale);
    flat.config = { ...flat.config, longitude: undefined };
    const noGeo = Object.values((await draw(flat, en, { predictions: { level: "usual" } }))._stats.usualSunDays);
    console.assert((!days.length || days.every((v) => v >= s.usualSun * 0.5 && v <= s.usualSun * 2) && new Set(days.map((v) => v.toFixed(3))).size > Math.min(1, days.length - 1))
      && noGeo.every((v) => Math.abs(v - s.usualSun) < 1e-6), "usual day: not moved by the season, or moved without a location", days, noGeo, s.usualSun);
    // Money ahead with the page's own forecast: every day left this month dashed on Daily returns, each with its
    // sentence, and Month balance's faded bar with where the month should end; none of it with weather alone.
    const money = (q) => q.shadowRoot.getElementById("money");
    const owed = [...money(p).querySelectorAll(".recent .week li.ahead")];
    console.assert(!extras || owed.length === left && owed.every((li) => /bring back about .+ from the grid/.test(li.dataset.hint ?? li.getAttribute("aria-label") ?? ""))
      && !!money(p).querySelector(".months i.ghost") && money(p).textContent.includes("by the end of the month"),
      "money, level usual: the days to come on Daily returns, or the month end on Month balance, missing", owed.length, left);
    console.assert(!money(wx).querySelector(".recent li.ahead, .months i.ghost"), "money, weather alone: money predicted without house use");
    // The sensor with house use (Learned): its days, then the usual day's, to the month's end on both cards.
    const learned = await draw(fakeHass({ ...SCENARIOS.sunny, hourly: usualHour(true) }), en);
    const daysOn = (sel) => learned.shadowRoot.querySelectorAll(sel).length;
    console.assert(daysOn("#energy .daily .week li.ahead") === left && (!extras || daysOn("#money .recent .week li.ahead") === left),
      "learned: the days to come stop at the sensor's last day", daysOn("#energy .daily .week li.ahead"), daysOn("#money .recent .week li.ahead"), left);
  } catch (e) {
    console.assert(false, "production, level usual: threw", e);
  }
}

// Check: the rest of the Energy page, in order today, hour by hour, the month's days; coming days on Now.
// Coming days: 7 rows from tomorrow, each with its day's icon, a bar from 0 to the likely sun inside its thin
// low-to-high line, on one track up to the highest high or the usual day's use line; none without the sensor. Days: one dot a day of this month numbered from 1, today last, faded and picked at
// first; another bar picked by a tap or by focus, kept across a redraw.
{
  const t = STRINGS.en, H = 36e5;
  const energy = (p) => p.shadowRoot.getElementById("energy");
  const has = (p, sel) => !!energy(p).querySelector(sel);
  const order = (p) => [...energy(p).querySelectorAll("section.card")].map((c) => c.classList[1]).join(" ");
  const v = (el, name) => (el ? parseFloat(el.style.getPropertyValue(name)) : null);

    console.assert(order(p) === "today battday daily" && p.shadowRoot.querySelector("#now section.battery + section.coming"), "energy: cards not today, hour by hour, days, or coming days not under the battery on Now", order(p));
    p = await draw(fakeHass(SCENARIOS.stale), en);
    console.assert($(p, ".coming") && !$(p, ".coming .wx path, .coming .wx circle"), "coming days without the sensor: not the solar forecast's, or with weather");

    // Coming days: 7 rows from tomorrow, each with the icon of its day's cloud and rain.
    p = await draw(fakeHass(SCENARIOS.sunny), en);
    const rows = [...p.shadowRoot.querySelectorAll(".coming .days li")];
    // Each row: [low, likely, high] in % of the track; the use line at --u on the list.
    const pills = rows.map((li) => [v(li.querySelector(".track b"), "--a"), v(li.querySelector(".track i"), "--v"), v(li.querySelector(".track b"), "--b")]);
    const u = v(p.shadowRoot.querySelector(".coming .days"), "--u");
    const tomorrow = new Date(localMidnight(-1) + 12 * H);
    console.assert(rows.length === 7 && rows[0].firstChild.textContent === new Intl.DateTimeFormat("en", { weekday: "short" }).format(tomorrow).replace(".", "")
      && rows.every((li) => li.querySelector(".wx circle") && !li.querySelector(".wx .cloud"))
      && pills.every(([a, m, b]) => a >= 0 && a <= m && m <= b && b <= 100) && Math.max(u, ...pills.map((x) => x[2])) === 100
      && (u > 0) === !!p.shadowRoot.querySelector(".coming .days.with-use li:first-child .now-label") && rows.every((li) => !!li.querySelector(".use") === u > 0)
      && rows.every((li) => /\d/.test(li.getAttribute("aria-label")) && li.getAttribute("aria-label").includes(" kWh of sun")), "coming days: rows, icons or pills wrong", rows.map((li) => li.outerHTML));
    const dayIcons = async (k) => [...(await draw(fakeHass(SCENARIOS[k]), en)).shadowRoot.querySelectorAll(".coming .days li")].map((li) => (li.querySelector(".wx .drop") ? "rain" : li.querySelector(".wx circle") ? (li.querySelector(".wx .cloud") ? "partly" : "sun") : li.querySelector(".wx .cloud") ? "cloud" : "-"));
    const cloudy = await dayIcons("cloudy"), rainy = await dayIcons("rain");
    console.assert(cloudy.length === 7 && cloudy.every((i) => i === "partly") && p.shadowRoot.querySelector(".coming .days li").getAttribute("aria-label").includes(t.wxSunny)
      && rainy.every((i) => i === "rain"), "coming days: icons not from the day's cloud and rain", cloudy, rainy);

    // Days: one dot a day of this month numbered from 1, today last, faded and picked at first; a tap picks
    // another, focus another, and a redraw keeps it.
    const days = (p) => [...energy(p).querySelectorAll(".daily .week li")], n = new Date(Date.now()).getDate();
    const picked = (p) => [days(p).findIndex((li) => li.getAttribute("aria-current") === "true"), days(p).filter((li) => li.hasAttribute("aria-current")).length,
      [...energy(p).querySelectorAll(".daily .picked .day:not([hidden])")].map((d) => d.dataset.i).join()];
    console.assert(days(p).length === new Date(new Date(Date.now()).getFullYear(), new Date(Date.now()).getMonth() + 1, 0).getDate() && days(p).slice(n).every((li) => li.classList.contains("future") && !li.dataset.hint || li.classList.contains("ahead")) && JSON.stringify(picked(p)) === JSON.stringify([n - 1, 1, String(n - 1)])
      && days(p)[n - 1].classList.contains("today") && days(p).filter((li) => li.classList.contains("today")).length === 1
      && days(p).map((li) => li.lastChild.textContent).join() === days(p).map((_, i) => i + 1).join()
      && energy(p).querySelector(".daily .picked .day:not([hidden]) .period")?.textContent === t.todaySoFar, "days: not a dot a day numbered from 1, or today not last, faded and picked", picked(p));
    if (n > 2) {
      days(p)[0].click();
      console.assert(JSON.stringify(picked(p)) === '[0,1,"0"]', "days: a tapped bar not picked", picked(p));
      days(p)[1].dispatchEvent(new FocusEvent("focusin", { bubbles: true, composed: true }));
      console.assert(JSON.stringify(picked(p)) === '[1,1,"1"]', "days: a focused bar not picked", picked(p));
      p._drawn = ""; p.hass = { ...p.hass };
      console.assert(JSON.stringify(picked(p)) === '[1,1,"1"]', "days: the picked day lost in a redraw", picked(p));
    }
    // Production: the latest 12 months January to December, this one pressed and "so far", its total under
    // them. A past month picked shows all its days, the last picked, none of them today; the days stay.
    const year = (p) => [...energy(p).querySelectorAll(".daily .year button")], k = p._stats.monthKey;
    console.assert(year(p).map((b) => b.dataset.month.slice(5)).join() === "01,02,03,04,05,06,07,08,09,10,11,12"
      && year(p).every((b) => b.dataset.month <= k && b.dataset.month > `${+k.slice(0, 4) - 1}-${k.slice(5)}`)
      && year(p).filter((b) => b.getAttribute("aria-pressed") === "true").map((b) => b.dataset.month).join() === k
      && year(p).find((b) => b.dataset.month === k).querySelector("small").textContent === t.soFar
      && year(p).filter((b) => b.dataset.month.slice(0, 4) !== k.slice(0, 4)).every((b) => b.querySelector("small .wide")?.textContent === b.dataset.month.slice(0, 4))
      && energy(p).querySelector(".daily .year + .stepped .month-total .period")?.textContent === say(t.monthSoFar, { m: formats("en", "EUR", "h12").monthYear(k) })
      && energy(p).querySelector(".daily .month-total dt")?.textContent === t.prodMonths, "production: not the latest 12 months, this one so far with its total", year(p).map((b) => b.dataset.month));
    const back = year(p).find((b) => b.dataset.month < k);
    back.click();
    const all = days(p), [y, m] = back.dataset.month.split("-").map(Number), length = new Date(Date.UTC(y, m, 0)).getUTCDate();
    console.assert(all.length === length && all.every((li) => !li.classList.contains("future") && !li.classList.contains("today")) && all[length - 1].getAttribute("aria-current") === "true"
      && energy(p).querySelector(".daily .year [aria-pressed=true]")?.dataset.month === back.dataset.month
      && energy(p).querySelector(".daily .chart-title .num")?.textContent === formats("en", "EUR", "h12").monthYear(back.dataset.month)
      && !/NaN|undefined/.test(energy(p).querySelector(".daily").innerHTML), "production: a past month picked, its days wrong", back.dataset.month, all.length);
    // One Tab stop per chart, on its pick: the arrows move along it.
    const stops = (sel) => [...energy(p).querySelectorAll(`.daily ${sel} [tabindex="0"]`)];
    console.assert(same(stops(".year").map((b) => b.dataset.month), [back.dataset.month]) && same(stops(".week").map((li) => li.dataset.i), [all[length - 1].dataset.i]),
      "production: not one Tab stop per chart, on the pick", stops(".year").length, stops(".week").length);
    p._pick = {}; p._drawn = ""; p.hass = { ...p.hass };
  } catch (e) { console.assert(false, "energy: threw", e); }
}

// Check: the 12 months' keys roll over with the year: January to December, each the latest up to this month.

    && keys("2026-12") === "2026-01,2026-02,2026-03,2026-04,2026-05,2026-06,2026-07,2026-08,2026-09,2026-10,2026-11,2026-12"
    && keys("2026-10").split(",")[10] === "2025-11", "months: not the latest of each, January to December", keys("2027-01"));
