// Check: the Money page's month balance and prices. The latest 12 months to pick, January to December, this
// one pressed; under them the picked month: what the grid cost, what was saved (and earned), the net, below 0
// in the low colour; for this month the month end from a fresh sensor, none from the statistics. From the
// sensor's months when fresh, else the statistics at the flat price, the bill's fixed part on the cost and the
// net. The prices now in their own card, selling only while export is on. Neither card without any price.
{
  const t = STRINGS.en, f = formats("en", "EUR", "h12"), money = f.money;
  const card = (p) => p.shadowRoot.querySelector("#money .months"), fig = (p, sel) => card(p)?.querySelector(sel)?.textContent;
  // A labelled figure under the bars (see readout), by its label.
  const said = (p, label) => [...card(p)?.querySelectorAll(".readout dl > div") ?? []].find((d) => d.querySelector("dt").textContent === label)?.querySelector("dd").textContent;
  const read = (p) => ({ cost: fig(p, ".side.cost b"), back: fig(p, ".side.back b"), net: said(p, t.netBenefit), end: fig(p, ".note") });
  const value = (v) => parseFloat(v.replace(/[^\d.-]/g, ""));
  const pickMonth = (p, key) => card(p).querySelector(`[data-month="${key}"]`).click();
  const prices = (p) => [...p.shadowRoot.querySelectorAll("#money .prices .price")].map((el) => `${el.querySelector("span").textContent}: ${el.querySelector("b").textContent}`).join("|");
  const before = (key) => { const d = new Date(`${key}-15T12:00:00Z`); d.setUTCMonth(d.getUTCMonth() - 1); return d.toISOString().slice(0, 7); };
  if (!extras) { const p = await draw(fakeHass(SCENARIOS.sunny), en); console.assert(!card(p) && !p.shadowRoot.querySelector("#money .prices"), "money month: drawn without any price"); }
  else {
    let p = await draw(fakeHass(SCENARIOS.sunny), en);
    const k = p._stats.monthKey, last = before(k), months = [...card(p).querySelectorAll(".year button")];
    console.assert(months.length === 12 && months.filter((b) => b.getAttribute("aria-pressed") === "true").map((b) => b.dataset.month).join() === k
      && fig(p, ".chart-title") === say(t.monthSoFar, { m: f.monthYear(k) }) && read(p).end === say(t.balEnd, { v: money(82.1 - 48.6) })
      && prices(p) === `${t.buyGrid}: ${money(0.3)} /kWh|${t.sellGrid}: ${money(0.1)} /kWh`, "money month sunny: months, month end or prices wrong", read(p), prices(p));
    // The sensor's last month as it is: no month end.
    pickMonth(p, last);
    console.assert(read(p).cost === money(14.6) && value(read(p).back) >= 98 && read(p).net === money(value(read(p).back) - 14.6) && !read(p).end
      && fig(p, ".chart-title") === f.monthYear(last), "money month sunny: last month wrong", read(p));
    // ?gap=1 leaves a day of this month without rows: its money is then unknown, so these need no gap.
    if (q.get("gap") !== "1") {
      // No sensor: from the statistics at the flat price, and no month end.
      p = await draw(fakeHass(SCENARIOS.midday), en);
      const lm = p._stats.lastMonth, m = p._stats.month, base = read(p);
      console.assert(base.cost === money(m.gridImportKwh * 0.3) && base.back === money(Math.max(0, m.loadKwh - m.gridImportKwh) * 0.3 + m.gridExportKwh * 0.1) && !base.end,
        "money month midday: this month from the statistics wrong", base);
      pickMonth(p, last);
      console.assert(read(p).cost === money(lm.gridImportKwh * 0.3), "money month midday: last month from the statistics wrong", read(p));
      // The bill's fixed part: on the cost and off the net; from an entity each month its own mean (10 this month, 12 last).
      const fixed = read(await draw(fakeHass(SCENARIOS.midday), en, { bill_fixed: 10 }));
      console.assert(Math.abs(value(fixed.cost) - value(base.cost) - 10) < 0.006 && Math.abs(value(fixed.net) - value(base.net) + 10) < 0.006, "money month: the bill's fixed part not on the cost and the net", fixed, base);
      p = await draw(fakeHass(SCENARIOS.midday), en, { bill_fixed: "sensor.bill_fixed" });
      const now10 = value(read(p).cost) - value(base.cost);
      pickMonth(p, last);
      console.assert(Math.abs(now10 - 10) < 0.006 && Math.abs(value(read(p).cost) - lm.gridImportKwh * 0.3 - 12) < 0.006, "money month: the bill's fixed part not the entity's mean of each month", now10, read(p));
      // A grid that cost more than the system brought: the net below 0, in the low colour.
      p = await draw(fakeHass(SCENARIOS.midday), en, { bill_fixed: 1000 });
      console.assert(value(read(p).net) < 0 && card(p).querySelector(".readout dd.neg") && card(p).querySelector(`[data-month="${k}"] i.neg`), "money month: a negative net not drawn below 0", read(p));
      // The zero line as high as the largest value below 0 needs: the largest above and below fill the bar together.
      const nets = [...card(p).querySelectorAll(".year i")].map((i) => parseFloat(i.style.getPropertyValue("--v")) * (i.classList.contains("neg") ? -1 : 1));
      const zero = parseFloat(card(p).querySelector(".year").style.getPropertyValue("--zero"));
      console.assert(Math.abs(Math.max(0, ...nets) - Math.min(0, ...nets) - 100) < 0.2 && Math.abs(zero + Math.min(0, ...nets)) < 0.2, "money month: bars not scaled from the zero line", nets, zero);
    }
    // Energy sent: saved and earned on the right, each named under them.
    const real = Date.now; // at 15:00, when today has sent some (see fakeStats)
    Date.now = () => new Date(real()).setHours(15, 0, 0, 0);
    try { p = await draw(fakeHass({ ...SCENARIOS.full, ahead: "sunny" }), en); } finally { Date.now = real; }
    console.assert(card(p)?.querySelector(".side.back span")?.textContent === t.savedEarned && said(p, t.savedLabel) && said(p, t.exportLabel), "money month with export: saved and earned not shown", card(p)?.innerHTML);
    // Export off: no selling price.
    p = await draw(fakeHass(SCENARIOS.exportOffFull), en, configOf(SCENARIOS.exportOffFull));
    console.assert(prices(p) === `${t.buyGrid}: ${money(0.3)} /kWh`, "prices, export off: a selling price", prices(p));
  }
}

// Check: payback and this month's days on the Money page. Time left walks each coming month like the same
// calendar month when last on record, else like seasonGuess (the average month without a latitude); a range only
// while there is less than a year on record.
{
  const t = STRINGS.en;
  const months = (from, values) => values.map((back, i) => ({ key: new Date(Date.UTC(from[0], from[1] - 1 + i, 1)).toISOString().slice(0, 7), back }));
  console.assert(JSON.stringify(paybackLeft(450, months([2026, 7], [100, 100, 100]), "2026-10")) === "[4,5,6]", "payback: 3 months of 100, 450 owed",
    paybackLeft(450, months([2026, 7], [100, 100, 100]), "2026-10"));
  const year = months([2025, 11], Array.from({ length: 12 }, (_, i) => 10 * (i + 1)));
  console.assert(JSON.stringify(paybackLeft(60, year, "2026-10")) === "[3,3,3]", "payback: a year on record, not walked by the same months", paybackLeft(60, year, "2026-10"));
  console.assert(paybackLeft(100, [], "2026-10") === null, "payback: time left with nothing on record");
  // This month brought 30 so far: its rest (100 less 30 at the mid, 120 less 30 at the best) comes back first.
  console.assert(JSON.stringify(paybackLeft(450, months([2026, 7], [100, 100, 100]), "2026-10", 30)) === "[3,4,5]", "payback: the rest of this month not counted",
    paybackLeft(450, months([2026, 7], [100, 100, 100]), "2026-10", 30));
  // Seasons: a plant at the home data's latitude whose house heats in winter (use per day falls as the sun
  // rises), 0.30 a kWh saved, 0.08 sent, 3 months on record from each month of the year. With a battery the
  // house's own share is 1 - e^(-1.2·sun/use), the model's own shape: the time left is right. Without one it
  // covers at most 40% of the use: within 25%, where the average month alone misses by more.
  // The month after the record is under way with nothing so far: it comes back first, so 1 more than said.
  {
    const keys = Array.from({ length: 24 }, (_, i) => new Date(Date.UTC(2025, i, 1)).toISOString().slice(0, 7));
    const plantOf = (cover) => keys.map((key) => {
      const [y, mo] = key.split("-").map(Number), days = new Date(Date.UTC(y, mo, 0)).getUTCDate(), sky = monthSun(key, 47.7) / days;
      const sun = 30 * sky * days, load = (24 - 2 * sky) * days, self = cover(sun, load), out = sun - self;
      return { key, sun, load, self, out, saved: 0.3 * self, earned: 0.08 * out, back: 0.3 * self + 0.08 * out };
    });
    const misses = (plant, at) => Array.from({ length: 12 }, (_, s) => {
      const rec = plant.slice(s, s + 3), got = rec.reduce((a, x) => a + x.back, 0);
      let rest = 9000 - got, n = 0;
      while (rest > 0) rest -= plant[(s + 3 + n++) % 12].back; // the same year again and again
      return Math.abs(paybackLeft(9000 - got, rec, keys[s + 3], 0, at)[1] + 1 - n) / n;
    });
    const most = (v) => Math.max(...v), shown = (v) => v.map((x) => x.toFixed(2)).join();
    const battery = plantOf((sun, use) => use * (1 - Math.exp(-1.2 * sun / use)));
    const none = plantOf((sun, use) => 0.4 * use * (1 - Math.exp(-2 * sun / (0.4 * use))));
    console.assert(most(misses(battery, { lat: 47.7 })) < 0.02, "payback: seasons not guessed, battery", shown(misses(battery, { lat: 47.7 })));
    console.assert(most(misses(none, { lat: 47.7 })) < 0.25 && most(misses(none)) > most(misses(none, { lat: 47.7 })), "payback: seasons not guessed, no battery",
      shown(misses(none, { lat: 47.7 })), shown(misses(none)));
    // Fallbacks: no latitude walks the average month; a month with no sun (snow) stays in the guess; nothing sent
    // yet prices the surplus at `sell`.
    const rec = battery.slice(9, 12), left = (r, at) => paybackLeft(9000, r, "2026-01", 0, at)[1];
    console.assert(left(rec) === left(rec, { lat: NaN }) && left(rec) !== left(rec, { lat: 47.7 }), "payback: no latitude not the average month");
    const snow = [{ ...rec[0], sun: 0, self: 0, out: 0, saved: 0, earned: 0, back: 0 }, ...rec.slice(1)];
    // Kept, not dropped: it pulls the sun's scale down, so June comes out lower than without it.
    const june = (r) => seasonGuess(r, 47.7, 0)?.("2026-06");
    console.assert(june(snow) > 0 && june(snow) < june(rec.slice(1)), "payback: a month with no sun not kept in the guess", june(snow), june(rec.slice(1)));
    const kept = rec.map((x) => ({ ...x, out: 0, earned: 0, back: x.saved }));
    console.assert(left(kept, { lat: 47.7, sell: 0.5 }) < left(kept, { lat: 47.7, sell: 0 }), "payback: nothing sent yet, surplus not at the selling price");
    // A year on record: every coming year walks those months, the guess plays no part (the true time exactly).
    // Only December on record in polar night: no sun to scale by, so no guess.
    const year = none.slice(0, 12), cycle = (owed) => { let n = 0; while (owed > 0) owed -= none[(13 + n++) % 12].back; return n; };
    console.assert(paybackLeft(20000, year, keys[12], 0, { lat: 47.7 })[1] === cycle(20000 - none[0].back), "payback: a year on record not walked again");
    console.assert(seasonGuess([{ key: "2025-12", sun: 3, load: 300, self: 3, out: 0, saved: 0.9, earned: 0, back: 0.9 }], 70, 0) === null, "payback: polar night scaled by nothing");
    // Installed on the 21st: October brought a third of its whole month's money. Gone by, the time left is the
    // true one (to the card's tenth of a year); counted as a whole month, it is too long.
    const ledger = battery.slice(9, 13).map((x, i) => (i ? x : { ...x, ...Object.fromEntries(["sun", "self", "out", "saved", "earned", "back"].map((k) => [k, x[k] / 3])) }));
    const years = (since) => +paybackCard(ledger, { cost: 9000, before: 0, since }, { t, f: formats("en", "EUR") }, true, { lat: 47.7 }).match(/About ([\d.]+) years/)?.[1];
    let owed = 9000 - ledger.reduce((a, x) => a + x.back, 0) - battery[12].back, after = 0; // January under way, nothing so far
    while (owed > 0) owed -= battery[(13 + after++) % 12].back;
    console.assert(Math.abs(years("2025-10-21") - after / 12) <= 0.1 && years("2025-10-01") - after / 12 > 0.5, "payback: a part install month not gone by",
      years("2025-10-21"), years("2025-10-01"), after / 12);
  }

  let p = await draw(fakeHass(SCENARIOS.sunny), en, configOf(SCENARIOS.sunny));
  const bars = [...p.shadowRoot.querySelectorAll("#money .recent .week li")], n = new Date(Date.now()).getDate();
  const shown = (sel) => [...p.shadowRoot.querySelectorAll(`${sel} .day:not([hidden])`)].map((d) => d.dataset.i).join();
  if (extras) {
    console.assert(bars.length === new Date(new Date(Date.now()).getFullYear(), new Date(Date.now()).getMonth() + 1, 0).getDate() && bars[n - 1].getAttribute("aria-current") === "true" && bars[n - 1].classList.contains("today") && shown("#money .recent") === String(n - 1)
      && $(p, "#money .recent .day:not([hidden]) .period")?.textContent === t.todaySoFar
      && [...p.shadowRoot.querySelectorAll("#money .recent .day:not([hidden]) dt")].map((d) => d.textContent).join() === [t.returns, t.gridCost, t.netBenefit].join()
      && !$(p, "#money .recent .month-total"), "money days: not a dot a day with today picked, or a month total (it is on Month balance)", bars.length);
    // ?gap=1 leaves a day unknown: payback then says it cannot add up, with no ring. The gap's day is the 2nd,
    // so only from the 3rd on (until then today's 5 minute rows count, not the 2nd's day row).
    if (q.get("gap") === "1" && new Date(Date.now()).getDate() > 2) console.assert($(p, "#money .payback .note")?.textContent === t.paybackIncomplete && !$(p, "#money .payback .ring"), "payback with a gap: not the incomplete note", $(p, "#money .payback")?.textContent);
    else console.assert(/^[\d,]+ €$/.test($(p, "#money .payback .ring-mid")?.textContent) && $(p, "#money .payback .ring .size")?.textContent === "9,000 €"
      && $(p, "#money .payback .ring-name")?.textContent === t.plantCost && $(p, "#money .payback .money").textContent.startsWith("About ")
      && !/%/.test($(p, "#money .payback").textContent), "payback: amount, cost, its name or time left missing, or a percentage shown", $(p, "#money .payback")?.textContent);
    // A day bar picks its own day; Energy's days keep today, also after a redraw.
    bars[0].click();
    p.hass = { ...p.hass }; await tick();
    console.assert(shown("#money .recent") === "0" && shown("#energy .daily") === String(n - 1), "money days: a pick moved Energy's, or was lost", shown("#money .recent"), shown("#energy .daily"));
  } else console.assert(!bars.length && !$(p, "#money .payback"), "money days or payback without prices");
  p = await draw(fakeHass(SCENARIOS.sunny), en, {});
  console.assert(!$(p, "#money .payback"), "payback without a system cost");
  // Paid back: the month it happened and what came back since, a check in the full ring; or no month when it was
  // paid before the records start. ?gap=1 leaves a day unknown, so neither adds up (see above).
  if (extras && q.get("gap") !== "1") {
    const since = new Date(localMidnight(270)).toISOString().slice(0, 7) + "-01";
    p = await draw(fakeHass(SCENARIOS.sunny), en, { system_cost: 500, install_date: since });
    console.assert(/^Paid back in \w+ \d{4}$/.test($(p, "#money .payback p").textContent) && /^Since then \+[\d,]+ € gained$/.test($(p, "#money .payback .money").textContent)
      && $(p, "#money .payback .ring-mid .done"), "payback paid: month, gain or check missing", $(p, "#money .payback")?.textContent);
    p = await draw(fakeHass(SCENARIOS.sunny), en, { system_cost: 500, saved_before: 600 });
    console.assert($(p, "#money .payback p").textContent === t.paidBack, "payback paid before the records: a month named", $(p, "#money .payback p").textContent);
  }
  // A battery in for 10 years shows the wear card above the advice; a new one does not.
  p = await draw(fakeHass(SCENARIOS.sunny), en, { battery_install_date: new Date(localMidnight(3700)).toISOString().slice(0, 10) });
  const wear = $(p, `[aria-label="${t.wearTitle}"]`);
  console.assert(wear?.textContent.trim() === t.wearAge.replace("{y}", 10) && wear.nextElementSibling?.getAttribute("aria-label") === t.adviceTitle, "wear: card missing, wrong or not above the advice", wear?.textContent);
  p = await draw(fakeHass(SCENARIOS.sunny), en, { battery_install_date: new Date(localMidnight(30)).toISOString().slice(0, 10) });
  console.assert(!$(p, `[aria-label="${t.wearTitle}"]`), "wear: card for a new battery");
}

// Check: hour by hour on Energy. With a battery: its hourly means as a line, the floor, and with the outlook
// (sunny) the rest of today as dashes. Above it a line each for the sun made, the house used and the grid
// gave, solid so far and dashed ahead, one hour picked on both charts. The hints name each hour: the charge and the energy for the hours past, the energy alone
// for this one, the forecast's charge after it. No forecast (midday): no dashes, no hints ahead. No battery:
// the energy alone.
{
  let p = await draw(fakeHass(SCENARIOS.sunny), en);
  const card = (p) => p.shadowRoot.querySelector("#energy .battday"), hints = (p) => [...card(p)?.querySelector(".hours24")?.querySelectorAll("[data-hint]") ?? []].map((h) => h.dataset.hint);
  // Hours since midnight and in all today: not the clock's hour on a day the clocks change.
  const m0 = localMidnight(), m1 = new Date(m0).setDate(new Date(m0).getDate() + 1);
  const past = Math.floor((Date.now() - m0) / 36e5), floor = card(p)?.querySelector(".floor");
  console.assert(card(p)?.querySelector(".past") && card(p).querySelector(".ahead") && +floor?.getAttribute("y1") === 100 - p._src.batt.floor && card(p).querySelector(".socline .series")
    && hints(p).length === Math.round((m1 - m0) / 36e5) && hints(p).slice(0, past).every((h) => /^At .*, the panels made .* the house used .* the grid gave .* and the battery was at \d+%\.$/.test(h)
      || (q.get("gap") === "1" && h.endsWith(STRINGS.en.noData))) // ?gap=1: 1:00 and 2:00 have no rows
    && / the panels made /.test(hints(p)[past]) && !/ battery /.test(hints(p)[past]) && hints(p).slice(past + 1).every((h) => /^At .*, the panels should make .* the grid give .* and the battery be at about \d+%\.$/.test(h))
    && (past === hints(p).length - 1 || card(p).querySelector(".series.later")?.getAttribute("d")),
    "hour by hour: charge line, dashes, floor, energy lines, their dashes or hour hints wrong", hints(p));
  // This hour picked at first on both charts, its sentence under them; a tap on the charge chart picks an hour on both.
  const picks = (p) => [...card(p).querySelectorAll(".hours24 li[aria-current]")].map((li) => li.dataset.i).join() + "|" + [...card(p).querySelectorAll(".day:not([hidden])")].map((d) => d.dataset.i).join();
  console.assert(picks(p) === `${past},${past}|${past}`, "hour by hour: this hour not picked on both charts", picks(p));
  // Now: one line on each chart at the same place, named once, over the top chart.
  const nowAt = [...card(p).querySelectorAll(".now-line")].map((l) => l.getAttribute("x1"));
  console.assert(nowAt.length === 2 && nowAt[0] === nowAt[1] && card(p).querySelectorAll(".now-label").length === 1 && card(p).querySelector(".charge > .now-label")?.textContent === STRINGS.en.nowMark,
    "hour by hour: now not marked on both charts, or not named once over the top one", nowAt);
  // This hour's dots sit on the now line on both charts, with an outlook for its rest too; each energy line
  // turns from solid to dashed there.
  const dotsAt = [...card(p).querySelectorAll(".hours24 li[aria-current] i")].map((i) => i.style.getPropertyValue("--x"));
  const turns = [...card(p).querySelectorAll(".socline .series.later")].filter((d) => d.getAttribute("d")).map((d) => +d.getAttribute("d").match(/^M([\d.]+)/)?.[1] - nowAt[0]);
  console.assert(dotsAt.length > 1 && new Set(dotsAt).size === 1 && turns.every((dx) => Math.abs(dx) < 0.02), "hour by hour: this hour's dots or dashes not at the now line", dotsAt, turns);
  card(p).querySelector(".charge .hours24 li").click();
  console.assert(past === 0 || (picks(p) === "0,0|0" && [...card(p).querySelectorAll(".day:not([hidden]) dt")].some((d) => d.textContent === STRINGS.en.battAvg)), "hour by hour: a tap on the charge chart not picked on both", picks(p));
  // Pointing at an hour of the energy chart shows it on both, with the same hint, and picks nothing.
  if (past > 0) {

    at.dispatchEvent(new PointerEvent("pointerover", { bubbles: true, composed: true }));

    console.assert(hovered === `${past - 1}|${past - 1}` && at.dataset.hint === rows[0].children[past - 1].dataset.hint && picks(p) === "0,0|0", "hour by hour: hover not shown on both charts, or it picked", hovered, picks(p));
    // A mouse dragged across with its button held picks nothing.
    const box = (li) => li.getBoundingClientRect();
    rows[0].children[0].dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, composed: true, isPrimary: true, pointerType: "mouse", buttons: 1 }));
    card(p).dispatchEvent(new PointerEvent("pointermove", { bubbles: true, composed: true, pointerType: "mouse", buttons: 1, clientX: box(at).left + 1, clientY: box(at).top + 1 }));
    card(p).dispatchEvent(new PointerEvent("pointerup", { bubbles: true, composed: true }));

// Check: ‹ and › beside a picked hour or day pick its neighbour, as a tap would, its figures shown, and are
// greyed where there is none that way; a month's go to the month beside on screen (see steps).
{
  const p = await draw(fakeHass(SCENARIOS.sunny), en), cards = [...p.shadowRoot.querySelectorAll("#energy .battday, #energy .daily, #money .recent")];
  const at = (c) => c.querySelector(":is(.week, .hours24) li[aria-current]")?.dataset.i + "|" + c.querySelector(".picked .day:not([hidden])")?.dataset.i;
  const off = (c) => [...c.querySelectorAll("[data-step]")].map((b) => b.getAttribute("aria-disabled") === "true").join();
  const tap = (c, by) => c.querySelector(`[data-step="${by}"]`).click();
  for (const c of cards) {
    // The last one a tap can pick: a day or an hour to come only with a forecast for it.
    const cells = [...c.querySelector(".week, .hours24").children], last = cells.findLastIndex((li) => !li.classList.contains("future"));
    const i = +c.querySelector(":is(.week, .hours24) li[aria-current]").dataset.i, start = at(c);
    console.assert(off(c) === `${i === 0},${i === last}`, `steps: ${c.dataset.pick}: not greyed only where nothing comes that way`, off(c), i, last);
    tap(c, 1);
    console.assert(at(c) === (i === last ? start : `${i + 1}|${i + 1}`), `steps: ${c.dataset.pick}: › did not pick the next one, or went past the last`, at(c));
    if (i < last) tap(c, -1);
    if (i === 0) continue;
    tap(c, -1);
    console.assert(at(c) === `${i - 1}|${i - 1}` && off(c) === `${i === 1},false`, `steps: ${c.dataset.pick}: ‹ did not pick the one before`, at(c), off(c));
    tap(c, 1);
    console.assert(at(c) === start, `steps: ${c.dataset.pick}: › did not go back`, at(c));
  }
  console.assert(cards.length === 2 + (extras ? 1 : 0), "steps: a picker without its ‹ and ›", cards.map((c) => c.dataset.pick));
  // Production's months: this month picked, ‹ to the one left of it, › to the one right (last year's December).
  const cur = clockOf(TZ)(Date.now()).key.slice(0, 7), month = (k) => p.shadowRoot.querySelector(`#energy .daily .year [data-month="${k}"]`)?.getAttribute("aria-pressed");
  const keys = [...p.shadowRoot.querySelectorAll("#energy .daily .year [data-month]")].map((b) => b.dataset.month), n = keys.indexOf(cur);
  const mstep = (cls) => p.shadowRoot.querySelector(`#energy .daily .total .step-${cls}`);
  console.assert(mstep("prev")?.dataset.month === keys[n - 1] && mstep("next")?.dataset.month === keys[n + 1] && (keys[n + 1] || mstep("next").getAttribute("aria-disabled") === "true"), "steps: month ‹ › not the months beside this one", keys, n);
  // In January this month is the first bar: ‹ has nothing to pick.
  if (n === 0) console.assert(mstep("prev")?.getAttribute("aria-disabled") === "true", "steps: month ‹ not off in January");
  else {
    mstep("prev").click();
    console.assert(month(keys[n - 1]) === "true" && mstep("next")?.dataset.month === cur, "steps: month ‹ did not pick the month before", keys[n - 1]);
  }
}

// Check: the share ring's lead lines on a winter morning (little sun, a small battery part, most from the grid),
// a sunny day (most from the sun), days where two parts are close (59 % sun, 59 % grid) and almost no sun with
// the grid a little over half:
// each stays at least 4 px off every other label and every other line, so none crosses another or a label.
for (const [today, out] of [[SCENARIOS.winter.today, 0.3], [[7.8, 6.1, 0.2, 0], 0.5], [[7.8, 6.1, 0.2, 0], 2.3], [[0.4, 6.0, 3.54, 0], 2.2], [[0.1, 6.0, 3.4, 0], 2.5]]) {
  const real = Date.now; // at 15:00, when today is these totals (see fakeStats)
  Date.now = () => new Date(real()).setHours(15, 0, 0, 0);
  const p = await draw(fakeHass({ ...SCENARIOS.winter, today, out }), en).finally(() => { Date.now = real; });
  document.body.append(p);
  const box = $(p, "#energy .ring-box"), labels = [...(box?.querySelectorAll(".part") ?? [])].map((l) => [l.classList[1], l.getBoundingClientRect()]);
  // Each lead as screen points every half unit, with its label's side: leads and labels both follow the parts' order.
  const leads = [...(box?.querySelectorAll(".lead") ?? [])].map((path, i) => {
    const m = path.getScreenCTM(), pts = [];
    for (let s = 0; s <= path.getTotalLength(); s += 0.5) { const q = path.getPointAtLength(s); pts.push([m.a * q.x + m.c * q.y + m.e, m.b * q.x + m.d * q.y + m.f]); }
    return [labels[i]?.[0], pts];
  });
  const off = (pt, r) => Math.hypot(Math.max(r.left - pt[0], 0, pt[0] - r.right), Math.max(r.top - pt[1], 0, pt[1] - r.bottom));
  const near = leads.flatMap(([side, pts]) => [...labels.filter(([s]) => s !== side).map(([s, r]) => [side, s, Math.min(...pts.map((pt) => off(pt, r)))]),
    ...leads.filter(([s]) => s !== side).map(([s, other]) => [side, `${s} line`, Math.min(...pts.flatMap((a) => other.map((b) => Math.hypot(a[0] - b[0], a[1] - b[1]))))])]).filter((x) => x[2] < 4);
  console.assert(leads.length === 3 && !near.length, "share ring: a lead line runs into another label or line", today, out, near);
  p.remove();
}

    console.assert(days[0]?.classList.contains("none") && days[0].dataset.hint.endsWith(t.noData) && days.filter((li) => li.classList.contains("none")).length === (q.get("gap") === "1" && n > 2 ? 2 : 1)
      && $(p, ".daily .day dt")?.textContent === t.noData, "days: a day with no rows not drawn as missing", days.map((li) => li.outerHTML));
    if (extras) console.assert($(p, ".recent .week li")?.classList.contains("none"), "money days: a day with no rows not kept empty");
  }
  if (hour >= 2) {

    console.assert(hint.endsWith(t.noData) && p.shadowRoot.querySelectorAll(".battday .socline .past").length === 2, "hour by hour: an hour with no rows not said, or its line not broken", hint);

  const today = $(p, "#energy .today"), noData = t.noData[0].toUpperCase() + t.noData.slice(1);

// Check: the sky. Cloud greys the day colours only (none under 50 %, fully grey at 90 %), so the night
// stays as it is. Rain shows from the sensor's present hour, else from a weather entity; a fresh sensor
// saying no rain wins over the entity.
{
  console.assert(greyOf(40) === 0 && greyOf(70) === 0.5 && greyOf(95) === 1 && greyOf(null) === 0, "sky: greyOf wrong", [40, 70, 95, null].map(greyOf));
  for (const d of [false, true]) console.assert(JSON.stringify(skyAt(-30, false, d, 1)) === JSON.stringify(skyAt(-30, false, d, 0)), `sky: cloud changes the night in the ${d ? "dark" : "light"} theme`);
  const spread = (c) => { const v = [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16)); return Math.max(...v) - Math.min(...v); };
  console.assert(spread(skyAt(42, false, false, 1).colors[0]) < spread(skyAt(42, false, false, 0).colors[0]), "sky: a grey day is not less saturated");
  // The day: a little of dawn (morning) or dusk (afternoon) while the sun is low, its own colours with a high sun.
  for (const d of [false, true]) {
    const pal = SKY[d ? "dark" : "light"], c = (e, r) => skyAt(e, r, d).colors[0];
    console.assert(JSON.stringify(skyAt(60, false, d).colors) === JSON.stringify(pal.day) && c(20, true) !== pal.day[0] && c(20, true) !== c(20, false) && c(35, true) !== c(20, true),
      `sky: the day does not follow the sun's height in the ${d ? "dark" : "light"} theme`);
    // A low noon: the sky turns from dawn to dusk by the sun's direction, without a jump when `rising` turns.
    const gap = (a, b) => Math.max(...[1, 3, 5].map((i) => Math.abs(parseInt(a.slice(i, i + 2), 16) - parseInt(b.slice(i, i + 2), 16))));
    console.assert(dawnOf({ azimuth: 90 }) === 1 && dawnOf({ azimuth: 270 }) === 0 && dawnOf({ azimuth: 180 }) === 0.5 && dawnOf({ azimuth: 0 }) === 0.5 && dawnOf({ rising: true }) === true && dawnOf({}) === false
      && gap(c(20, dawnOf({ azimuth: 179 })), c(20, dawnOf({ azimuth: 181 }))) <= 2 && c(20, dawnOf({ azimuth: 100 })) === c(20, 0.99),
      `sky: dawn and dusk do not follow the sun's direction in the ${d ? "dark" : "light"} theme`);
    console.assert(JSON.stringify(skyAt(-30, false, d).colors) === JSON.stringify(pal.night) && c(-8, false) !== pal.night[0] && c(-8, false) !== c(-8, true) && c(-12, false) !== c(-8, false),
      `sky: the night does not follow the sun's depth in the ${d ? "dark" : "light"} theme`);
  }
  const s1 = (p) => p.style.getPropertyValue("--sv-sky1"), rains = (p) => $(p, ".rain")?.hidden === false;
  const at = (k, grey) => skyAt(SCENARIOS[k].v[4], SCENARIOS[k].v[5], dark, grey).colors[0];
  let p = await draw(fakeHass(SCENARIOS.cloudy), en);
  console.assert(s1(p) === at("cloudy", greyOf(80)) && s1(p) !== at("cloudy", 0) && !rains(p), "sky cloudy: not greyed by the sensor's cloud, or rain", s1(p));
  p = await draw(fakeHass(SCENARIOS.sunny), en);
  console.assert(s1(p) === at("sunny", 0) && !rains(p), "sky sunny: greyed, or rain", s1(p));
  p = await draw(fakeHass(SCENARIOS.rain), en);
  console.assert(rains(p), "sky rain: no rain");
  p = await draw(fakeHass({ ...SCENARIOS.midday, weather: "rainy" }), en);
  console.assert(rains(p), "sky: a rainy weather entity without the sensor shows no rain");
  p = await draw(fakeHass({ ...SCENARIOS.sunny, weather: "rainy" }), en);
  console.assert(!rains(p), "sky: the weather entity won over a fresh sensor saying no rain");
  p = await draw(fakeHass({ ...SCENARIOS.stale, weather: "rainy" }), en);
  console.assert(rains(p), "sky: a stale sensor blocked the rainy weather entity");
  // Cloud the same way: a fresh sensor's present hour, else the weather entity's cloud cover now.
  p = await draw(fakeHass({ ...SCENARIOS.midday, weather: "cloudy", cover: 80 }), en);
  console.assert(s1(p) === at("midday", greyOf(80)), "sky: the weather entity's cloud cover does not grey the sky without the sensor", s1(p));
  p = await draw(fakeHass({ ...SCENARIOS.sunny, weather: "cloudy", cover: 95 }), en);
  console.assert(s1(p) === at("sunny", 0), "sky: the weather entity's cloud cover won over a fresh sensor", s1(p));
  // Snow: the weather entity alone. Snowy stops the rain the sensor reports (it counts snow as rain);
  // snowy-rainy shows both.
  const snows = (p) => $(p, ".snow")?.hidden === false;
  p = await draw(fakeHass({ ...SCENARIOS.rain, weather: "snowy" }), en);
  console.assert(snows(p) && !rains(p), "sky: snowy weather entity, no snow or still rain");
  p = await draw(fakeHass({ ...SCENARIOS.midday, weather: "snowy-rainy" }), en);
  console.assert(snows(p) && rains(p), "sky: snowy-rainy is not snow and rain");
  p = await draw(fakeHass(SCENARIOS.rain), en);
  console.assert(!snows(p), "sky: snow without the weather entity saying so");
}

// Check: the display switches. The gear opens a modal dialog of three labelled switches (the sky's), all
// on at first; closing it the way Escape does (requestClose: cancel, then close) gives focus back to the
// gear. Each switch turns off what it names, and turned on again brings it back. Only what is off is kept in localStorage, read when a panel is created; storage that throws
// keeps everything on and a switch still works for this view. Storage is left empty for the checks after.
{
  const SHOW = "solar-view-show";
  // A checkbox only fires change while connected.
  const flip = (p, n) => { document.body.append(p); $(p, `dialog input[name="${n}"]`)?.click(); p.remove(); };
  // A panel created with these switches off, as a reload would find them.
  const off = async (s, names) => {
    localStorage.setItem(SHOW, JSON.stringify(Object.fromEntries(names.map((n) => [n, false]))));
    const p = await draw(fakeHass(typeof s === "string" ? SCENARIOS[s] : s), en);
    localStorage.removeItem(SHOW);
    return p;
  };
  const s1 = (p) => p.style.getPropertyValue("--sv-sky1"), sky = SKY[dark ? "dark" : "light"];
  try {
    let p = await draw(fakeHass(SCENARIOS.sunny), en);
    attach(p); // showModal needs a connected dialog
    const gear = $(p, "button.gear"), dialog = $(p, "dialog");
    const switches = [...p.shadowRoot.querySelectorAll("dialog input[type=checkbox][role=switch]")];
    console.assert(gear?.getAttribute("aria-label")?.trim() && gear.querySelector("svg[aria-hidden=true]"), "switches: the gear is not a button with a name", gear?.outerHTML);
    gear?.focus(); gear?.click();
    console.assert(dialog?.open && dialog.matches(":modal"), "switches: the gear does not open a modal dialog");
    console.assert(switches.length === 3 && switches.every((s) => s.checked && s.labels?.[0]?.textContent.trim()), "switches: not three labelled switches, all on", switches.map((s) => s.labels?.[0]?.textContent));
    console.assert(JSON.stringify(switches.map((s) => s.name)) === JSON.stringify(SWITCH_NAMES), "switches: the drawer's names differ from the gear's", switches.map((s) => s.name));
    if (dialog?.requestClose) dialog.requestClose();
    else if (dialog?.dispatchEvent(new Event("cancel", { cancelable: true }))) dialog.close();
    await tick();
    console.assert(dialog && !dialog.open && p.shadowRoot.activeElement === gear, "switches: closing does not give focus back to the gear", p.shadowRoot.activeElement);
    p.remove();

    // The sky: no rain, no grey, and without the sun's height straight from night to day (stars as at night).
    p = await off("rain", ["rain"]);
    console.assert($(p, ".rain")?.hidden === true, "switches: rain still falls");
    p = await off({ ...SCENARIOS.midday, weather: "snowy-rainy" }, ["rain"]);
    console.assert($(p, ".snow")?.hidden === true && $(p, ".rain")?.hidden === true, "switches: snow still falls with rain off");
    p = await off("cloudy", ["clouds"]);
    console.assert(s1(p) === skyAt(SCENARIOS.cloudy.v[4], false, dark, 0).colors[0], "switches: clouds still grey the sky", s1(p));
    p = await off("dawn", ["sunHeight"]);
    console.assert(s1(p) === sky.day[0], "switches: sun height off, dawn is not the day sky", s1(p));
    p = await off({ ...SCENARIOS.evening, v: [0, 350, 0, 60, -3, true] }, ["sunHeight"]);
    console.assert(s1(p) === sky.night[0] && p.style.getPropertyValue("--stars") === (dark ? "0.70" : "0"), "switches: sun height off, first light is not the night sky", s1(p));

    // Kept for a reload: only what is off, and a new panel starts from it.
    p = await draw(fakeHass(SCENARIOS.rain), en);
    flip(p, "rain");
    const kept = localStorage.getItem(SHOW), again = await draw(fakeHass(SCENARIOS.rain), en);
    localStorage.removeItem(SHOW);
    console.assert(kept === '{"rain":false}' && $(again, ".rain")?.hidden === true && $(again, 'input[name="rain"]')?.checked === false, "switches: not kept for a reload", kept);

    // Storage that throws, on every call or already on reading localStorage: everything drawn, a switch still works.
    const real = Object.getOwnPropertyDescriptor(window, "localStorage");
    const fail = () => { throw new DOMException("blocked", "SecurityError"); };
    for (const blocked of [{ value: { getItem: fail, setItem: fail, removeItem: fail } }, { get: fail }]) {
      let errors = 0;
      const count = () => errors++;
      Object.defineProperty(window, "localStorage", { ...blocked, configurable: true });
      addEventListener("error", count);
      try {
        p = await draw(fakeHass(SCENARIOS.rain), en);
        const all = $(p, ".rain")?.hidden === false;
        flip(p, "rain");
        console.assert(all && $(p, ".rain")?.hidden === true && !errors, "switches: storage that throws hides something, or a switch threw", errors);
      } finally {
        removeEventListener("error", count);
        Object.defineProperty(window, "localStorage", real);
      }
    }

    // No NaN on any page with any switch off, one at a time and all at once.
    const names = switches.map((s) => s.name);
    for (const n of [...names.map((x) => [x]), names]) {
      p = await off("sunny", n);
      console.assert(!p.shadowRoot.innerHTML.includes("NaN"), `switches: NaN with ${n} off`);
    }
  } catch (e) {
    console.assert(false, "switches: threw", e);
  } finally {
    localStorage.removeItem(SHOW);
  }
}

// Check: the marks of the rings and bars (solid fills, outlines, whiskers) reach 3:1 against the
// lightest sky colour of their theme, the fully grey day and white (light theme) included (WCAG 2
// contrast). The tokens, then what a sunny panel really draws: the power origin rings (Energy), the next
// hours' bars and whiskers, the coming days' pills, the days' bars, the hours' bars, the battery and payback
// rings, the gear.
{
  // "#rrggbb" or a computed "rgb(r, g, b)"; anything see-through gives null.
  const hex = (c) => {
    const v = /^#[0-9a-f]{6}$/i.test(c) ? [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16)) : c.match(/^rgb\((\d+), (\d+), (\d+)\)$/)?.slice(1).map(Number);
    return v && "#" + v.map((x) => x.toString(16).padStart(2, "0")).join("");
  };
  const lum = (hex) => {
    const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255).map((v) => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  };
  const ratio = (a, b) => (Math.max(lum(a), lum(b)) + 0.05) / (Math.min(lum(a), lum(b)) + 0.05);
  const seen = [];
  for (const darkMode of [false, true]) {
    const theme = darkMode ? "dark" : "light";
    const p = await draw({ ...fakeHass({ ...SCENARIOS.sunny, hourly: { solarKwh: 0.5 } }), themes: { darkMode } });
    document.body.append(p); // custom properties are only computed on a connected element
    const style = getComputedStyle(p);
    const sky = Object.values(SKY[theme]).flatMap((c) => c.slice(0, 3)).concat(skyAt(90, false, darkMode, 1).colors.slice(0, 3), darkMode ? [] : ["#ffffff"]);
    const lightest = sky.reduce((a, b) => (lum(b) > lum(a) ? b : a));
    const marks = ["--sun", "--home", "--batt", "--grid", "--sent", "--low"].map((name) => [name, (style.getPropertyValue(`${name}-mark`) || style.getPropertyValue(name)).trim()]);
    const drawn = { "share rings": "#energy .today .ring .val", "battery ring": ".battery .ring :is(.val,.ghost,.range)", "battery today line": [".socline .past", "stroke"], "picked month bar": [".year [aria-pressed=true] i:not(.ghost)", "backgroundColor"], "chart line": [".socline .series", "stroke"], gear: ".gear svg",
      "coming days pill": [".days .track i", "backgroundColor"], "day dot": [".week li:not(.today,.ahead) .col i", "backgroundColor"], "today outline": [".week li.today .col i", "outlineColor"] };
    for (const [what, how] of Object.entries(drawn)) {
      const [sel, prop = "stroke"] = [].concat(how);
      const colors = new Set([...p.shadowRoot.querySelectorAll(sel)].map((el) => getComputedStyle(el)[prop]));
      // On the 1st the month has only today, a hollow dot.
      // ?gap=1 leaves this month (the one picked) without a total, so without a bar.
      console.assert(colors.size ||(what === "day dot" && new Date(Date.now()).getDate() === 1) || (what === "picked month bar" && q.get("gap") === "1"),
        `contrast: no ${what} drawn in the ${theme} theme`);
      for (const c of colors) marks.push([what, hex(c) || c]);
    }
    for (const [name, color] of marks) {
      const r = /^#[0-9a-f]{6}$/i.test(color) ? ratio(color, lightest) : 0;
      seen.push(`${theme} ${name} ${color} ${r.toFixed(2)}`);
      console.assert(r >= 3, `contrast: ${name} ${color} on ${lightest} is ${r.toFixed(2)} in the ${theme} theme`);
    }
    p.remove();
  }
  console.log("contrast of the marks:", seen.join(", "));
}
