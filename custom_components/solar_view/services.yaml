set_month_prices:
  fields:
    month:
      required: true
      example: "2026-09"
      selector:
        text:
    f1:
      example: 0.28
      selector: &price
        number:
          min: 0
          step: 0.00001
          unit_of_measurement: "EUR/kWh"
          mode: box
    f2:
      example: 0.26
      selector: *price
    f3:
      example: 0.24
      selector: *price
    f23:
      example: 0.25
      selector: *price
    fixed:
      example: 12.5
      selector:
        number:
          step: 0.01
          unit_of_measurement: "EUR"
          mode: box
